<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jeu d'association | JeParle Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root { --bleu: #1a3a5c; --rouge: #c0392b; --creme: #f9f5ef; --texte: #2c2c2c; --gris: #6b6b6b; --blanc: #ffffff; --vert: #1a7a4a; --ombre: 0 2px 24px rgba(26,58,92,0.10); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; color: var(--texte); background: var(--creme); min-height: 100vh; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; height: 64px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(26,58,92,0.08); box-shadow: var(--ombre); }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--bleu); text-decoration: none; }
.nav-logo span { color: var(--rouge); }
.nav-back { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--gris); font-size: 0.9rem; transition: color 0.2s; }
.nav-back:hover { color: var(--bleu); }
.nav-back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.page-header { background: var(--bleu); padding: 100px 5vw 50px; position: relative; overflow: hidden; }
.page-header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 80% 50%, rgba(42,82,152,0.5) 0%, transparent 70%); }
.page-header-inner { position: relative; z-index: 1; }
.page-eyebrow { font-size: 0.75rem; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 0.75rem; }
.page-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 5vw, 3rem); color: var(--blanc); line-height: 1.1; margin-bottom: 0.5rem; }
.page-header p { font-size: 1rem; color: rgba(255,255,255,0.65); font-weight: 300; }
.main { max-width: 600px; margin: 0 auto; padding: 2.5rem 5vw 5rem; }

/* Progress */
.progress-bar-wrap { height: 6px; background: rgba(26,58,92,0.12); border-radius: 99px; margin-bottom: 0.5rem; overflow: hidden; }
.progress-bar-fill { height: 100%; background: var(--vert); border-radius: 99px; transition: width 0.4s ease; }
.progress-label { font-size: 0.82rem; color: var(--gris); margin-bottom: 1.5rem; display: flex; justify-content: space-between; }
.score-badge { font-weight: 500; color: var(--vert); }

/* Question card */
.question-card { background: var(--blanc); border-radius: 16px; border: 1px solid rgba(26,58,92,0.08); overflow: hidden; margin-bottom: 1.5rem; text-align: center; }
.question-label { font-size: 0.78rem; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gris); padding: 1rem 1rem 0; }
.question-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
.question-img-placeholder { width: 100%; aspect-ratio: 4/3; background: var(--creme); display: flex; align-items: center; justify-content: center; font-size: 5rem; }
.question-mot { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--bleu); padding: 0.75rem 1rem 0.5rem; }
.audio-play-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--bleu); color: var(--blanc); border: none; border-radius: 20px; padding: 7px 16px; font-size: 0.82rem; font-family: 'DM Sans', sans-serif; cursor: pointer; margin-bottom: 1rem; transition: opacity 0.2s; }
.audio-play-btn:hover { opacity: 0.85; }
.audio-play-btn.playing { background: var(--vert); }
.audio-play-btn svg { width: 14px; height: 14px; fill: white; }

/* Choix */
.choices-label { font-size: 0.82rem; color: var(--gris); text-align: center; margin-bottom: 0.75rem; }
.choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { background: var(--blanc); border: 1.5px solid rgba(26,58,92,0.1); border-radius: 12px; padding: 0.75rem; text-align: center; cursor: pointer; transition: all 0.15s; user-select: none; }
.choice:active { transform: scale(0.97); }
.choice.correct { border-color: var(--vert); background: #f0faf5; }
.choice.wrong { border-color: var(--rouge); background: #fdf0ef; }
.choice.disabled { pointer-events: none; opacity: 0.5; }
.choice-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; display: block; margin-bottom: 6px; }
.choice-img-placeholder { width: 100%; aspect-ratio: 1/1; background: var(--creme); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin-bottom: 6px; }
.choice-mot { font-size: 0.82rem; font-weight: 500; color: var(--texte); line-height: 1.3; }
.choice.correct .choice-mot { color: var(--vert); }
.choice.wrong .choice-mot { color: var(--rouge); }

/* Feedback */
.feedback { text-align: center; min-height: 32px; font-size: 1rem; font-weight: 500; margin: 1rem 0; transition: opacity 0.2s; }
.feedback.bon { color: var(--vert); }
.feedback.mal { color: var(--rouge); }

/* Score final */
.score-final { background: var(--blanc); border-radius: 16px; border: 1px solid rgba(26,58,92,0.08); padding: 3rem 2rem; text-align: center; display: none; }
.score-final h2 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--bleu); margin-bottom: 0.5rem; }
.score-final .score-num { font-size: 4rem; font-weight: 500; color: var(--vert); line-height: 1; margin: 1rem 0; }
.score-final p { color: var(--gris); margin-bottom: 2rem; }
.btn-rejouer { background: var(--bleu); color: var(--blanc); border: none; border-radius: 10px; padding: 0.85rem 2rem; font-size: 1rem; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: opacity 0.2s; }
.btn-rejouer:hover { opacity: 0.85; }

/* Loading */
.loading { text-align: center; padding: 4rem 2rem; color: var(--gris); }
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">JeParle<span>Français</span>.ca</a>
  <a class="nav-back" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Retour
  </a>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <p class="page-eyebrow">Activités · Jeu interactif</p>
    <h1>Associez activité et équipement</h1>
    <p>Trouvez l'image qui correspond à chaque activité</p>
  </div>
</div>

<div class="main">
  <div id="loading" class="loading">Chargement du jeu...</div>

  <div id="jeu" style="display:none">
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="progress-label">
      <span id="progress-label">Question 1 / 10</span>
      <span class="score-badge" id="score-label">0 bonne réponse</span>
    </div>

    <div class="question-card">
      <div class="question-label">Quelle image correspond à...</div>
      <div id="question-img-wrap"></div>
      <div class="question-mot" id="question-mot"></div>
      <button class="audio-play-btn" id="audio-btn" onclick="jouerAudioQuestion()" style="display:none">
        <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Écouter
      </button>
    </div>

    <div class="choices-label">Choisissez la bonne image</div>
    <div class="choices-grid" id="choices-grid"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="score-final" id="score-final">
    <h2>Bravo !</h2>
    <div class="score-num" id="score-num"></div>
    <p id="score-msg"></p>
    <button class="btn-rejouer" onclick="startGame()">🔄 Rejouer</button>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o",
  authDomain: "audio-francisation.firebaseapp.com",
  projectId: "audio-francisation",
  storageBucket: "audio-francisation.firebasestorage.app",
  messagingSenderId: "840403407027",
  appId: "1:840403407027:web:46b370498fde6374aaa0c6"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let cartesSports = [], cartesMateriel = [], questions = [], qIndex = 0, score = 0, answered = false, currentAudio = null;

async function loadCartes() {
  const [snapSports, snapMateriel] = await Promise.all([
    getDocs(collection(db, 'vocabulaire-sports')),
    getDocs(collection(db, 'materiel-equipement'))
  ]);
  const docsSports = snapSports.docs.map(d => ({ id: d.id, ...d.data() }));
  const docsMateriel = snapMateriel.docs.map(d => ({ id: d.id, ...d.data() }));
  cartesSports = docsSports.filter(c => c.categorie && c.image);
  cartesMateriel = docsMateriel.filter(c => c.categorie && c.image);
  if (cartesSports.length < 2 || cartesMateriel.length < 4) {
    document.getElementById('loading').textContent = 'Pas assez de cartes avec une catégorie. Ajoutez des catégories dans l\'admin.';
    return;
  }
  document.getElementById('loading').style.display = 'none';
  startGame();
}

window.startGame = function() {
  score = 0; qIndex = 0; answered = false;
  document.getElementById('score-final').style.display = 'none';
  document.getElementById('jeu').style.display = 'block';

  // Trouver les sports qui ont au moins 1 équipement correspondant dans matériel
  const sportsValides = cartesSports.filter(sport =>
    cartesMateriel.some(m => m.categorie === sport.categorie)
  );

  if (sportsValides.length < 2) {
    document.getElementById('jeu').innerHTML = '<p style="text-align:center;color:var(--gris);padding:3rem">Ajoutez des catégories identiques dans les deux admins (sports et matériel).</p>';
    return;
  }

  // Construire 10 questions
  const shuffled = shuffle([...sportsValides]);
  questions = [];
  for (let i = 0; i < shuffled.length && questions.length < 10; i++) {
    const sport = shuffled[i % shuffled.length];

    // Bonne réponse : un équipement de la même catégorie
    const bonnesOptions = cartesMateriel.filter(m => m.categorie === sport.categorie);
    const bonneCarte = bonnesOptions[Math.floor(Math.random() * bonnesOptions.length)];

    // 3 mauvais choix : équipements d'autres catégories
    const mauvaisOptions = cartesMateriel.filter(m => m.categorie !== sport.categorie);
    if (mauvaisOptions.length < 3) continue;
    const mauvais = shuffle(mauvaisOptions).slice(0, 3);

    const choix = shuffle([bonneCarte, ...mauvais]);
    questions.push({ question: sport, correctId: bonneCarte.id, choix });
  }
  questions = questions.slice(0, 10);
  afficherQuestion();
};

function afficherQuestion() {
  answered = false;
  const q = questions[qIndex];
  const total = questions.length;

  // Progress
  document.getElementById('progress-fill').style.width = (qIndex / total * 100) + '%';
  document.getElementById('progress-label').textContent = `Question ${qIndex + 1} / ${total}`;
  document.getElementById('score-label').textContent = score === 1 ? '1 bonne réponse' : `${score} bonnes réponses`;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  // Question
  const qImgWrap = document.getElementById('question-img-wrap');
  if (q.question.image) {
    qImgWrap.innerHTML = `<img class="question-img" src="${q.question.image}" alt="${q.question.mot}"/>`;
  } else {
    qImgWrap.innerHTML = `<div class="question-img-placeholder">🏃</div>`;
  }
  document.getElementById('question-mot').innerHTML = q.question.mot.split('/').map(s => s.trim()).join('<br/>');

  // Bouton audio
  const audioBtn = document.getElementById('audio-btn');
  if (q.question.audio) {
    audioBtn.style.display = 'inline-flex';
    audioBtn.classList.remove('playing');
  } else {
    audioBtn.style.display = 'none';
  }

  // Choix
  const grid = document.getElementById('choices-grid');
  grid.innerHTML = q.choix.map((c, i) => `
    <div class="choice" id="choice-${i}" onclick="choisir(${i}, '${c.id}')">
      ${c.image ? `<img class="choice-img" src="${c.image}" alt="${c.mot}"/>` : `<div class="choice-img-placeholder">🖼</div>`}
      <div class="choice-mot">${c.mot.split('/').map(s => s.trim()).join('<br/>')}</div>
    </div>
  `).join('');
}

window.jouerAudioQuestion = function() {
  const q = questions[qIndex];
  if (!q.question.audio) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const btn = document.getElementById('audio-btn');
  const audio = new Audio(q.question.audio);
  currentAudio = audio;
  btn.classList.add('playing');
  btn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg> En cours...';
  audio.play();
  audio.onended = () => {
    btn.classList.remove('playing');
    btn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg> Écouter';
    currentAudio = null;
  };
};

window.choisir = function(i, cardId) {
  if (answered) return;
  const q = questions[qIndex];
  const el = document.getElementById('choice-' + i);
  const feedback = document.getElementById('feedback');

  if (cardId === q.correctId) {
    answered = true;
    el.classList.add('correct');
    score++;
    feedback.textContent = '✓ Bonne réponse !';
    feedback.className = 'feedback bon';
    document.querySelectorAll('.choice').forEach(c => c.classList.add('disabled'));

    // Jouer l'audio de la bonne réponse
    const bonneCarteAudio = q.choix.find(c => c.id === q.correctId);
    if (bonneCarteAudio && bonneCarteAudio.audio) {
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      const audio = new Audio(bonneCarteAudio.audio);
      currentAudio = audio;
      audio.play();
      audio.onended = () => { currentAudio = null; };
    }

    setTimeout(() => {
      qIndex++;
      if (qIndex >= questions.length) {
        finJeu();
      } else {
        afficherQuestion();
      }
    }, 1800);
  } else {
    el.classList.add('wrong');
    feedback.textContent = '✗ Essaie encore !';
    feedback.className = 'feedback mal';
    setTimeout(() => {
      el.classList.remove('wrong');
      feedback.textContent = '';
      feedback.className = 'feedback';
    }, 800);
  }
};

function finJeu() {
  document.getElementById('jeu').style.display = 'none';
  const sf = document.getElementById('score-final');
  sf.style.display = 'block';
  const total = questions.length;
  document.getElementById('score-num').textContent = `${score} / ${total}`;
  let msg = '';
  const pct = score / total;
  if (pct === 1) msg = 'Parfait ! Tu as tout réussi ! 🎉';
  else if (pct >= 0.8) msg = 'Excellent travail ! 👏';
  else if (pct >= 0.6) msg = 'Bien ! Continue à pratiquer.';
  else msg = 'Continue à pratiquer, tu vas y arriver !';
  document.getElementById('score-msg').textContent = msg;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

loadCartes();
</script>
</body>
</html>
