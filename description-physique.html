<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>La description physique | JeParle Français</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root { --bleu: #1a3a5c; --bleu-clair: #2a5298; --rouge: #c0392b; --creme: #f9f5ef; --texte: #2c2c2c; --gris: #6b6b6b; --blanc: #ffffff; --vert: #1a7a4a; --ombre: 0 8px 30px rgba(26,58,92,0.12); }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'DM Sans', sans-serif; color: var(--texte); background: var(--creme); }
nav { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; height: 64px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(26,58,92,0.08); }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--bleu); text-decoration: none; }
.nav-logo span { color: var(--rouge); }
.nav-back { color: var(--gris); font-size: 0.9rem; text-decoration: none; }
.nav-back:hover { color: var(--bleu); }
.page-header { background: linear-gradient(135deg, var(--bleu), var(--bleu-clair)); color: #fff; padding: 2.25rem 5vw 2.5rem; }
.page-header .eyebrow { font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.7; }
.page-header h1 { font-family: 'Playfair Display', serif; font-size: 2.1rem; margin-top: 0.3rem; }
.page-header p { opacity: 0.85; margin-top: 0.4rem; font-size: 0.95rem; }
.page-header .jeu-cta { display: inline-block; margin-top: 1.25rem; background: var(--rouge); color: #fff; text-decoration: none; padding: 0.7rem 1.5rem; border-radius: 10px; font-weight: 600; font-size: 0.95rem; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 5vw 4rem; }
.cat-titre { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--bleu); margin: 2rem 0 1rem; }
.cat-titre:first-child { margin-top: 0.5rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
.carte { background: var(--blanc); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 14px rgba(26,58,92,0.08); cursor: pointer; border: 2px solid transparent; transition: transform 0.12s, box-shadow 0.2s, border-color 0.2s; }
.carte:hover { transform: translateY(-4px); box-shadow: var(--ombre); }
.carte:active { transform: scale(0.98); }
.carte.playing { border-color: var(--vert); }
.carte-img { position: relative; width: 100%; aspect-ratio: 1; background: var(--creme); }
.carte-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.carte-img .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: rgba(26,58,92,0.25); }
.play-overlay { position: absolute; bottom: 8px; right: 8px; width: 40px; height: 40px; border-radius: 50%; background: rgba(26,58,92,0.85); display: flex; align-items: center; justify-content: center; }
.carte.playing .play-overlay { background: var(--vert); }
.play-overlay svg { width: 16px; height: 16px; fill: #fff; margin-left: 2px; }
.carte-body { padding: 0.75rem 0.85rem 0.9rem; text-align: center; }
.carte-mot { font-weight: 500; color: var(--bleu); font-size: 1.02rem; line-height: 1.2; }
.chargement { text-align: center; color: var(--gris); padding: 3rem; }
.vide { text-align: center; color: var(--gris); padding: 2rem; }
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">JeParle<span>Français</span></a>
  <a class="nav-back" href="index.html">‹ Retour</a>
</nav>
<div class="page-header">
  <p class="eyebrow">Vocabulaire · La description physique</p>
  <h1>La description physique</h1>
  <p>Clique sur une image pour entendre le mot</p>
  <a class="jeu-cta" href="jeu-description-physique.html">🎧 Jouer : écouter et trouver la bonne personne</a>
</div>

<div class="wrap">
  <div id="sections"></div>
  <div id="chargement" class="chargement">Chargement…</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o",
  authDomain: "audio-francisation.firebaseapp.com",
  projectId: "audio-francisation",
  storageBucket: "audio-francisation.firebasestorage.app",
  messagingSenderId: "840403407027",
  appId: "1:840403407027:web:46b370498fde6374aaa0c6"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COL = 'description-physique';

const CATS = [
  { cle: 'taille', nom: 'La taille' },
  { cle: 'corpulence', nom: 'La silhouette' },
  { cle: 'teint', nom: 'Le teint' },
  { cle: 'couleur-cheveux', nom: 'La couleur des cheveux' },
  { cle: 'longueur-cheveux', nom: 'La longueur des cheveux' },
  { cle: 'forme-cheveux', nom: 'La forme des cheveux' },
  { cle: 'coiffure', nom: 'La coiffure' },
  { cle: 'couleur-yeux', nom: 'La couleur des yeux' },
  { cle: 'barbe-moustache', nom: 'Barbes et moustaches' },
  { cle: 'particularites', nom: 'Les particularités physiques' },
  { cle: 'age', nom: 'L\'âge approximatif' },
  { cle: 'accessoires', nom: 'Les accessoires' }
];

let player = null;
function jouer(dataUrl, carte) {
  if (!dataUrl) return;
  document.querySelectorAll('.carte.playing').forEach(c => c.classList.remove('playing'));
  if (!player) { player = new Audio(); player.setAttribute('playsinline', ''); }
  player.onended = () => carte.classList.remove('playing');
  player.src = dataUrl;
  carte.classList.add('playing');
  player.play().catch(() => carte.classList.remove('playing'));
}

function carteHtml(c) {
  const div = document.createElement('div');
  div.className = 'carte';
  const img = c.image
    ? `<img src="${c.image}" alt="${c.mot || ''}"/>`
    : `<span class="ph">🕑</span>`;
  div.innerHTML = `
    <div class="carte-img">${img}
      <div class="play-overlay"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>
    </div>
    <div class="carte-body"><div class="carte-mot">${(c.mot || '').split('/').map(s=>s.trim()).join('<br/>')}</div></div>`;
  div.onclick = () => jouer(c.audio, div);
  return div;
}

async function charger() {
  const snap = await getDocs(collection(db, COL));
  const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  document.getElementById('chargement').style.display = 'none';
  const cont = document.getElementById('sections');
  if (!items.length) { cont.innerHTML = '<div class="vide">Aucune carte pour le moment.</div>'; return; }
  cont.innerHTML = '';
  // sections dans l'ordre défini, + "Non classé" à la fin
  const ordreCats = CATS.concat([{ cle: '', nom: 'Non classé' }]);
  ordreCats.forEach(cat => {
    const dansCat = items.filter(i => (i.categorie || '') === cat.cle)
      .sort((a,b) => (a.ordre ?? 99) - (b.ordre ?? 99));
    if (!dansCat.length) return;
    const titre = document.createElement('div');
    titre.className = 'cat-titre';
    titre.textContent = cat.nom;
    cont.appendChild(titre);
    const grid = document.createElement('div');
    grid.className = 'grid';
    dansCat.forEach(c => grid.appendChild(carteHtml(c)));
    cont.appendChild(grid);
  });
}
charger();
</script>
</body>
</html>
