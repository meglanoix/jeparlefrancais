<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>La famille rapprochée | JeParle Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root { --bleu: #1a3a5c; --bleu-clair: #2a5298; --rouge: #c0392b; --creme: #f9f5ef; --texte: #2c2c2c; --gris: #6b6b6b; --blanc: #ffffff; --vert: #1a7a4a; --ombre: 0 2px 24px rgba(26,58,92,0.10); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; color: var(--texte); background: var(--creme); min-height: 100vh; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; height: 64px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(26,58,92,0.08); box-shadow: var(--ombre); }
.nav-back { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--gris); font-size: 0.9rem; transition: color 0.2s; }
.nav-back:hover { color: var(--bleu); }
.nav-back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--bleu); text-decoration: none; }
.nav-logo span { color: var(--rouge); }
.page-header { background: var(--bleu); padding: 100px 5vw 44px; position: relative; overflow: hidden; }
.page-header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 80% 50%, rgba(42,82,152,0.5) 0%, transparent 70%); }
.page-header-inner { position: relative; z-index: 1; }
.page-eyebrow { font-size: 0.75rem; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 0.75rem; }
.page-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.8rem); color: var(--blanc); line-height: 1.1; margin-bottom: 0.5rem; }
.page-header p { font-size: 0.95rem; color: rgba(255,255,255,0.65); font-weight: 300; max-width: 620px; }
.main { max-width: 760px; margin: 0 auto; padding: 2.5rem 5vw 5rem; }
.consigne { text-align: center; font-size: 1.05rem; color: var(--bleu); font-weight: 500; min-height: 1.6em; margin-bottom: 1.75rem; transition: color 0.2s; }
.arbre { max-width: 620px; margin: 0 auto; }
.arbre-rang { display: flex; justify-content: center; gap: clamp(30px, 12vw, 120px); }
.couple-wrap { position: relative; display: flex; justify-content: center; gap: clamp(30px, 12vw, 120px); }
.couple-wrap::before { content: ''; position: absolute; top: 50%; left: 25%; right: 25%; height: 3px; background: rgba(26,58,92,0.25); z-index: 0; }
.connecteurs { position: relative; height: 46px; }
.connecteurs::before { content: ''; position: absolute; top: 0; left: 50%; width: 3px; height: 23px; background: rgba(26,58,92,0.25); transform: translateX(-50%); }
.connecteurs::after { content: ''; position: absolute; top: 23px; left: 25%; right: 25%; height: 3px; background: rgba(26,58,92,0.25); }
.connecteurs .branche { position: absolute; top: 23px; width: 3px; height: 23px; background: rgba(26,58,92,0.25); }
.connecteurs .branche.gauche { left: 25%; }
.connecteurs .branche.droite { right: 25%; transform: translateX(3px); }
.person { position: relative; z-index: 1; background: var(--blanc); border: 2.5px solid rgba(26,58,92,0.10); border-radius: 16px; padding: 10px 10px 14px; cursor: pointer; text-align: center; width: clamp(120px, 34vw, 150px); transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s, opacity 0.2s; }
.person .photo { width: 100%; aspect-ratio: 1/1; border-radius: 10px; background: var(--creme); overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
.person .photo img { width: 100%; height: 100%; object-fit: cover; }
.person .photo .ph { font-size: 2.6rem; color: rgba(26,58,92,0.25); }
.person .nom { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--bleu); }
.person:hover { transform: translateY(-2px); }
.person.selected { border-color: var(--bleu); box-shadow: 0 0 0 3px rgba(26,58,92,0.15); }
.person.cible { border-color: var(--vert); box-shadow: 0 0 0 3px rgba(26,122,74,0.22); animation: lueur 1.2s ease-in-out infinite; }
@keyframes lueur { 0%,100% { box-shadow: 0 0 0 3px rgba(26,122,74,0.18); } 50% { box-shadow: 0 0 0 6px rgba(26,122,74,0.28); } }
.person.inactive { opacity: 0.45; cursor: default; pointer-events: none; }
.person.playing { border-color: var(--rouge); box-shadow: 0 0 0 3px rgba(192,57,43,0.25); }
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">JeParle<span>Français</span>.ca</a>
  <a class="nav-back" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Retour à l'accueil
  </a>
</nav>
<div class="page-header">
  <div class="page-header-inner">
    <p class="page-eyebrow">La famille</p>
    <h1>La famille rapprochée</h1>
    <p>Cliquez sur une personne, puis sur une autre pour entendre leur lien de parenté.</p>
    <div id="jeu-btn-wrap" style="margin-top:1.25rem;display:none">
      <a href="jeu-famille.html" style="display:inline-flex;align-items:center;gap:8px;background:var(--rouge);color:var(--blanc);text-decoration:none;padding:10px 22px;border-radius:25px;font-size:0.88rem;font-weight:500;transition:opacity 0.2s" onmouseover="this.style.opacity=0.85" onmouseout="this.style.opacity=1">🎮 Jeu : Qui est-ce ?</a>
    </div>
  </div>
</div>
<div class="main">
  <div id="loading" style="text-align:center;color:var(--gris);padding:2rem">Chargement...</div>
  <div class="consigne" id="consigne" style="display:none">Cliquez sur une personne</div>
  <div class="arbre" id="arbre"></div>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = { apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o", authDomain: "audio-francisation.firebaseapp.com", projectId: "audio-francisation", storageBucket: "audio-francisation.firebasestorage.app", messagingSenderId: "840403407027", appId: "1:840403407027:web:46b370498fde6374aaa0c6" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let personnes = [], relations = {}, ARBRE = { parents: [], enfants: [] }, selected = null, lecture = null;
async function charger() {
  try {
    const snap = await getDocs(collection(db, 'famille'));
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const MES_IDS = ['p1', 'p2', 'p3', 'p4'];   // Jean, Alice, Mathieu, Sandra uniquement
    personnes = docs.filter(d => d.type === 'personne' && MES_IDS.includes(d.id)).sort((a, b) => (a.ordre ?? 99) - (b.ordre ?? 99));
    relations = {};
    personnes.forEach(p => { relations[p.id] = {}; });
    docs.filter(d => d.type === 'relation').forEach(r => { if (relations[r.de]) relations[r.de][r.vers] = r.audio; });
    ARBRE.parents = personnes.filter(p => p.id === 'p1' || p.id === 'p2').map(p => p.id);
    ARBRE.enfants = personnes.filter(p => p.id === 'p3' || p.id === 'p4').map(p => p.id);
    if (personnes.length === 0) { document.getElementById('loading').textContent = "Aucune famille configurée. Ajoutez les personnes dans l'admin."; return; }
    document.getElementById('loading').style.display = 'none';
    document.getElementById('consigne').style.display = 'block';
    if (docs.some(d => d.type === 'relation' && d.audioQuestion)) document.getElementById('jeu-btn-wrap').style.display = 'block';
    renderArbre();
  } catch (e) { document.getElementById('loading').textContent = 'Erreur de connexion. Veuillez réessayer.'; }
}
function pById(id) { return personnes.find(p => p.id === id); }
function carteHTML(id) {
  const p = pById(id);
  const cls = ['person'];
  if (selected === null) {} else if (id === selected) cls.push('selected');
  else if (relations[selected] && relations[selected][id]) cls.push('cible'); else cls.push('inactive');
  const img = p.image ? `<img src="${p.image}" alt="${p.nom}"/>` : `<span class="ph">👤</span>`;
  return `<div class="${cls.join(' ')}" data-id="${id}" onclick="clicPersonne('${id}')"><div class="photo">${img}</div><div class="nom">${p.nom}</div></div>`;
}
function renderArbre() {
  const a = document.getElementById('arbre');
  const parents = ARBRE.parents.map(carteHTML).join('');
  const enfants = ARBRE.enfants.map(carteHTML).join('');
  let html = `<div class="couple-wrap">${parents}</div>`;
  if (ARBRE.enfants.length) html += `<div class="connecteurs"><span class="branche gauche"></span><span class="branche droite"></span></div><div class="arbre-rang">${enfants}</div>`;
  a.innerHTML = html;
}
window.clicPersonne = function(id) {
  if (selected === null) {
    selected = id;
    document.getElementById('consigne').textContent = 'Sur qui ' + pById(id).nom + ' a-t-il/elle un lien ? Cliquez sur une case verte.';
    renderArbre();
  } else {
    if (id === selected) return;
    const audio = relations[selected] && relations[selected][id];
    if (!audio) return;
    jouerRelation(selected, id, audio);
  }
};
function jouerRelation(a, b, url) {
  if (lecture) { lecture.pause(); lecture = null; }
  renderArbre();
  const cible = document.querySelector('.person[data-id="' + b + '"]');
  if (cible) cible.classList.add('playing');
  document.getElementById('consigne').textContent = '🔊 ' + pById(a).nom + ' → ' + pById(b).nom;
  lecture = new Audio(url);
  lecture.play().catch(() => {});
  lecture.onended = reinit;
  lecture.onerror = () => setTimeout(reinit, 400);
}
function reinit() {
  selected = null; lecture = null;
  document.getElementById('consigne').textContent = 'Cliquez sur une personne';
  renderArbre();
}
charger();
</script>
</body>
</html>
