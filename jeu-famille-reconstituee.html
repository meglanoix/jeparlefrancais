<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root { --bleu: #1a3a5c; --bleu-clair: #2a5298; --rouge: #c0392b; --creme: #f9f5ef; --texte: #2c2c2c; --gris: #6b6b6b; --blanc: #ffffff; --vert: #1a7a4a; --ombre: 0 2px 24px rgba(26,58,92,0.10); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; color: var(--texte); background: var(--creme); min-height: 100vh; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; padding: 0 5vw; height: 64px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(26,58,92,0.08); box-shadow: var(--ombre); }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--bleu); text-decoration: none; }
.nav-logo span { color: var(--rouge); }
.page-header { background: var(--bleu); padding: 100px 5vw 44px; position: relative; overflow: hidden; }
.page-header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 80% 50%, rgba(42,82,152,0.5) 0%, transparent 70%); }
.page-header-inner { position: relative; z-index: 1; }
.page-eyebrow { font-size: 0.75rem; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 0.75rem; }
.page-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.8rem); color: var(--blanc); line-height: 1.1; margin-bottom: 0.5rem; }
.page-header p { font-size: 0.95rem; color: rgba(255,255,255,0.65); font-weight: 300; max-width: 620px; }
.main { max-width: 820px; margin: 0 auto; padding: 2.5rem 5vw 5rem; }
.consigne { text-align: center; font-size: 1.05rem; color: var(--bleu); font-weight: 500; min-height: 1.6em; margin-bottom: 1.5rem; transition: color 0.2s; }

.arbre-zone { position: relative; width: 100%; max-width: 720px; margin: 0 auto; }
#liens { position: absolute; inset: 0; width: 100%; pointer-events: none; z-index: 0; }
#liens line { stroke: rgba(26,58,92,0.28); stroke-width: 3; }
.person { position: absolute; z-index: 1; background: var(--blanc); border: 2.5px solid rgba(26,58,92,0.10); border-radius: 14px; padding: 8px 8px 10px; cursor: pointer; text-align: center; transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s, opacity 0.2s; }
.person .photo { width: 100%; aspect-ratio: 1/1; border-radius: 9px; background: var(--creme); overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 7px; }
.person .photo img { width: 100%; height: 100%; object-fit: cover; }
.person .photo .ph { font-size: 2rem; color: rgba(26,58,92,0.25); }
.person .nom { font-family: 'Playfair Display', serif; font-size: 1.02rem; color: var(--bleu); line-height: 1.1; }
.person:hover { transform: translateY(-2px); }
.person.selected { border-color: var(--bleu); box-shadow: 0 0 0 3px rgba(26,58,92,0.15); }
.person.cible { border-color: var(--vert); box-shadow: 0 0 0 3px rgba(26,122,74,0.22); animation: lueur 1.2s ease-in-out infinite; }
@keyframes lueur { 0%,100% { box-shadow: 0 0 0 3px rgba(26,122,74,0.18); } 50% { box-shadow: 0 0 0 6px rgba(26,122,74,0.30); } }
.person.inactive { opacity: 0.4; cursor: default; pointer-events: none; }
.person.playing { border-color: var(--rouge); box-shadow: 0 0 0 3px rgba(192,57,43,0.25); }

.nav-back { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--gris); font-size: 0.9rem; }
.nav-back:hover { color: var(--bleu); }
.nav-back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.progress-label { font-size: 0.85rem; color: var(--gris); margin-bottom: 1rem; display: flex; justify-content: space-between; max-width: 720px; margin-left: auto; margin-right: auto; }
.score-badge { font-weight: 500; color: var(--vert); }
.play-zone { text-align: center; margin-bottom: 1.25rem; }
.play-btn { width: 84px; height: 84px; border-radius: 50%; background: var(--bleu); border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: transform 0.2s; box-shadow: 0 4px 16px rgba(26,58,92,0.25); }
.play-btn:hover { transform: scale(1.05); }
.play-btn.playing { background: var(--vert); }
.play-btn svg { width: 34px; height: 34px; fill: white; margin-left: 4px; }
.play-btn.playing svg { margin-left: 0; }
.replay-hint { font-size: 0.82rem; color: var(--gris); margin-top: 0.6rem; }
.person.reference { border-color: var(--rouge) !important; box-shadow: 0 0 0 3px rgba(192,57,43,0.30) !important; animation: pulseRouge 1.2s ease-in-out infinite; }
@keyframes pulseRouge { 0%,100% { box-shadow: 0 0 0 3px rgba(192,57,43,0.25); } 50% { box-shadow: 0 0 0 6px rgba(192,57,43,0.38); } }
.person.correct { border-color: var(--vert) !important; box-shadow: 0 0 0 3px rgba(26,122,74,0.30) !important; }
.person.wrong { border-color: var(--rouge) !important; box-shadow: 0 0 0 3px rgba(192,57,43,0.30) !important; }
.person.fige { pointer-events: none; }
.feedback { text-align: center; min-height: 32px; font-size: 1.05rem; font-weight: 500; margin: 1.25rem 0 0; }
.feedback.bon { color: var(--vert); }
.feedback.mauvais { color: var(--rouge); }
.score-final { background: var(--blanc); border-radius: 16px; border: 1px solid rgba(26,58,92,0.08); padding: 3rem 2rem; text-align: center; max-width: 560px; margin: 1rem auto 0; }
.score-final h2 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--bleu); margin-bottom: 0.5rem; }
.score-final .score-num { font-size: 3rem; font-weight: 500; color: var(--vert); margin: 1rem 0; }
.score-final p { color: var(--gris); margin-bottom: 2rem; }
.btn-rejouer { background: var(--bleu); color: var(--blanc); border: none; border-radius: 10px; padding: 0.85rem 2rem; font-size: 0.95rem; font-family: 'DM Sans', sans-serif; cursor: pointer; }
.btn-rejouer:hover { opacity: 0.85; }

.arbre-viewport { position: relative; width: 100%; max-width: 1200px; margin: 0 auto; height: 680px; overflow: hidden; border: 1px solid rgba(26,58,92,0.12); border-radius: 14px; background: var(--blanc); touch-action: none; cursor: grab; }
.arbre-viewport.dragging { cursor: grabbing; }
.arbre-viewport .arbre-zone { position: absolute; top: 0; left: 0; transform-origin: 0 0; margin: 0; max-width: none; width: 1100px; }
.zoom-controls { position: absolute; right: 10px; bottom: 10px; z-index: 5; display: flex; flex-direction: column; gap: 6px; }
.zoom-controls button { width: 38px; height: 38px; border-radius: 9px; border: 1.5px solid rgba(26,58,92,0.15); background: rgba(255,255,255,0.95); color: var(--bleu); font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(26,58,92,0.12); }
.zoom-controls button:hover { border-color: var(--bleu); }
.zoom-hint { text-align: center; font-size: 0.8rem; color: var(--gris); margin-top: 0.6rem; }
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">JeParle<span>Français</span>.ca</a>
  <a class="nav-back" href="famille-reconstituee.html"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Retour</a>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <p class="page-eyebrow">La famille reconstituée · Jeu</p>
    <h1>Qui est-ce ?</h1>
    <p>Écoutez la question et cliquez sur la bonne personne.</p>
  </div>
</div>

<div class="main">
  <div id="loading" style="text-align:center;color:var(--gris);padding:2rem">Chargement...</div>
  <div id="jeu" style="display:none">
    <div class="progress-label"><span id="progress-text">Question 1</span><span class="score-badge" id="score-text">0 point</span></div>
    <div class="play-zone">
      <button class="play-btn" id="play-btn" onclick="rejouer()"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <div class="replay-hint">Cliquez pour réécouter</div>
    </div>
    <div class="consigne" id="consigne">Cliquez sur la bonne personne</div>
    <div class="arbre-zone" id="arbre-zone">
      <svg id="liens" preserveAspectRatio="none"></svg>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="score-final" id="score-final" style="display:none">
    <h2>Bravo !</h2>
    <div class="score-num" id="score-final-num">0 / 10</div>
    <p id="score-final-msg"></p>
    <button class="btn-rejouer" onclick="startGame()">🔄 Rejouer</button>
        <a href="index.html" style="display:inline-block;margin-top:0.75rem;padding:0.85rem 2rem;background:var(--creme);color:var(--bleu);border-radius:10px;text-decoration:none;font-size:1rem;font-family:'DM Sans',sans-serif;font-weight:500;border:1.5px solid rgba(26,58,92,0.15);transition:opacity 0.2s" onmouseover="this.style.opacity=0.75" onmouseout="this.style.opacity=1">🏠 Page d'accueil</a>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = { apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o", authDomain: "audio-francisation.firebaseapp.com", projectId: "audio-francisation", storageBucket: "audio-francisation.firebasestorage.app", messagingSenderId: "840403407027", appId: "1:840403407027:web:46b370498fde6374aaa0c6" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const LAYOUT = {
  p5:{col:44,row:0}, p6:{col:55,row:0}, p13:{col:78,row:0}, p14:{col:89,row:0},
  p10:{col:7,row:1}, p11:{col:18,row:1}, p7:{col:29,row:1}, p8:{col:40,row:1}, p2:{col:66,row:1}, p1:{col:84,row:1},
  p12:{col:7,row:2}, p9:{col:23,row:2}, p3:{col:66,row:2}, p4:{col:84,row:2}
};
const ALIAS = {};
function reel(id) { return ALIAS[id] || id; }
const COUPLES = [
  ['p5','p6','marie'], ['p13','p14','marie'], ['p10','p11','marie'], ['p11','p7','divorce'], ['p7','p8','couple'], ['p2','p1','marie']
];
const FILIATIONS = [
  {enfant:'p7',parents:['p5','p6']}, {enfant:'p2',parents:['p5','p6']},
  {enfant:'p1',parents:['p13','p14']},
  {enfant:'p12',parents:['p10','p11']}, {enfant:'p9',parents:['p7','p11']},
  {enfant:'p3',parents:['p2','p1']}, {enfant:'p4',parents:['p2','p1']}
];
const ROW_Y = [70, 280, 490];
const CARD_W = 104, CARD_H = 124, ZONE_H = 660;

let personnes = {}, pool = [], questions = [], qIndex = 0, score = 0, answered = false, lecture = null;
const TOTAL = 10;

async function charger() {
  try {
    const snap = await getDocs(collection(db, 'famille'));
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    docs.filter(d => d.type === 'personne').forEach(p => { personnes[p.id] = p; });
    const dispo = new Set(Object.keys(LAYOUT).filter(id => personnes[id]));
    pool = docs.filter(d => d.type === 'relation' && d.audioQuestion && dispo.has(d.de) && dispo.has(d.vers))
      .map(d => ({ audio: d.audioQuestion, reference: d.vers, reponse: d.de }));
    if (pool.length === 0) {
      document.getElementById('loading').textContent = "Aucune question enregistrée. Ajoutez des audios de question dans l'admin.";
      return;
    }
    document.getElementById('loading').style.display = 'none';
    document.getElementById('jeu').style.display = 'block';
    startGame();
    window.addEventListener('resize', positionner);
  } catch (e) { document.getElementById('loading').textContent = 'Erreur de connexion. Veuillez réessayer.'; }
}

function nom(id) { return personnes[id] ? personnes[id].nom : id; }

window.startGame = function() {
  score = 0; qIndex = 0; answered = false;
  document.getElementById('score-final').style.display = 'none';
  document.getElementById('jeu').style.display = 'block';
  questions = shuffle([...pool]).slice(0, Math.min(TOTAL, pool.length));
  afficher();
};

function afficher() {
  answered = false;
  const q = questions[qIndex];
  document.getElementById('progress-text').textContent = 'Question ' + (qIndex + 1) + ' / ' + questions.length;
  document.getElementById('score-text').textContent = score + (score === 1 ? ' point' : ' points');
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  render(q);
  jouer(q.audio);
}

function render(q) {
  const zone = document.getElementById('arbre-zone');
  zone.style.height = ZONE_H + 'px';
  zone.querySelectorAll('.person').forEach(n => n.remove());
  Object.keys(LAYOUT).forEach(slot => {
    const id = reel(slot);
    if (!personnes[id]) return;
    const p = personnes[id];
    const cls = ['person'];
    if (id === q.reference) cls.push('reference');
    const div = document.createElement('div');
    div.className = cls.join(' ');
    div.dataset.slot = slot;
    div.dataset.id = id;
    div.style.width = CARD_W + 'px';
    if (id !== q.reference) div.onclick = () => repondre(id);
    const img = p.image ? `<img src="${p.image}" alt="${p.nom}"/>` : `<span class="ph">👤</span>`;
    div.innerHTML = `<div class="photo">${img}</div><div class="nom">${p.nom}</div>`;
    zone.appendChild(div);
  });
  positionner();
}

function positionner() {
  const zone = document.getElementById('arbre-zone');
  const W = zone.clientWidth;
  const centres = {};
  Object.keys(LAYOUT).forEach(slot => {
    const card = zone.querySelector('.person[data-slot="' + slot + '"]');
    if (!card) return;
    const cx = LAYOUT[slot].col / 100 * W;
    const y = ROW_Y[LAYOUT[slot].row];
    card.style.left = (cx - CARD_W / 2) + 'px';
    card.style.top = y + 'px';
    centres[slot] = { x: cx, top: y, cy: y + CARD_H / 2 };
  });
  const svg = document.getElementById('liens');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + ZONE_H);
  svg.style.height = ZONE_H + 'px';
  let lines = '', symbols = '';
  const L = (x1,y1,x2,y2,dash) => { lines += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${dash?' stroke-dasharray="6 5"':''}/>`; };
  const coupleMid = {};
  COUPLES.forEach(([a,b,type]) => {
    if (!centres[a] || !centres[b]) return;
    const divorce = type === 'divorce';
    L(centres[a].x, centres[a].cy, centres[b].x, centres[b].cy, divorce);
    const mx=(centres[a].x+centres[b].x)/2, my=centres[a].cy;
    coupleMid[a+'+'+b] = { x: mx, y: my };
    const emoji = type === 'marie' ? '💍' : (type === 'divorce' ? '💔' : '❤️');
    symbols += `<circle cx="${mx}" cy="${my}" r="15" fill="#f9f5ef" stroke="rgba(26,58,92,0.25)" stroke-width="2"/>`;
    symbols += `<text x="${mx}" y="${my+6}" text-anchor="middle" font-size="16">${emoji}</text>`;
  });
  FILIATIONS.forEach(f => {
    const [pa,pb]=f.parents;
    const mid = coupleMid[pa+'+'+pb] || coupleMid[pb+'+'+pa];
    const enf = centres[f.enfant];
    if (!mid || !enf) return;
    const midY=(mid.y+enf.top)/2;
    L(mid.x, mid.y+18, mid.x, midY); L(mid.x, midY, enf.x, midY); L(enf.x, midY, enf.x, enf.top);
  });
  svg.innerHTML = lines + symbols;
}

function jouer(url) {
  if (lecture) { lecture.pause(); lecture = null; }
  const btn = document.getElementById('play-btn');
  lecture = new Audio(url); btn.classList.add('playing');
  lecture.play().catch(()=>{});
  lecture.onended = () => btn.classList.remove('playing');
}
window.rejouer = () => { const q = questions[qIndex]; if (q) jouer(q.audio); };

function repondre(id) {
  if (answered) return;
  answered = true;
  const q = questions[qIndex];
  const bon = id === q.reponse;
  if (bon) score++;
  document.querySelectorAll('.person').forEach(el => el.classList.add('fige'));
  const bonne = document.querySelector('.person[data-id="' + q.reponse + '"]');
  if (bonne) bonne.classList.add('correct');
  if (!bon) { const ch = document.querySelector('.person[data-id="' + id + '"]'); if (ch) ch.classList.add('wrong'); }
  const fb = document.getElementById('feedback');
  fb.textContent = bon ? '✓ Bonne réponse !' : '✗ La bonne réponse était ' + nom(q.reponse);
  fb.className = 'feedback ' + (bon ? 'bon' : 'mauvais');
  document.getElementById('score-text').textContent = score + (score === 1 ? ' point' : ' points');
  setTimeout(() => { qIndex++; if (qIndex < questions.length) afficher(); else fin(); }, 1700);
};

function fin() {
  document.getElementById('jeu').style.display = 'none';
  const sf = document.getElementById('score-final'); sf.style.display = 'block';
  document.getElementById('score-final-num').textContent = score + ' / ' + questions.length;
  const pct = score / questions.length;
  let msg = 'Continuez à pratiquer !';
  if (pct === 1) msg = 'Parfait ! Vous connaissez bien la famille.';
  else if (pct >= 0.7) msg = 'Très bien !';
  document.getElementById('score-final-msg').textContent = msg;
}

function shuffle(arr) { for (let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }

charger();

// ---- Zoom + déplacement (pincer / molette / glisser) ----
(function() {
  const zone = document.getElementById('arbre-zone');
  if (!zone) return;
  // envelopper la zone dans un viewport
  const vp = document.createElement('div');
  vp.className = 'arbre-viewport';
  zone.parentNode.insertBefore(vp, zone);
  vp.appendChild(zone);
  // contrôles
  const ctr = document.createElement('div');
  ctr.className = 'zoom-controls';
  ctr.innerHTML = '<button type="button" data-z="in">+</button><button type="button" data-z="out">\u2212</button><button type="button" data-z="reset">\u21BB</button>';
  vp.appendChild(ctr);
  const hint = document.createElement('div');
  hint.className = 'zoom-hint';
  hint.textContent = 'Pincez ou utilisez la molette pour zoomer, glissez pour vous déplacer.';
  vp.parentNode.insertBefore(hint, vp.nextSibling);

  let scale = 1, tx = 0, ty = 0;
  const MIN = 0.4, MAX = 3;
  function apply() { zone.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }
  function reset() {
    // ajuster pour que l'arbre remplisse joliment le viewport (marge légère)
    const zw = zone.offsetWidth || 720, zh = zone.offsetHeight || 600;
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const fit = (vw / zw) * 0.99;
    scale = Math.max(MIN, Math.min(MAX, fit));
    tx = (vw - zw * scale) / 2;
    ty = Math.max(8, (vh - zh * scale) / 2);
    apply();
  }
  window.__resetArbre = reset;

  ctr.addEventListener('click', e => {
    const z = e.target.getAttribute('data-z'); if (!z) return;
    const cx = vp.clientWidth / 2, cy = vp.clientHeight / 2;
    if (z === 'reset') { reset(); return; }
    const f = z === 'in' ? 1.25 : 0.8;
    zoomAt(cx, cy, f);
  });

  function zoomAt(px, py, f) {
    const ns = Math.max(MIN, Math.min(MAX, scale * f));
    const r = ns / scale;
    tx = px - (px - tx) * r; ty = py - (py - ty) * r;
    scale = ns; apply();
  }

  vp.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = vp.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.12 : 0.89);
  }, { passive: false });

  // --- glisser (souris + tactile) + distinction clic ---
  let dragging = false, moved = false, sx = 0, sy = 0, stx = 0, sty = 0;
  const pts = new Map();
  let pinchStart = 0, pinchScale = 1;

  vp.addEventListener('pointerdown', e => {
    if (e.target.closest('.zoom-controls')) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) {
      dragging = true; moved = false;
      sx = e.clientX; sy = e.clientY; stx = tx; sty = ty;
      vp.classList.add('dragging');
    } else if (pts.size === 2) {
      const a = [...pts.values()];
      pinchStart = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      pinchScale = scale;
    }
  });
  vp.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      const a = [...pts.values()];
      const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      if (pinchStart > 0) {
        const rect = vp.getBoundingClientRect();
        const mx = (a[0].x + a[1].x) / 2 - rect.left, my = (a[0].y + a[1].y) / 2 - rect.top;
        const target = pinchScale * (d / pinchStart);
        const f = target / scale;
        zoomAt(mx, my, f);
      }
      moved = true;
      return;
    }
    if (dragging) {
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (!moved && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
        moved = true;
        try { vp.setPointerCapture(e.pointerId); } catch (err) {}
      }
      if (moved) { tx = stx + dx; ty = sty + dy; apply(); }
    }
  });
  function up(e) {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinchStart = 0;
    if (pts.size === 0) { dragging = false; vp.classList.remove('dragging'); }
  }
  vp.addEventListener('pointerup', up);
  vp.addEventListener('pointercancel', up);

  // supprime le clic-personne si on a glissé
  vp.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); } }, true);

  // reset après chaque rendu de l'arbre
  const obs = new MutationObserver(() => { /* garder la vue */ });
  obs.observe(zone, { childList: true });

  // premier centrage quand l'arbre apparaît
  const waitShow = setInterval(() => {
    if (zone.offsetWidth > 0 && vp.clientWidth > 0) { reset(); clearInterval(waitShow); }
  }, 120);
})();
</script>
</body>
