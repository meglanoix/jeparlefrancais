<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin – Raconter sa journée (présent + passé) | JeParle Français</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root { --bleu:#1a3a5c; --bleu-clair:#2a5298; --rouge:#c0392b; --creme:#f9f5ef; --texte:#2c2c2c; --gris:#6b6b6b; --blanc:#fff; --vert:#1a7a4a; --orange:#e67e22; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'DM Sans',sans-serif; color:var(--texte); background:var(--creme); }
nav { display:flex; align-items:center; justify-content:space-between; padding:0 5vw; height:60px; background:rgba(26,58,92,0.97); border-bottom:2px solid var(--rouge); }
nav .logo { font-family:'Playfair Display',serif; color:#fff; font-size:1.15rem; }
nav .logo span { color:#e88; }
nav a { color:rgba(255,255,255,0.7); text-decoration:none; font-size:0.85rem; }
.header { background:var(--bleu); color:#fff; padding:1.5rem 5vw; border-bottom:3px solid var(--rouge); }
.header h1 { font-family:'Playfair Display',serif; font-size:1.5rem; }
.header p { opacity:0.75; font-size:0.9rem; margin-top:0.25rem; }
.main { max-width:900px; margin:0 auto; padding:1.5rem 5vw 4rem; }
.tabs { display:flex; gap:8px; margin-bottom:1.25rem; }
.tab { flex:1; max-width:240px; padding:0.8rem 1rem; border:1.5px solid rgba(26,58,92,0.15); background:var(--blanc); border-radius:12px; font-family:inherit; font-size:1rem; font-weight:600; color:var(--gris); cursor:pointer; }
.tab.active { background:var(--bleu); color:#fff; border-color:var(--bleu); }
.liste { display:flex; flex-direction:column; gap:0.9rem; }
.carte { display:flex; gap:1rem; background:var(--blanc); border:1px solid rgba(26,58,92,0.1); border-radius:14px; padding:0.9rem; }
.carte > img { width:92px; height:92px; object-fit:cover; background:var(--creme); border-radius:10px; flex-shrink:0; }
.carte .verrou-tag { font-size:0.72rem; color:var(--bleu-clair); font-weight:600; }
.champs { flex:1; min-width:0; display:flex; flex-direction:column; gap:0.7rem; }
.ligne-champ { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
.etiq { width:118px; flex-shrink:0; font-size:0.82rem; font-weight:700; }
.etiq.present { color:var(--bleu-clair); } .etiq.passe { color:var(--orange); }
.champs input[type=text] { flex:1; min-width:120px; padding:0.5rem 0.65rem; border:1.5px solid rgba(26,58,92,0.18); border-radius:8px; font-family:inherit; font-size:0.95rem; }
.mini { padding:0.45rem 0.7rem; border-radius:8px; border:1.5px solid rgba(26,58,92,0.2); background:var(--blanc); font-family:inherit; font-size:0.85rem; cursor:pointer; }
.mini.rec { background:var(--rouge); color:#fff; border:none; }
.mini.rec.on { background:#7a1a12; }
.mini.play { border:none; background:none; font-size:1.1rem; padding:0.3rem; }
.etat { font-size:0.78rem; font-weight:600; min-width:64px; }
.etat.ok { color:var(--vert); } .etat.vide { color:var(--gris); } .etat.err { color:var(--rouge); }
.vide, .chargement { color:var(--gris); text-align:center; padding:2rem; }
@media (max-width:620px){ .carte > img { width:64px; height:64px; } .etiq { width:100%; } }
</style>
</head>
<body>
<nav>
  <div class="logo">JeParle<span>Français</span> · Admin</div>
  <a href="admin-vk7x9mq2-accueil.html">‹ Accueil admin</a>
</nav>
<div class="header">
  <h1>Raconter sa journée — présent &amp; passé composé</h1>
  <p>Pour chaque étape : le texte et l'audio au présent, et le texte et l'audio au passé composé. Mêmes images que « Raconter sa routine ».</p>
</div>

<div class="main">
  <div class="tabs">
    <button class="tab active" id="tab-matin" onclick="changer('matin')">🌅 Mon matin</button>
    <button class="tab" id="tab-ecole" onclick="changer('ecole')">🌆 Mon après-midi</button>
  </div>
  <div class="liste" id="liste"><div class="chargement">Chargement…</div></div>
</div>

<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';
const firebaseConfig = {
  apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o",
  authDomain: "audio-francisation.firebaseapp.com",
  projectId: "audio-francisation",
  storageBucket: "audio-francisation.firebasestorage.app",
  messagingSenderId: "840403407027",
  appId: "1:840403407027:web:46b370498fde6374aaa0c6"
};
const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);
const COLLECTIONS = { matin: 'routine-matin', ecole: 'routine-apres-ecole' };
// les 2 "temps" : champ texte, champ audio, suffixe de fichier Storage
const TEMPS = {
  present: { cls:'present', nom:'Présent',        txt:'nom',      aud:'audio',      suf:'' },
  passe:   { cls:'passe',   nom:'Passé composé',  txt:'nomPasse', aud:'audioPasse', suf:'_passe' }
};

let onglet = 'matin';
let cartes = [];
let player = null;

window.changer = async function(o) {
  onglet = o;
  document.getElementById('tab-matin').classList.toggle('active', o==='matin');
  document.getElementById('tab-ecole').classList.toggle('active', o==='ecole');
  document.getElementById('liste').innerHTML = '<div class="chargement">Chargement…</div>';
  await charger();
};

async function charger() {
  const snap = await getDocs(collection(db, COLLECTIONS[onglet]));
  cartes = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>(a.ordre??99)-(b.ordre??99));
  rendre();
}

function ligneTemps(c, tk) {
  const t = TEMPS[tk];
  const val = (c[t.txt] || '').replace(/"/g,'&quot;');
  const aExiste = !!c[t.aud];
  return `
    <div class="ligne-champ">
      <span class="etiq ${t.cls}">${t.nom}</span>
      <input type="text" value="${val}" placeholder="texte ${t.nom.toLowerCase()}" onchange="saveTexte('${c.id}','${tk}',this.value)"/>
      <button class="mini rec" id="rec-${tk}-${c.id}" onclick="rec('${c.id}','${tk}')">🎙</button>
      <button class="mini" onclick="document.getElementById('f-${tk}-${c.id}').click()">📁</button>
      <input type="file" id="f-${tk}-${c.id}" accept="audio/*" style="display:none" onchange="fich('${c.id}','${tk}',event)"/>
      ${aExiste ? `<button class="mini play" title="Écouter" onclick="play('${c.id}','${tk}')">🔊</button>` : ''}
      <span class="etat ${aExiste?'ok':'vide'}" id="e-${tk}-${c.id}">${aExiste ? '✓' : '—'}</span>
    </div>`;
}

function rendre() {
  const el = document.getElementById('liste');
  if (!cartes.length) { el.innerHTML = '<div class="vide">Aucune étape dans cette section.</div>'; return; }
  el.innerHTML = cartes.map(c => {
    const verrou = (c.verrou === 'debut' || c.verrou === 'fin')
      ? `<div class="verrou-tag">🔒 ${c.verrou === 'debut' ? 'Début' : 'Fin'}</div>` : '';
    return `
    <div class="carte">
      ${c.image ? `<img src="${c.image}" alt=""/>` : '<div style="width:92px"></div>'}
      <div class="champs">
        ${verrou}
        ${ligneTemps(c, 'present')}
        ${ligneTemps(c, 'passe')}
      </div>
    </div>`;
  }).join('');
}

window.saveTexte = async function(id, tk, value) {
  const champ = TEMPS[tk].txt;
  const c = cartes.find(x => x.id === id); if (!c) return;
  c[champ] = value.trim();
  try { await updateDoc(doc(db, COLLECTIONS[onglet], id), { [champ]: value.trim() }); }
  catch(e) { alert('Erreur : ' + e.message); }
};

window.play = function(id, tk) {
  const c = cartes.find(x => x.id === id); const url = c && c[TEMPS[tk].aud];
  if (!url) return;
  if (!player) { player = new Audio(); player.setAttribute('playsinline',''); }
  player.src = url; player.play().catch(()=>{});
};

async function sauverAudio(id, tk, blob, ext) {
  const t = TEMPS[tk];
  const chemin = COLLECTIONS[onglet] + '/' + id + t.suf + '.' + ext;
  const r = ref(storage, chemin);
  await uploadBytes(r, blob);
  const url = await getDownloadURL(r);
  await updateDoc(doc(db, COLLECTIONS[onglet], id), { [t.aud]: url });
  const c = cartes.find(x => x.id === id); if (c) c[t.aud] = url;
  const e = document.getElementById('e-' + tk + '-' + id); if (e) { e.textContent = '✓'; e.className = 'etat ok'; }
}

window.fich = async function(id, tk, ev) {
  const f = ev.target.files[0]; if (!f) return;
  const e = document.getElementById('e-' + tk + '-' + id); e.textContent = '…'; e.className = 'etat';
  try { await sauverAudio(id, tk, f, (f.name.split('.').pop()||'mp3').toLowerCase()); }
  catch(err) { e.textContent = 'err'; e.className = 'etat err'; }
};

// enregistrement micro, une seule ligne à la fois
let encours = null;  // { id, tk, mediaRec, chunks }
window.rec = async function(id, tk) {
  const btn = document.getElementById('rec-' + tk + '-' + id);
  if (encours && encours.mediaRec.state === 'recording' && encours.id === id && encours.tk === tk) { encours.mediaRec.stop(); return; }
  if (encours && encours.mediaRec.state === 'recording') { encours.mediaRec.stop(); }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(stream); const chunks = [];
    encours = { id, tk, mediaRec: mr, chunks };
    mr.ondataavailable = ev => chunks.push(ev.data);
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      btn.classList.remove('on'); btn.textContent = '🎙';
      const e = document.getElementById('e-' + tk + '-' + id); e.textContent = '…'; e.className = 'etat';
      try { await sauverAudio(id, tk, new Blob(chunks, { type:'audio/webm' }), 'webm'); }
      catch(err) { e.textContent = 'err'; e.className = 'etat err'; }
    };
    mr.start(); btn.classList.add('on'); btn.textContent = '⏹';
  } catch(e) { alert('Micro indisponible : ' + e.message); }
};

changer('matin');
</script>
<!-- Connexion admin (même compte que tes autres pages admin) -->
<script type="module" src="admin-auth.js"></script>
</body>
</html>
