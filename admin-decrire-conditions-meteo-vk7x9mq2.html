<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin – Décrire une condition météorologique | JeParle Français</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root { --bleu: #1a3a5c; --rouge: #c0392b; --creme: #f9f5ef; --texte: #2c2c2c; --gris: #6b6b6b; --blanc: #ffffff; --vert: #1a7a4a; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--creme); color: var(--texte); }
nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 64px; background: var(--bleu); }
.nav-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: white; }
.nav-link { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.88rem; }
.nav-link:hover { color: white; }
.main { max-width: 700px; margin: 0 auto; padding: 2rem; }
.card { background: var(--blanc); border-radius: 14px; border: 1px solid rgba(26,58,92,0.1); padding: 1.5rem; margin-bottom: 1.5rem; }
.card-title { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--bleu); margin-bottom: 1rem; }
label { display: block; font-size: 0.82rem; font-weight: 500; color: var(--gris); margin-bottom: 4px; margin-top: 0.75rem; }
input[type=text] { width: 100%; border: 1.5px solid rgba(26,58,92,0.15); border-radius: 8px; padding: 8px 12px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; background: var(--creme); }
input:focus { outline: none; border-color: var(--bleu); }
.upload-zone { border: 2px dashed rgba(26,58,92,0.2); border-radius: 10px; padding: 1rem; text-align: center; cursor: pointer; color: var(--gris); font-size: 0.85rem; transition: background 0.15s; }
.upload-zone:hover { background: var(--creme); }
.upload-zone.has-file { border-color: var(--vert); background: #f0faf4; color: var(--vert); }
.audio-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; background: var(--creme); border-radius: 8px; padding: 8px 10px; }
.audio-row-label { font-size: 0.8rem; font-weight: 500; color: var(--gris); min-width: 80px; }
.audio-row input[type=text] { flex: 1; padding: 5px 8px; font-size: 0.82rem; }
.record-btn { padding: 6px 12px; border-radius: 7px; border: 1.5px solid rgba(26,58,92,0.15); background: var(--blanc); font-family: 'DM Sans', sans-serif; font-size: 0.78rem; cursor: pointer; white-space: nowrap; }
.record-btn.recording { background: var(--rouge); color: white; border-color: var(--rouge); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
.play-btn-sm { padding: 6px 10px; border-radius: 7px; border: none; background: var(--bleu); color: white; cursor: pointer; font-size: 0.78rem; }
.play-btn-sm:disabled { opacity: 0.4; cursor: default; }
.file-btn { padding: 6px 10px; border-radius: 7px; border: 1.5px solid rgba(26,58,92,0.15); background: var(--blanc); font-size: 0.78rem; cursor: pointer; }
.btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; margin-top: 0.75rem; transition: opacity 0.2s; }
.btn:hover { opacity: 0.85; }
.btn-success { background: var(--vert); color: white; }
.btn-ghost { background: var(--creme); color: var(--texte); }
.msg { padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; text-align: center; display: none; margin-top: 8px; }
.msg.success { background: rgba(26,122,74,0.1); color: var(--vert); }
.msg.error { background: rgba(192,57,43,0.1); color: var(--rouge); }
.existing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
.existing-card { background: var(--creme); border-radius: 10px; overflow: hidden; border: 1px solid rgba(26,58,92,0.08); }
.existing-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
.existing-card-body { padding: 0.6rem; }
.existing-card-mot { font-size: 0.85rem; font-weight: 500; color: var(--bleu); margin-bottom: 4px; }
.existing-card-audios { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.play-audio-pill { display: flex; align-items: center; gap: 4px; background: var(--blanc); border: 1px solid rgba(26,58,92,0.1); border-radius: 20px; padding: 3px 8px; font-size: 0.72rem; cursor: pointer; color: var(--texte); }
.play-audio-pill:hover { background: var(--bleu); color: white; }
.play-audio-pill svg { width: 10px; height: 10px; fill: currentColor; }
.del-btn { width: 100%; padding: 4px; background: none; border: none; cursor: pointer; color: var(--gris); font-size: 0.8rem; margin-top: 4px; }
.del-btn:hover { color: var(--rouge); }
</style>
</head>
<body>
<nav>
  <span class="nav-title">Admin – Décrire une condition météo</span>
  <a class="nav-link" href="decrire-conditions-meteo.html">← Voir la page</a>
</nav>

<div class="main">
  <div class="card">
    <div class="card-title">➕ Ajouter une condition météorologique</div>

    <label>Nom de la condition</label>
    <input type="text" id="mot-input" placeholder="Ex : La pluie"/>

    <label>Image</label>
    <div class="upload-zone" id="img-zone" onclick="document.getElementById('img-input').click()">
      📷 Cliquez pour choisir une image
    </div>
    <input type="file" id="img-input" accept="image/*" style="display:none" onchange="handleImage(event)"/>

    <label>Expressions audio (jusqu'à 5)</label>

    <!-- Audio 1 -->
    <div class="audio-row">
      <span class="audio-row-label">Expression 1</span>
      <input type="text" id="label1" placeholder="il pleut"/>
      <button class="record-btn" id="rec1" onclick="toggleRecord(1)">🎙</button>
      <button class="play-btn-sm" id="play1" disabled onclick="playAudio(1)">▶</button>
      <button class="file-btn" onclick="document.getElementById('file1').click()">📁</button>
      <input type="file" id="file1" accept="audio/*" style="display:none" onchange="handleFile(1, event)"/>
    </div>

    <!-- Audio 2 -->
    <div class="audio-row">
      <span class="audio-row-label">Expression 2</span>
      <input type="text" id="label2" placeholder="il y a de la pluie"/>
      <button class="record-btn" id="rec2" onclick="toggleRecord(2)">🎙</button>
      <button class="play-btn-sm" id="play2" disabled onclick="playAudio(2)">▶</button>
      <button class="file-btn" onclick="document.getElementById('file2').click()">📁</button>
      <input type="file" id="file2" accept="audio/*" style="display:none" onchange="handleFile(2, event)"/>
    </div>

    <!-- Audio 3 -->
    <div class="audio-row">
      <span class="audio-row-label">Expression 3</span>
      <input type="text" id="label3" placeholder="c'est pluvieux"/>
      <button class="record-btn" id="rec3" onclick="toggleRecord(3)">🎙</button>
      <button class="play-btn-sm" id="play3" disabled onclick="playAudio(3)">▶</button>
      <button class="file-btn" onclick="document.getElementById('file3').click()">📁</button>
      <input type="file" id="file3" accept="audio/*" style="display:none" onchange="handleFile(3, event)"/>
    </div>

    <!-- Audio 4 -->
    <div class="audio-row">
      <span class="audio-row-label">Expression 4</span>
      <input type="text" id="label4" placeholder="(optionnel)"/>
      <button class="record-btn" id="rec4" onclick="toggleRecord(4)">🎙</button>
      <button class="play-btn-sm" id="play4" disabled onclick="playAudio(4)">▶</button>
      <button class="file-btn" onclick="document.getElementById('file4').click()">📁</button>
      <input type="file" id="file4" accept="audio/*" style="display:none" onchange="handleFile(4, event)"/>
    </div>

    <!-- Audio 5 -->
    <div class="audio-row">
      <span class="audio-row-label">Expression 5</span>
      <input type="text" id="label5" placeholder="(optionnel)"/>
      <button class="record-btn" id="rec5" onclick="toggleRecord(5)">🎙</button>
      <button class="play-btn-sm" id="play5" disabled onclick="playAudio(5)">▶</button>
      <button class="file-btn" onclick="document.getElementById('file5').click()">📁</button>
      <input type="file" id="file5" accept="audio/*" style="display:none" onchange="handleFile(5, event)"/>
    </div>

    <div class="msg" id="form-msg"></div>
    <button class="btn btn-success" onclick="sauvegarder()">💾 Sauvegarder</button>
    <button class="btn btn-ghost" onclick="resetForm()">Réinitialiser</button>
  </div>

  <div class="card">
    <div class="card-title">📋 Cartes enregistrées</div>
    <div class="existing-grid" id="existing-grid"><div style="color:var(--gris);font-size:0.85rem;text-align:center;padding:1rem">Chargement...</div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, addDoc, doc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = { apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o", authDomain: "audio-francisation.firebaseapp.com", projectId: "audio-francisation", storageBucket: "audio-francisation.firebasestorage.app", messagingSenderId: "840403407027", appId: "1:840403407027:web:46b370498fde6374aaa0c6" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let pendingImage = null;
let audioBlobs = { 1: null, 2: null, 3: null, 4: null, 5: null };
let mediaRecorder = null, audioChunks = [], isRecording = false, recordingSlot = null;
let currentAudio = null;

async function load() {
  const snap = await getDocs(collection(db, 'decrire-conditions-meteo'));
  const cartes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const grid = document.getElementById('existing-grid');
  if (cartes.length === 0) { grid.innerHTML = '<div style="color:var(--gris);text-align:center;padding:1rem;font-size:0.85rem">Aucune carte.</div>'; return; }
  grid.innerHTML = cartes.map(c => {
    const audios = [];
    for (let i = 1; i <= 5; i++) { if (c[`audio${i}`]) audios.push({ url: c[`audio${i}`], label: c[`label${i}`] || `Expression ${i}` }); }
    if (c.audio && audios.length === 0) audios.push({ url: c.audio, label: c.mot || 'Écouter' });
    return `
      <div class="existing-card">
        ${c.image ? `<img src="${c.image}" alt="${c.mot || ''}"/>` : `<div style="width:100%;aspect-ratio:4/3;background:var(--creme);display:flex;align-items:center;justify-content:center;font-size:2rem">🌤</div>`}
        <div class="existing-card-body">
          <div class="existing-card-mot">${c.mot || ''}</div>
          <div class="existing-card-audios">
            ${audios.map((a, i) => `<button class="play-audio-pill" onclick="jouerAudio('${a.url}')"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>${a.label}</button>`).join('')}
          </div>
          <button class="del-btn" onclick="supprimer('${c.id}')">🗑 Supprimer</button>
        </div>
      </div>`;
  }).join('');
}

window.jouerAudio = function(url) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const a = new Audio(url); currentAudio = a; a.play();
};

window.handleImage = function(e) {
  const file = e.target.files[0]; if (!file) return;
  const zone = document.getElementById('img-zone');
  zone.textContent = 'Compression...';
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 800; let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = h * MAX / w; w = MAX; } } else { if (h > MAX) { w = w * MAX / h; h = MAX; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      pendingImage = canvas.toDataURL('image/jpeg', 0.8);
      zone.textContent = '✓ Image prête'; zone.classList.add('has-file');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

window.handleFile = function(slot, e) {
  const file = e.target.files[0]; if (!file) return;
  audioBlobs[slot] = file;
  document.getElementById('play' + slot).disabled = false;
};

window.toggleRecord = async function(slot) {
  if (isRecording && recordingSlot === slot) {
    mediaRecorder.stop(); isRecording = false; recordingSlot = null;
    document.getElementById('rec' + slot).classList.remove('recording');
    document.getElementById('rec' + slot).textContent = '🎙';
  } else {
    if (isRecording) { mediaRecorder.stop(); document.getElementById('rec' + recordingSlot).classList.remove('recording'); document.getElementById('rec' + recordingSlot).textContent = '🎙'; }
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      audioBlobs[slot] = new Blob(audioChunks, { type: 'audio/webm' });
      document.getElementById('play' + slot).disabled = false;
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start(); isRecording = true; recordingSlot = slot;
    document.getElementById('rec' + slot).classList.add('recording');
    document.getElementById('rec' + slot).textContent = '⏹';
  }
};

window.playAudio = function(slot) {
  const blob = audioBlobs[slot]; if (!blob) return;
  new Audio(URL.createObjectURL(blob)).play();
};

window.sauvegarder = async function() {
  const mot = document.getElementById('mot-input').value.trim();
  if (!mot) { showMsg('Entrez le nom de la condition.', 'error'); return; }
  showMsg('Sauvegarde...', 'success');
  try {
    const data = { mot, image: pendingImage || null };
    for (let i = 1; i <= 5; i++) {
      const blob = audioBlobs[i];
      const label = document.getElementById('label' + i).value.trim();
      if (blob) {
        const url = await new Promise(r => { const reader = new FileReader(); reader.onload = e => r(e.target.result); reader.readAsDataURL(blob); });
        data[`audio${i}`] = url;
        data[`label${i}`] = label || `Expression ${i}`;
      }
    }
    await addDoc(collection(db, 'decrire-conditions-meteo'), data);
    showMsg('✓ Sauvegardé !', 'success');
    setTimeout(() => { resetForm(); load(); }, 700);
  } catch(e) { showMsg('Erreur : ' + e.message, 'error'); }
};

window.supprimer = async function(id) {
  if (!confirm('Supprimer cette carte ?')) return;
  await deleteDoc(doc(db, 'decrire-conditions-meteo', id));
  load();
};

window.resetForm = function() {
  document.getElementById('mot-input').value = '';
  pendingImage = null;
  audioBlobs = { 1: null, 2: null, 3: null, 4: null, 5: null };
  const zone = document.getElementById('img-zone');
  zone.textContent = '📷 Cliquez pour choisir une image'; zone.classList.remove('has-file');
  for (let i = 1; i <= 5; i++) {
    document.getElementById('label' + i).value = '';
    document.getElementById('play' + i).disabled = true;
    document.getElementById('rec' + i).classList.remove('recording');
    document.getElementById('rec' + i).textContent = '🎙';
  }
  document.getElementById('form-msg').style.display = 'none';
};

function showMsg(msg, type) {
  const el = document.getElementById('form-msg');
  el.textContent = msg; el.className = 'msg ' + type; el.style.display = 'block';
  if (type === 'success') setTimeout(() => el.style.display = 'none', 2500);
}

load();
</script>
</body>
</html>
