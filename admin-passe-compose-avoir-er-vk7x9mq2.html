<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin – Passé composé 1 (sélection) | JeParle Français</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root { --bleu:#1a3a5c; --bleu-clair:#2a5298; --rouge:#c0392b; --creme:#f9f5ef; --texte:#2c2c2c; --gris:#6b6b6b; --blanc:#fff; --vert:#1a7a4a; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'DM Sans',sans-serif; color:var(--texte); background:var(--creme); }
nav { display:flex; align-items:center; justify-content:space-between; padding:0 5vw; height:60px; background:rgba(26,58,92,0.97); border-bottom:2px solid var(--rouge); }
nav .logo { font-family:'Playfair Display',serif; color:#fff; font-size:1.15rem; }
nav .logo span { color:#e88; }
nav a { color:rgba(255,255,255,0.7); text-decoration:none; font-size:0.85rem; }
.header { background:var(--bleu); color:#fff; padding:1.5rem 5vw; border-bottom:3px solid var(--rouge); }
.header h1 { font-family:'Playfair Display',serif; font-size:1.5rem; }
.header p { opacity:0.75; font-size:0.9rem; margin-top:0.25rem; }
.main { max-width:820px; margin:0 auto; padding:1.5rem 5vw 4rem; }
.barre-info { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem; flex-wrap:wrap; }
.compte { font-weight:700; color:var(--bleu); }
.compte b { color:var(--vert); }
.recherche { flex:1; min-width:180px; padding:0.6rem 0.8rem; border:1.5px solid rgba(26,58,92,0.2); border-radius:9px; font-family:inherit; font-size:0.95rem; }
.liste { display:flex; flex-direction:column; gap:0.5rem; }
.ligne { display:flex; align-items:center; gap:0.9rem; background:var(--blanc); border:1.5px solid rgba(26,58,92,0.1); border-radius:12px; padding:0.6rem 0.9rem; cursor:pointer; transition:border-color 0.15s, background 0.15s; }
.ligne.on { border-color:var(--vert); background:#f2faf5; }
.ligne img { width:64px; height:48px; object-fit:contain; background:var(--creme); border-radius:8px; flex-shrink:0; }
.ligne .nom { flex:1; font-size:1rem; color:var(--bleu); font-weight:500; }
.ligne .son { background:none; border:none; cursor:pointer; font-size:1.2rem; padding:4px 8px; flex-shrink:0; }
.ligne .coche { width:26px; height:26px; border-radius:7px; border:2px solid rgba(26,58,92,0.3); display:flex; align-items:center; justify-content:center; font-size:1rem; color:#fff; flex-shrink:0; }
.ligne.on .coche { background:var(--vert); border-color:var(--vert); }
.vide, .chargement { color:var(--gris); text-align:center; padding:2rem; }
.statut { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--bleu); color:#fff; padding:0.55rem 1.1rem; border-radius:20px; font-size:0.85rem; opacity:0; transition:opacity 0.2s; pointer-events:none; }
.statut.vu { opacity:1; }
</style>
</head>
<body>
<nav>
  <div class="logo">JeParle<span>Français</span> · Admin</div>
  <a href="admin-vk7x9mq2-accueil.html">‹ Accueil admin</a>
</nav>
<div class="header">
  <h1>Passé composé 1 : Avoir et 1er groupe</h1>
  <p>Coche les activités qui doivent apparaître dans le thème « Images au hasard ». Tu peux en ajouter d'autres n'importe quand.</p>
</div>

<div class="main">
  <div class="barre-info">
    <div class="compte"><b id="nSel">0</b> sélectionnée(s) sur <span id="nTot">0</span></div>
    <input type="text" class="recherche" id="recherche" placeholder="🔎 Filtrer par mot…"/>
  </div>
  <div class="liste" id="liste"><div class="chargement">Chargement…</div></div>
</div>
<div class="statut" id="statut"></div>

<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o",
  authDomain: "audio-francisation.firebaseapp.com",
  projectId: "audio-francisation",
  storageBucket: "audio-francisation.firebasestorage.app",
  messagingSenderId: "840403407027",
  appId: "1:840403407027:web:46b370498fde6374aaa0c6"
};
const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const db = getFirestore(app);
const COL = 'activites-habituelles';   // source des images/audios
const CHAMP = 'pc1';                    // marqueur "passé composé 1"

let cartes = [];
let player = null;
const listeEl = document.getElementById('liste');

function nomAffiche(c) { return (c.mot || '').split('/').map(s=>s.trim()).join(' / '); }

function statut(txt) {
  const s = document.getElementById('statut');
  s.textContent = txt; s.classList.add('vu');
  clearTimeout(s._t); s._t = setTimeout(()=>s.classList.remove('vu'), 1400);
}

function majCompte() {
  document.getElementById('nSel').textContent = cartes.filter(c => c[CHAMP]).length;
  document.getElementById('nTot').textContent = cartes.length;
}

function rendre() {
  const q = document.getElementById('recherche').value.trim().toLowerCase();
  const vis = cartes.filter(c => !q || nomAffiche(c).toLowerCase().includes(q));
  if (!vis.length) { listeEl.innerHTML = '<div class="vide">Aucune activité.</div>'; return; }
  listeEl.innerHTML = vis.map(c => `
    <div class="ligne ${c[CHAMP] ? 'on' : ''}" id="l-${c.id}" onclick="basculer('${c.id}')">
      ${c.image ? `<img src="${c.image}" alt=""/>` : '<div style="width:64px;height:48px"></div>'}
      <div class="nom">${nomAffiche(c) || '—'}</div>
      ${c.audio ? `<button class="son" title="Écouter" onclick="jouer(event,'${c.id}')">🔊</button>` : ''}
      <div class="coche">${c[CHAMP] ? '✓' : ''}</div>
    </div>`).join('');
}

window.jouer = function(e, id) {
  e.stopPropagation();
  const c = cartes.find(x => x.id === id);
  if (!c || !c.audio) return;
  if (!player) { player = new Audio(); player.setAttribute('playsinline',''); }
  player.src = c.audio; player.play().catch(()=>{});
};

window.basculer = async function(id) {
  const c = cartes.find(x => x.id === id);
  if (!c) return;
  const nouveau = !c[CHAMP];
  c[CHAMP] = nouveau;                    // maj locale immédiate
  const el = document.getElementById('l-' + id);
  el.classList.toggle('on', nouveau);
  el.querySelector('.coche').textContent = nouveau ? '✓' : '';
  majCompte();
  try {
    await updateDoc(doc(db, COL, id), { [CHAMP]: nouveau });
    statut(nouveau ? '✓ Ajoutée' : 'Retirée');
  } catch(err) {
    c[CHAMP] = !nouveau; rendre(); majCompte();   // annule si échec
    statut('Erreur : ' + err.message);
  }
};

document.getElementById('recherche').addEventListener('input', rendre);

async function charger() {
  const snap = await getDocs(collection(db, COL));
  cartes = snap.docs.map(d => ({ id:d.id, ...d.data() }))
    .sort((a,b) => nomAffiche(a).localeCompare(nomAffiche(b)));
  majCompte();
  rendre();
}
charger();
</script>
<!-- Connexion admin (même compte que tes autres pages admin) -->
<script type="module" src="admin-auth.js"></script>
</body>
</html>
