<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jeu en direct | JeParle Français</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root { --bleu: #1a3a5c; --bleu-clair: #2a5298; --rouge: #c0392b; --creme: #f9f5ef; --texte: #2c2c2c; --gris: #6b6b6b; --blanc: #ffffff; --vert: #1a7a4a; --orange: #e67e22; --violet: #8e44ad; --turquoise: #16a085; --sepia: #8d6e63; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: 'DM Sans', sans-serif; color: var(--texte); background: var(--creme); display: flex; flex-direction: column; }
.bar { background: var(--bleu); color: #fff; padding: 0.9rem 1.25rem; display: flex; align-items: center; justify-content: space-between; }
.bar .logo { font-family: 'Playfair Display', serif; font-size: 1.05rem; }
.bar-droite { display: flex; align-items: center; gap: 12px; }
.bar .logo span { color: #ff9d8a; }
.bar .mon-num { font-size: 0.85rem; background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 20px; cursor: pointer; }
.bar .mon-num:hover { background: rgba(255,255,255,0.28); }
.bar .retour-accueil { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
.bar .retour-accueil:hover { color: #fff; }
.zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; text-align: center; }

h2 { font-family: 'Playfair Display', serif; color: var(--bleu); font-size: 1.5rem; margin-bottom: 0.5rem; }
.sous { color: var(--gris); font-size: 1rem; margin-bottom: 1.5rem; }

/* choix numéro */
.grille-num { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; max-width: 420px; }
.num-btn { aspect-ratio: 1; border: 2px solid rgba(26,58,92,0.15); background: var(--blanc); border-radius: 14px; font-size: 1.6rem; font-weight: 700; color: var(--bleu); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.num-btn:active { background: var(--bleu); color: #fff; }
.num-btn.pris { opacity: 0.25; pointer-events: none; }
.eleves-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; width: 100%; max-width: 480px; margin-bottom: 0.5rem; }
.eleve-btn { padding: 1rem 0.4rem; border: 2px solid rgba(26,58,92,0.15); background: var(--blanc); border-radius: 14px; font-size: 1.15rem; font-weight: 700; color: var(--bleu); cursor: pointer; }
.eleve-btn.sel { background: var(--bleu); color: #fff; border-color: var(--bleu); }
.eleve-btn.pris { opacity: 0.25; pointer-events: none; }

/* question */
.q-img { width: 100%; max-width: 360px; border-radius: 16px; box-shadow: 0 4px 20px rgba(26,58,92,0.15); margin-bottom: 1rem; }
.audio-play { background: var(--bleu); color: #fff; border: none; border-radius: 30px; padding: 0.7rem 1.5rem; font-family: inherit; font-size: 1.05rem; font-weight: 600; cursor: pointer; margin-bottom: 1rem; }
.audio-play:active { transform: scale(0.97); }
.q-texte { font-size: 1.35rem; font-weight: 500; color: var(--bleu); margin-bottom: 1.5rem; max-width: 500px; }
.reps { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 420px; }
.reps-annees { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.reps-annees .rep { padding: 1.1rem; }
.rep { padding: 1.25rem; border-radius: 16px; border: none; font-family: inherit; font-size: 1.25rem; font-weight: 700; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
.rep:active { transform: scale(0.98); }
.rep .ico { font-size: 1.6rem; }
.rep.interdit, .rep.faux { background: var(--rouge); }
.rep.permis, .rep.vrai { background: var(--vert); }
.rep.obligatoire { background: var(--orange); }
.rep.ponctuelle { background: var(--bleu-clair); }
.rep.habituelle { background: var(--orange); }
.rep.formel { background: var(--bleu-clair); }
.rep.informel { background: var(--orange); }
.rep.present { background: var(--bleu-clair); }
.rep.futur { background: var(--orange); }
.rep.reponse1 { background: var(--bleu-clair); }
.rep.reponse2 { background: var(--orange); }
.rep.demander { background: var(--bleu-clair); }
.rep.donner { background: var(--orange); }
.rep.receptionniste { background: var(--bleu-clair); }
.rep.patient { background: var(--orange); }
.rep.locataire { background: var(--bleu-clair); }
.rep.proprietaire { background: var(--orange); }
.rep.imparfait { background: var(--orange); }
.rep.presente { background: var(--bleu-clair); }
.rep.prevision { background: var(--orange); }
.rep.je { background: var(--bleu-clair); }
.rep.tu { background: var(--orange); }
.rep.il { background: var(--vert); }
.rep.elle { background: var(--violet); }
.rep.an1930 { background: var(--sepia); }
.rep.an1950 { background: var(--rouge); }
.rep.an1975 { background: var(--orange); }
.rep.an1993 { background: var(--vert); }
.rep.an2002 { background: var(--turquoise); }
.rep.an2016 { background: var(--bleu-clair); }
.rep.an2025 { background: var(--violet); }

/* grille d'images (type grille) */
.grille-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 680px; }
.grille-img { border: 2px solid rgba(26,58,92,0.15); background: #fff; border-radius: 12px; padding: 0; overflow: hidden; cursor: pointer; aspect-ratio: 1; }
.grille-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.grille-img:active { border-color: var(--bleu); transform: scale(0.97); }
@media (max-width: 520px) { .grille-board { grid-template-columns: repeat(3, 1fr); } }
.big-ico { font-size: 4rem; margin-bottom: 1rem; }
.attente-dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--gris); margin:0 3px; animation: blink 1.4s infinite both; }
.attente-dot:nth-child(2){animation-delay:.2s} .attente-dot:nth-child(3){animation-delay:.4s}
@keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="bar">
  <div class="logo">JeParle<span>Français</span></div>
  <div class="bar-droite">
    <div class="mon-num hidden" id="mon-num"></div>
    <a href="index.html" class="retour-accueil">Retour à l'accueil ›</a>
  </div>
</div>
<div class="zone" id="zone">
  <div class="sous">Chargement...</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot, query, where, runTransaction } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o",
  authDomain: "audio-francisation.firebaseapp.com",
  projectId: "audio-francisation",
  storageBucket: "audio-francisation.firebasestorage.app",
  messagingSenderId: "840403407027",
  appId: "1:840403407027:web:46b370498fde6374aaa0c6"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ETAT_DOC = doc(db, 'jeu-direct-etat', 'partie');
const COL_JOUEURS = 'jeu-direct-joueurs';
const COL_Q = 'jeu-direct-questions';

const TYPES = {
  ipo: [ {v:'interdit',ico:'❌',lib:'Interdit'}, {v:'permis',ico:'✅',lib:'Permis'}, {v:'obligatoire',ico:'❗',lib:'Obligatoire'} ],
  vf:  [ {v:'vrai',ico:'✅',lib:'Vrai'}, {v:'faux',ico:'❌',lib:'Faux'} ],
  fi:  [ {v:'formel',ico:'🎩',lib:'Formel'}, {v:'informel',ico:'💬',lib:'Informel'} ],
  ph:  [ {v:'ponctuelle',ico:'1️⃣',lib:'Ponctuelle'}, {v:'habituelle',ico:'🔁',lib:'Habituelle'} ],
  pf:  [ {v:'present',ico:'⏱️',lib:'Présent'}, {v:'futur',ico:'⏩',lib:'Futur'} ],
  r12: [ {v:'reponse1',ico:'1️⃣',lib:'Réponse 1'}, {v:'reponse2',ico:'2️⃣',lib:'Réponse 2'} ],
  dd:  [ {v:'demander',ico:'❓',lib:'Demander'}, {v:'donner',ico:'❗',lib:'Donner'} ],
  rp:  [ {v:'receptionniste',ico:'🧑‍💼',lib:'Réceptionniste'}, {v:'patient',ico:'🤒',lib:'Patient'} ],
  cv:  [ {v:'client',ico:'🙋',lib:'Client'}, {v:'vendeur',ico:'🧑‍💼',lib:'Vendeur'} ],
  an:  [ {v:'aime',ico:'❤️',lib:'Aime'}, {v:'naime',ico:'💔',lib:'N\'aime pas'} ],
  cp:  [ {v:'present',ico:'⏱️',lib:'Présent de l\'indicatif'}, {v:'passecompose',ico:'⏪',lib:'Passé composé'} ],
  ppf: [ {v:'passe',ico:'⏪',lib:'Passé'}, {v:'present',ico:'⏱️',lib:'Présent'}, {v:'futur',ico:'⏩',lib:'Futur'} ],
  lp:  [ {v:'locataire',ico:'🔑',lib:'Locataire'}, {v:'proprietaire',ico:'🏡',lib:'Propriétaire'} ],
  pi:  [ {v:'present',ico:'⏱️',lib:'Présent de l\'indicatif'}, {v:'imparfait',ico:'🕰️',lib:'Imparfait'} ],
  mp:  [ {v:'presente',ico:'🌤️',lib:'Météo présente'}, {v:'prevision',ico:'📅',lib:'Prévision'} ],
  pron:[ {v:'je',ico:'🙋',lib:'Je'}, {v:'tu',ico:'👉',lib:'Tu'}, {v:'il',ico:'👨',lib:'Il'}, {v:'elle',ico:'👩',lib:'Elle'} ],
  ligne:[ {v:'an1930',ico:'',lib:'1930'}, {v:'an1950',ico:'',lib:'1950'}, {v:'an1975',ico:'',lib:'1975'}, {v:'an1993',ico:'',lib:'1993'}, {v:'an2002',ico:'',lib:'2002'}, {v:'an2016',ico:'',lib:'2016'}, {v:'an2025',ico:'',lib:'2025'} ]
};

let etat = null;          // état courant de la partie
let monInitiales = null, monDocId = null;  // identité (initiales) de cette tablette
let maPartie = null;      // partieId auquel je suis inscrit
let questions = [];       // questions du quiz courant (chargées quand la partie démarre)
let quizChargeId = null;
let aVote = false;        // ai-je voté à la question courante ?
let derniereQuestionVotee = -1;
let renduQ = -1;   // évite de réafficher la même question
let monScore = 0, mesVotes = {};   // suivis localement -> pas de lecture réseau au vote
let roster = [], selection = [];

const zone = document.getElementById('zone');

let choixPartie = null, unsubJoueurs = null, restaurePartie = null;
const LS_KEY = 'jdirect-inscription';
function sauverInscription(){ try { localStorage.setItem(LS_KEY, JSON.stringify({partieId: maPartie, initiales: monInitiales, docId: monDocId})); } catch(e){} }
function lireInscription(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e){ return null; } }
function effacerInscription(){ try { localStorage.removeItem(LS_KEY); } catch(e){} }
function stopJoueursListener(){ if (unsubJoueurs){ unsubJoueurs(); unsubJoueurs = null; } }
function quitterChoix(){ choixPartie = null; stopJoueursListener(); }

function setMonNum() {
  const el = document.getElementById('mon-num');
  if (monInitiales && monInitiales.length) {
    el.textContent = monInitiales.join(' · ') + ' ✎';
    el.title = 'Changer d\'équipe';
    el.onclick = window.changerEquipe;
    el.classList.remove('hidden');
  } else { el.onclick = null; el.classList.add('hidden'); }
}

// permet de corriger si un élève s'est trompé d'équipe
window.changerEquipe = async function() {
  if (!monInitiales || !monInitiales.length) return;
  if (!confirm('Changer les élèves de cette tablette ?')) return;
  try { if (monDocId) await deleteDoc(doc(db, COL_JOUEURS, monDocId)); } catch(e){}
  monInitiales = null; monDocId = null; maPartie = null;
  monScore = 0; mesVotes = {}; derniereQuestionVotee = -1;
  choixPartie = null; restaurePartie = null;
  effacerInscription(); setMonNum();
  await majAffichage();
};

// écoute l'état de la partie en temps réel
onSnapshot(ETAT_DOC, async (snap) => {
  etat = snap.exists() ? snap.data() : null;
  await majAffichage();
});

async function majAffichage() {
  if (!etat || !etat.partieId || etat.phase === 'fin') {
    // pas de partie active OU partie terminée
    quitterChoix();
    monInitiales = null; monDocId = null; maPartie = null; setMonNum();
    if (etat && etat.phase === 'fin') { effacerInscription(); montrerFin(); }
    else montrerPasDePartie();
    return;
  }

  // nouvelle partie détectée -> réinitialiser mon inscription
  if (maPartie && maPartie !== etat.partieId) {
    quitterChoix();
    monInitiales = null; monDocId = null; maPartie = null; setMonNum();
    monScore = 0; mesVotes = {}; derniereQuestionVotee = -1;
    effacerInscription();
  }

  // sorti puis revenu : rejoindre avec les initiales déjà choisies (une seule tentative par partie)
  if (!monDocId && restaurePartie !== etat.partieId) {
    restaurePartie = etat.partieId;
    const sauv = lireInscription();
    if (sauv && sauv.partieId === etat.partieId && sauv.docId) {
      try {
        const d = await getDoc(doc(db, COL_JOUEURS, sauv.docId));
        if (d.exists()) {
          const data = d.data();
          monDocId = sauv.docId; monInitiales = data.initiales || sauv.initiales || []; maPartie = etat.partieId;
          monScore = data.score || 0; mesVotes = data.votes || {};
          if (etat.phase === 'question') {
            if (etat.type === 'grille') { const t = etat.tour || 0; if (mesVotes['q'+t] !== undefined) derniereQuestionVotee = 'g'+t; }
            else if (mesVotes['q' + etat.questionIndex] !== undefined) derniereQuestionVotee = etat.questionIndex;
          }
          setMonNum();
        }
      } catch(e){}
    }
  }

  // pas encore inscrit -> montrer le choix de numéro
  if (!monDocId) { await montrerChoixEleves(); return; }

  // inscrit : quitter l'écran de choix et suivre la phase
  quitterChoix();
  if (etat.phase === 'attente') { montrerAttente('En attente du début du jeu'); return; }
  if (etat.phase === 'question') { await montrerQuestion(); return; }
  if (etat.phase === 'resultats') { montrerAttente('Regarde l\'écran !'); return; }
}

function montrerPasDePartie() {
  zone.innerHTML = `<div class="big-ico">🎮</div><h2>Jeu en direct</h2><div class="sous">En attente d'une partie…<br>Ton enseignant va bientôt commencer.</div>`;
}

function montrerFin() {
  zone.innerHTML = `<div class="big-ico">🎉</div><h2>C'est terminé !</h2><div class="sous">Merci d'avoir joué. Regarde les résultats à l'écran !</div>`;
}

async function montrerChoixEleves() {
  if (choixPartie === etat.partieId) return;   // déjà affiché -> ne pas reconstruire (évite le gel)
  choixPartie = etat.partieId;
  selection = [];
  // charger la liste des élèves (configurée par l'enseignant)
  try { const d = await getDoc(doc(db, 'jeu-direct-config', 'eleves')); roster = (d.exists() && Array.isArray(d.data().liste)) ? d.data().liste : []; }
  catch(e) { roster = []; }
  if (!roster.length) {
    zone.innerHTML = `<div class="big-ico">🎮</div><h2>Jeu en direct</h2><div class="sous">Aucun élève configuré.<br>Ton enseignant doit créer la liste des élèves.</div>`;
    choixPartie = null; return;
  }
  const snap = await getDocs(query(collection(db, COL_JOUEURS), where('partieId', '==', etat.partieId)));
  const pris = new Set(); snap.docs.forEach(dd => (dd.data().initiales || []).forEach(x => pris.add(x)));
  const boutons = roster.map(e => `<button class="eleve-btn ${pris.has(e)?'pris':''}" data-e="${encodeURIComponent(e)}" onclick="toggleEleve(this)">${e}</button>`).join('');
  zone.innerHTML = `<h2>Qui joue sur cette tablette ?</h2><div class="sous">Touche l'initiale de chaque élève, puis Rejoindre.</div><div class="eleves-grille">${boutons}</div><button class="audio-play" id="btn-rejoindre" style="margin-top:1rem;opacity:.5" disabled onclick="rejoindre()">✋ Rejoindre le quiz</button>`;
  // mise à jour en direct des initiales déjà prises par d'autres tablettes
  stopJoueursListener();
  unsubJoueurs = onSnapshot(query(collection(db, COL_JOUEURS), where('partieId', '==', etat.partieId)), (snp) => {
    const p = new Set(); snp.docs.forEach(dd => (dd.data().initiales || []).forEach(x => p.add(x)));
    document.querySelectorAll('.eleve-btn').forEach(b => {
      const e = decodeURIComponent(b.dataset.e);
      b.classList.toggle('pris', p.has(e) && !selection.includes(e));
    });
  });
}

window.toggleEleve = function(btn) {
  if (btn.classList.contains('pris')) return;
  const e = decodeURIComponent(btn.dataset.e);
  const i = selection.indexOf(e);
  if (i >= 0) { selection.splice(i, 1); btn.classList.remove('sel'); }
  else { selection.push(e); btn.classList.add('sel'); }
  const rb = document.getElementById('btn-rejoindre');
  if (rb) { rb.disabled = selection.length === 0; rb.style.opacity = selection.length ? '1' : '.5'; }
};

window.rejoindre = async function() {
  if (!etat || !etat.partieId || !selection.length) return;
  const btn = document.getElementById('btn-rejoindre');
  if (btn) { btn.disabled = true; btn.textContent = 'Connexion…'; }
  const ini = selection.slice();
  const docId = etat.partieId + '_' + ini.slice().sort().join('~');
  const ref = doc(db, COL_JOUEURS, docId);
  try {
    const d = await getDoc(ref);
    if (d.exists()) {                      // déjà là (rejoin) -> récupérer score/votes
      const data = d.data();
      monScore = data.score || 0; mesVotes = data.votes || {};
    } else {
      await setDoc(ref, { partieId: etat.partieId, initiales: ini, libelle: ini.join(' · '), score: 0, votes: {} });
      monScore = 0; mesVotes = {};
    }
    monInitiales = ini; monDocId = docId; maPartie = etat.partieId;
    derniereQuestionVotee = -1;
    sauverInscription(); setMonNum();
    await majAffichage();
  } catch(e) {
    choixPartie = null;
    if (btn) { btn.disabled = false; btn.textContent = '✋ Rejoindre le quiz'; }
  }
};
async function chargerQuestions() {
  if (quizChargeId === etat.quizId && questions.length) return;
  const snap = await getDocs(query(collection(db, COL_Q), where('quizId', '==', etat.quizId)));
  questions = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>(a.ordre??99)-(b.ordre??99));
  quizChargeId = etat.quizId;
}

async function montrerQuestion() {
  await chargerQuestions();
  if (etat.type === 'grille') { montrerGrille(); return; }
  const q = questions[etat.questionIndex];
  if (!q) { montrerAttente('En attente…'); return; }

  // ai-je déjà voté à CETTE question ?
  if (derniereQuestionVotee === etat.questionIndex) { montrerReponseRecue(); return; }
  // déjà affichée -> ne pas reconstruire (évite le clignotement / rechargement)
  if (renduQ === etat.questionIndex) return;
  renduQ = etat.questionIndex;

  const reps = TYPES[etat.type] || TYPES.ipo;
  let boutons = reps.map(r => `<button class="rep ${r.v}" onclick="voter('${r.v}')"><span class="ico">${r.ico}</span>${r.lib}</button>`).join('');
  const imgHtml = q.image ? `<img class="q-img" src="${q.image}" decoding="async"/>` : '';
  const audioHtml = q.audio ? `<button class="audio-play" onclick="jouerAudioQ()">🔊 Écouter</button>` : '';
  const vide = !q.image && !q.audio && !q.texte;
  const consigneVide = (etat.type === 'ligne') ? '🎵 Écoute la chanson…' : '👂 Écoute la phrase…';
  const texteHtml = vide ? `<div class="q-texte" style="color:var(--gris)">${consigneVide}</div>` : `<div class="q-texte">${q.texte || ''}</div>`;
  const repsClass = (etat.type === 'ligne') ? 'reps reps-annees' : 'reps';
  zone.innerHTML = `${imgHtml}${audioHtml}${texteHtml}<div class="${repsClass}">${boutons}</div>`;
}

// --- type "grille" : tableau d'images, l'enseignant dit le mot, l'élève touche la bonne image ---
// L'enseignant indique la bonne image sur sa console ; le score est calculé par l'écran animateur.
function montrerGrille() {
  const tour = etat.tour || 0;
  if (derniereQuestionVotee === 'g' + tour) { montrerReponseRecue(); return; }
  if (renduQ === 'g' + tour) return;
  renduQ = 'g' + tour;
  const board = questions; // ordre fixe (trié par ordre)
  if (!board.length) { montrerAttente('En attente…'); return; }
  const tuiles = board.map((c, i) => `<button class="grille-img" onclick="voterGrille(${i})"><img src="${c.image}" decoding="async" alt=""/></button>`).join('');
  zone.innerHTML = `<div class="q-texte" style="color:var(--gris);font-size:1.1rem">👂 Touche la bonne image</div><div class="grille-board">${tuiles}</div>`;
}

window.voterGrille = function(i) {
  if (aVote) return;
  aVote = true;
  const tour = etat.tour || 0;
  mesVotes['q' + tour] = i;              // on enregistre seulement le choix
  derniereQuestionVotee = 'g' + tour;
  montrerReponseRecue();
  const ref = doc(db, COL_JOUEURS, monDocId);
  const payload = { votes: mesVotes };
  updateDoc(ref, payload).catch(() => { updateDoc(ref, payload).catch(()=>{}); });
};

let audioQ = null;
window.jouerAudioQ = function() {
  const q = questions[etat.questionIndex];
  if (!q || !q.audio) return;
  if (!audioQ) { audioQ = new Audio(); audioQ.setAttribute('playsinline', ''); }
  audioQ.src = q.audio;
  audioQ.play().catch(()=>{});
};

window.voter = function(v) {
  if (aVote) return;
  aVote = true;
  const q = questions[etat.questionIndex];
  const bon = q && q.reponse === v;

  // 1) réagir TOUT DE SUITE (aucune attente réseau)
  mesVotes['q' + etat.questionIndex] = v;
  if (bon) monScore++;
  derniereQuestionVotee = etat.questionIndex;
  montrerReponseRecue();

  // 2) enregistrer en arrière-plan (ne bloque pas l'écran) ; 1 réessai si échec
  const ref = doc(db, COL_JOUEURS, monDocId);
  const payload = { votes: mesVotes, score: monScore };
  updateDoc(ref, payload).catch(() => { updateDoc(ref, payload).catch(()=>{}); });
};

function montrerReponseRecue() {
  aVote = false; renduQ = -1;
  zone.innerHTML = `<div class="big-ico">✓</div><h2>Réponse reçue !</h2><div class="sous">Regarde l'écran et attends la prochaine question.</div>`;
}

function montrerAttente(txt) {
  aVote = false; renduQ = -1;
  zone.innerHTML = `<div class="big-ico">⏳</div><h2>${txt}</h2><div class="sous"><span class="attente-dot"></span><span class="attente-dot"></span><span class="attente-dot"></span></div>`;
}
</script>
</body>
</html>
