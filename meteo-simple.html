<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>La météo (simple) | JeParle Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
:root { --bleu:#1a3a5c; --bleu-clair:#2a5298; --rouge:#c0392b; --creme:#f9f5ef; --texte:#2c2c2c; --gris:#6b6b6b; --blanc:#fff; --vert:#1a7a4a; --ombre:0 2px 24px rgba(26,58,92,0.10); }
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'DM Sans',sans-serif; color:var(--texte); background:var(--creme); min-height:100vh; }
nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 5vw; height:64px; background:rgba(255,255,255,0.95); backdrop-filter:blur(8px); border-bottom:1px solid rgba(26,58,92,0.08); box-shadow:var(--ombre); }
.nav-logo { font-family:'Playfair Display',serif; font-size:1.25rem; color:var(--bleu); text-decoration:none; }
.nav-logo span { color:var(--rouge); }
.nav-back { display:flex; align-items:center; gap:6px; text-decoration:none; color:var(--gris); font-size:0.9rem; }
.nav-back:hover { color:var(--bleu); }
.nav-back svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.page-header { background:var(--bleu); padding:100px 5vw 46px; position:relative; overflow:hidden; }
.page-header::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 80% 50%, rgba(42,82,152,0.5) 0%, transparent 70%); }
.page-header-inner { position:relative; z-index:1; }
.page-eyebrow { font-size:0.75rem; font-weight:500; letter-spacing:2.5px; text-transform:uppercase; color:rgba(255,255,255,0.5); margin-bottom:0.75rem; }
.page-header h1 { font-family:'Playfair Display',serif; font-size:clamp(1.8rem,4vw,2.8rem); color:var(--blanc); line-height:1.1; margin-bottom:0.5rem; }
.page-header p { font-size:0.95rem; color:rgba(255,255,255,0.6); font-weight:300; }
.main { max-width:900px; margin:0 auto; padding:2rem 5vw 5rem; }
.recherche { display:flex; gap:10px; max-width:520px; margin:0 auto 1rem; }
.recherche input { flex:1; padding:0.9rem 1.1rem; border:1.5px solid rgba(26,58,92,0.18); border-radius:14px; font-family:inherit; font-size:1.1rem; background:var(--blanc); }
.recherche input:focus { outline:none; border-color:var(--bleu); }
.recherche button { padding:0.9rem 1.5rem; border:none; border-radius:14px; background:var(--bleu); color:#fff; font-family:inherit; font-size:1.05rem; font-weight:700; cursor:pointer; }
.recherche button:hover { background:var(--bleu-clair); }
.villes-rapides { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:1.5rem; }
.ville-pill { padding:8px 16px; border-radius:20px; border:1.5px solid rgba(26,58,92,0.15); background:var(--blanc); color:var(--bleu); font-size:0.95rem; cursor:pointer; font-family:inherit; font-weight:500; }
.ville-pill:hover { border-color:var(--bleu); background:var(--bleu); color:#fff; }
.suggestions { max-width:560px; margin:0 auto 1.5rem; background:var(--blanc); border:1px solid rgba(26,58,92,0.1); border-radius:14px; padding:0.75rem; box-shadow:var(--ombre); }
.suggestions .titre { font-size:0.85rem; color:var(--gris); margin:0.25rem 0.5rem 0.5rem; }
.sugg-btn { display:block; width:100%; text-align:left; padding:0.65rem 0.8rem; border:none; background:none; border-radius:10px; font-family:inherit; font-size:1rem; color:var(--texte); cursor:pointer; }
.sugg-btn:hover { background:var(--creme); color:var(--bleu); }
.sugg-btn .region { color:var(--gris); font-size:0.85rem; }
.etat { text-align:center; color:var(--gris); padding:1.5rem; font-size:1.05rem; }
.etat.err { color:var(--rouge); }
/* Météo actuelle */
.actuelle { background:var(--bleu); color:#fff; border-radius:22px; padding:2rem 1.5rem; text-align:center; margin-bottom:1.75rem; box-shadow:var(--ombre); }
.actuelle .lieu { font-size:1.2rem; margin-bottom:0.5rem; }
.actuelle .emoji { font-size:6rem; line-height:1; margin:0.3rem 0; }
.actuelle .mot { font-family:'Playfair Display',serif; font-size:2.2rem; text-transform:capitalize; }
.actuelle .temp { font-size:2.6rem; font-weight:700; margin-top:0.5rem; }
.actuelle .minmax { font-size:1.05rem; opacity:0.85; margin-top:0.35rem; }
.actuelle .vent { font-size:1.1rem; margin-top:0.5rem; background:rgba(255,255,255,0.15); display:inline-block; padding:4px 14px; border-radius:20px; }
.titre-prev { font-family:'Playfair Display',serif; color:var(--bleu); font-size:1.3rem; margin:0 0 1rem 2px; }
.prev-grille { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:1rem; }
.jour { background:var(--blanc); border:1px solid rgba(26,58,92,0.08); border-radius:18px; padding:1.1rem 0.6rem; text-align:center; box-shadow:0 2px 12px rgba(26,58,92,0.06); }
.jour .nom-jour { font-weight:700; color:var(--bleu); font-size:1rem; text-transform:capitalize; }
.jour .date-jour { font-size:0.78rem; color:var(--gris); margin-bottom:0.4rem; }
.jour .emoji { font-size:3rem; line-height:1; margin:0.3rem 0; }
.jour .mot { font-size:1.05rem; color:var(--bleu); font-weight:500; text-transform:capitalize; min-height:1.4em; }
.jour .minmax { margin-top:0.5rem; font-size:1.05rem; }
.jour .tmax { color:var(--rouge); font-weight:700; }
.jour .tmin { color:var(--bleu-clair); }
.jour .vent { font-size:0.85rem; color:var(--gris); margin-top:0.3rem; }
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">JeParle<span>Français</span>.ca</a>
  <a class="nav-back" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Accueil
  </a>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <p class="page-eyebrow">La météo · Niveau débutant</p>
    <h1>La météo</h1>
    <p>Écris une ville ou clique un bouton pour voir la météo</p>
  </div>
</div>

<div class="main">
  <form class="recherche" onsubmit="chercher(); return false;">
    <input type="text" id="ville" placeholder="Ex : Montréal" autocomplete="off"/>
    <button type="submit">Voir</button>
  </form>
  <div class="villes-rapides" id="villes-rapides"></div>
  <div id="suggestions"></div>

  <div id="etat" class="etat">Choisis une ville.</div>
  <div id="resultat"></div>
</div>

<script>
// Open-Meteo : gratuit, sans clé. Vocabulaire simplifié (débutant).
const VILLES_RAPIDES = ['Montréal','Québec','Longueuil','Laval','Gatineau','Sherbrooke','Trois-Rivières'];
let resultats = [];

// Code météo WMO -> [emoji, mot simple]
function motSimple(code, ventFort) {
  const m = {
    0:['☀️','soleil'], 1:['☀️','soleil'],
    2:['☁️','nuages'], 3:['☁️','nuages'],
    45:['🌫️','brouillard'], 48:['🌫️','brouillard'],
    51:['🌧️','pluie'], 53:['🌧️','pluie'], 55:['🌧️','pluie'],
    56:['🧊','verglas'], 57:['🧊','verglas'],
    61:['🌧️','pluie'], 63:['🌧️','pluie'], 65:['🌧️','pluie'],
    66:['🧊','verglas'], 67:['🧊','verglas'],
    71:['🌨️','neige'], 73:['🌨️','neige'], 77:['🌨️','neige'],
    75:['❄️','tempête de neige'],
    80:['🌦️','averses'], 81:['🌦️','averses'], 82:['🌦️','averses'],
    85:['🌨️','neige'], 86:['❄️','tempête de neige'],
    95:['⛈️','orage'], 96:['🧊','grêle'], 99:['🧊','grêle']
  };
  return m[code] || ['🌡️','—'];
}
const VENT_FORT = 30; // km/h

const JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

function majEtat(txt, err) {
  const el = document.getElementById('etat');
  el.textContent = txt; el.className = 'etat' + (err ? ' err' : '');
  el.style.display = txt ? 'block' : 'none';
}

window.chercherVille = function(nom) { document.getElementById('ville').value = nom; chercher(); };

// Priorité : Canada d'abord, puis Québec
function scoreLieu(v) { return (v.country_code === 'CA' ? 2 : 0) + (/qu[ée]bec/i.test(v.admin1 || '') ? 1 : 0); }

window.chercher = async function() {
  const nom = document.getElementById('ville').value.trim();
  document.getElementById('resultat').innerHTML = '';
  document.getElementById('suggestions').innerHTML = '';
  if (!nom) { majEtat('Écris le nom d\'une ville.', true); return; }
  majEtat('Recherche…', false);
  try {
    const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(nom) + '&count=10&language=fr&format=json').then(x => x.json());
    resultats = (r.results || []).slice();
    if (!resultats.length) { majEtat('Ville introuvable. Vérifie l\'orthographe.', true); return; }
    resultats.sort((a, b) => scoreLieu(b) - scoreLieu(a)); // Québec/Canada en premier (tri stable)
    afficherSuggestions();
    choisirResultat(0);
  } catch (e) {
    majEtat('Erreur de connexion. Réessaie.', true);
  }
};

function afficherSuggestions() {
  const box = document.getElementById('suggestions');
  if (resultats.length < 2) { box.innerHTML = ''; return; }
  const items = resultats.slice(0, 5).map((v, i) =>
    `<button class="sugg-btn" onclick="choisirResultat(${i})">${v.name}<span class="region"> — ${[v.admin1, v.country].filter(Boolean).join(', ')}</span></button>`
  ).join('');
  box.innerHTML = `<div class="suggestions"><div class="titre">Pas la bonne ville&nbsp;? Choisis&nbsp;:</div>${items}</div>`;
}

window.choisirResultat = async function(i) {
  const v = resultats[i]; if (!v) return;
  majEtat('Chargement…', false);
  try {
    const url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + v.latitude + '&longitude=' + v.longitude
      + '&current=temperature_2m,weather_code,wind_speed_10m'
      + '&daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max'
      + '&timezone=auto&forecast_days=5';
    const data = await fetch(url).then(x => x.json());
    afficher(v, data);
    majEtat('', false);
  } catch (e) { majEtat('Erreur de connexion. Réessaie.', true); }
};

function afficher(v, data) {
  const cur = data.current, d = data.daily;
  const ventFortAuj = cur.wind_speed_10m >= VENT_FORT;
  const [emoji, mot] = motSimple(cur.weather_code);
  const lieu = v.name + (v.admin1 ? ', ' + v.admin1 : '');
  let html = `
    <div class="actuelle">
      <div class="lieu">${lieu}</div>
      <div class="emoji">${emoji}</div>
      <div class="mot">${mot}</div>
      <div class="temp">${Math.round(cur.temperature_2m)}°C</div>
      <div class="minmax">Maximum ${Math.round(d.temperature_2m_max[0])}°C · Minimum ${Math.round(d.temperature_2m_min[0])}°C</div>
      ${ventFortAuj ? '<div class="vent">💨 du vent</div>' : ''}
    </div>
    <div class="titre-prev">Les 5 prochains jours</div>
    <div class="prev-grille">`;
  for (let i = 0; i < d.time.length; i++) {
    const dt = new Date(d.time[i] + 'T12:00');
    const [em, mo] = motSimple(d.weather_code[i]);
    const nom = (i === 0) ? "Aujourd'hui" : JOURS[dt.getDay()];
    const ventFort = d.wind_speed_10m_max && d.wind_speed_10m_max[i] >= VENT_FORT;
    html += `
      <div class="jour">
        <div class="nom-jour">${nom}</div>
        <div class="date-jour">${dt.getDate()} ${MOIS[dt.getMonth()]}</div>
        <div class="emoji">${em}</div>
        <div class="mot">${mo}</div>
        <div class="minmax"><span class="tmax">${Math.round(d.temperature_2m_max[i])}°</span> / <span class="tmin">${Math.round(d.temperature_2m_min[i])}°</span></div>
        ${ventFort ? '<div class="vent">💨 du vent</div>' : ''}
      </div>`;
  }
  html += '</div>';
  document.getElementById('resultat').innerHTML = html;
}

document.getElementById('villes-rapides').innerHTML = VILLES_RAPIDES
  .map(nom => `<button class="ville-pill" onclick="chercherVille('${nom}')">${nom}</button>`).join('');
document.getElementById('ville').value = 'Montréal';
chercher();
</script>
</body>
</html>
