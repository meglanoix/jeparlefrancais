<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Testez vos connaissances – Le déjeuner | JeParle Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root { --bleu: #1a3a5c; --rouge: #c0392b; --creme: #f9f5ef; --texte: #2c2c2c; --gris: #6b6b6b; --blanc: #ffffff; --vert: #1a7a4a; --ombre: 0 2px 24px rgba(26,58,92,0.10); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; color: var(--texte); background: var(--creme); min-height: 100vh; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; height: 64px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(26,58,92,0.08); box-shadow: var(--ombre); }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--bleu); text-decoration: none; }
.nav-logo span { color: var(--rouge); }
.nav-back { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--gris); font-size: 0.9rem; transition: color 0.2s; }
.nav-back:hover { color: var(--bleu); }
.nav-back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.page-header { background: var(--bleu); padding: 100px 5vw 50px; position: relative; overflow: hidden; }
.page-header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 80% 50%, rgba(42,82,152,0.5) 0%, transparent 70%); }
.page-header-inner { position: relative; z-index: 1; }
.page-eyebrow { font-size: 0.75rem; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 0.75rem; }
.page-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.8rem); color: var(--blanc); line-height: 1.1; margin-bottom: 0.5rem; }
.page-header p { font-size: 0.95rem; color: rgba(255,255,255,0.6); font-weight: 300; }
.main { max-width: 600px; margin: 0 auto; padding: 2.5rem 5vw 5rem; }
.progress-bar-wrap { height: 6px; background: rgba(26,58,92,0.12); border-radius: 99px; margin-bottom: 0.5rem; overflow: hidden; }
.progress-bar-fill { height: 100%; background: var(--vert); border-radius: 99px; transition: width 0.4s ease; }
.progress-label { font-size: 0.82rem; color: var(--gris); margin-bottom: 1.5rem; display: flex; justify-content: space-between; }
.score-badge { font-weight: 500; color: var(--vert); }
.audio-card { background: var(--blanc); border-radius: 16px; border: 1px solid rgba(26,58,92,0.08); padding: 2rem; text-align: center; margin-bottom: 1.5rem; }
.audio-label { font-size: 0.78rem; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gris); margin-bottom: 1.25rem; }
.play-btn { width: 72px; height: 72px; border-radius: 50%; background: var(--bleu); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; transition: all 0.2s; box-shadow: 0 4px 16px rgba(26,58,92,0.25); }
.play-btn:hover { transform: scale(1.05); }
.play-btn.playing { background: var(--vert); }
.play-btn svg { width: 28px; height: 28px; fill: white; margin-left: 4px; }
.play-btn.playing svg { margin-left: 0; }
.audio-wave { display: none; align-items: center; justify-content: center; gap: 4px; height: 24px; margin-top: 0.5rem; }
.audio-wave.visible { display: flex; }
.wave-bar { width: 4px; border-radius: 2px; background: var(--vert); animation: wave 0.8s ease-in-out infinite; }
.wave-bar:nth-child(1){ height: 8px; animation-delay: 0s; }
.wave-bar:nth-child(2){ height: 18px; animation-delay: 0.1s; }
.wave-bar:nth-child(3){ height: 12px; animation-delay: 0.2s; }
.wave-bar:nth-child(4){ height: 20px; animation-delay: 0.15s; }
.wave-bar:nth-child(5){ height: 8px; animation-delay: 0.05s; }
.wave-bar:nth-child(6){ height: 14px; animation-delay: 0.25s; }
@keyframes wave { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.8)} }
.audio-hint { font-size: 0.82rem; color: var(--gris); margin-top: 0.25rem; }
.choices-label { font-size: 0.82rem; color: var(--gris); text-align: center; margin-bottom: 0.75rem; }
.choices-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.choice { background: var(--blanc); border: 1.5px solid rgba(26,58,92,0.1); border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.15s; }
.choice:active { transform: scale(0.97); }
.choice.correct { border-color: var(--vert); box-shadow: 0 0 0 3px rgba(26,122,74,0.15); }
.choice.wrong { border-color: var(--rouge); box-shadow: 0 0 0 3px rgba(192,57,43,0.15); }
.choice.disabled { pointer-events: none; opacity: 0.45; }
.choice.correct.disabled { opacity: 1; }
.choice-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
.choice-img-placeholder { width: 100%; aspect-ratio: 1/1; background: var(--creme); display: flex; align-items: center; justify-content: center; font-size: 2rem; }
.feedback { text-align: center; min-height: 28px; font-size: 0.95rem; font-weight: 500; margin: 1rem 0; }
.feedback.bon { color: var(--vert); }
.feedback.mal { color: var(--rouge); }
.score-final { background: var(--blanc); border-radius: 16px; border: 1px solid rgba(26,58,92,0.08); padding: 3rem 2rem; text-align: center; display: none; }
.score-final h2 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--bleu); margin-bottom: 0.5rem; }
.score-num { font-size: 4rem; font-weight: 500; color: var(--vert); line-height: 1; margin: 1rem 0; }
.score-final p { color: var(--gris); margin-bottom: 2rem; }
.btn-rejouer { background: var(--bleu); color: var(--blanc); border: none; border-radius: 10px; padding: 0.85rem 2rem; font-size: 1rem; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: opacity 0.2s; }
.btn-rejouer:hover { opacity: 0.85; }
.loading { text-align: center; padding: 4rem 2rem; color: var(--gris); }
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">JeParle<span>Français</span>.ca</a>
  <a class="nav-back" href="les-professions.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Retour
  </a>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <p class="page-eyebrow">Le logement · Jeu</p>
    <h1>Testez vos connaissances !</h1>
    <p>Écoutez l'audio et cliquez sur la bonne image</p>
  </div>
</div>

<div class="main">
  <div id="loading" class="loading">Chargement...</div>

  <div id="jeu" style="display:none">
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="progress-label">
      <span id="progress-label">Question 1 / 10</span>
      <span class="score-badge" id="score-label">0 bonne réponse</span>
    </div>

    <div class="audio-card">
      <div class="audio-label">Quelle profession entendez-vous ?</div>
      <button class="play-btn" id="play-btn" onclick="jouerAudio()">
        <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <div class="audio-wave" id="audio-wave">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      </div>
      <p class="audio-hint" id="audio-hint">Appuyez sur ▶ pour écouter</p>
    </div>

    <div class="choices-label">Cliquez sur la bonne image</div>
    <div class="choices-grid" id="choices-grid"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="score-final" id="score-final">
    <h2>Résultat</h2>
    <div class="score-num" id="score-num"></div>
    <p id="score-msg"></p>
    <button class="btn-rejouer" onclick="startGame()">🔄 Rejouer</button>
        <a href="index.html" style="display:inline-block;margin-top:0.75rem;padding:0.85rem 2rem;background:var(--creme);color:var(--bleu);border-radius:10px;text-decoration:none;font-size:1rem;font-family:'DM Sans',sans-serif;font-weight:500;border:1.5px solid rgba(26,58,92,0.15);transition:opacity 0.2s" onmouseover="this.style.opacity=0.75" onmouseout="this.style.opacity=1">🏠 Page d'accueil</a>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o",
  authDomain: "audio-francisation.firebaseapp.com",
  projectId: "audio-francisation",
  storageBucket: "audio-francisation.firebasestorage.app",
  messagingSenderId: "840403407027",
  appId: "1:840403407027:web:46b370498fde6374aaa0c6"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let cartes = [], questions = [], qIndex = 0, score = 0, answered = false, currentAudio = null;

async function loadCartes() {
  try {
    const snap = await getDocs(collection(db, 'les-professions'));
    cartes = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(c => c.audio && c.image && c.audio && c.image);
    if (cartes.length < 3) {
      document.getElementById('loading').textContent = 'Pas assez de cartes déjeuner avec image et audio. Ajoutez du contenu dans l\'admin.';
      return;
    }
    document.getElementById('loading').style.display = 'none';
    startGame();
  } catch(e) {
    document.getElementById('loading').textContent = 'Erreur de connexion. Veuillez réessayer.';
  }
}

window.startGame = function() {
  score = 0; qIndex = 0; answered = false;
  document.getElementById('score-final').style.display = 'none';
  document.getElementById('jeu').style.display = 'block';

  const shuffled = shuffle([...cartes]);
  questions = shuffled.slice(0, 10).map(bonneCarte => {
    const autres = cartes.filter(c => c.id !== bonneCarte.id);
    const mauvais = shuffle(autres).slice(0, 2);
    const choix = shuffle([bonneCarte, ...mauvais]);
    return { bonneCarte, correctId: bonneCarte.id, choix };
  });
  afficherQuestion();
};

function afficherQuestion() {
  answered = false;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const q = questions[qIndex];
  const total = questions.length;

  document.getElementById('progress-fill').style.width = (qIndex / total * 100) + '%';
  document.getElementById('progress-label').textContent = `Question ${qIndex + 1} / ${total}`;
  document.getElementById('score-label').textContent = score === 1 ? '1 bonne réponse' : `${score} bonnes réponses`;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  const btn = document.getElementById('play-btn');
  btn.classList.remove('playing');
  document.getElementById('audio-wave').classList.remove('visible');
  document.getElementById('audio-hint').textContent = 'Appuyez sur ▶ pour écouter';

  const grid = document.getElementById('choices-grid');
  grid.innerHTML = q.choix.map((c, i) => `
    <div class="choice" id="choice-${i}" onclick="choisir(${i}, '${c.id}')">
      ${c.image ? `<img class="choice-img" src="${c.image}" alt=""/>` : `<div class="choice-img-placeholder">💼</div>`}
    </div>
  `).join('');
}

window.jouerAudio = function() {
  const q = questions[qIndex];
  if (!q.bonneCarte.audio) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const audio = new Audio(q.bonneCarte.audio);
  currentAudio = audio;
  const btn = document.getElementById('play-btn');
  btn.classList.add('playing');
  document.getElementById('audio-wave').classList.add('visible');
  document.getElementById('audio-hint').textContent = 'En cours...';
  audio.play();
  audio.onended = () => {
    btn.classList.remove('playing');
    document.getElementById('audio-wave').classList.remove('visible');
    document.getElementById('audio-hint').textContent = 'Appuyez sur ▶ pour réécouter';
    currentAudio = null;
  };
};

window.choisir = function(i, cardId) {
  if (answered) return;
  const q = questions[qIndex];
  const el = document.getElementById('choice-' + i);
  const feedback = document.getElementById('feedback');

  if (cardId === q.correctId) {
    answered = true;
    score++;
    el.classList.add('correct');
    feedback.textContent = '✓ Bonne réponse !';
    feedback.className = 'feedback bon';
    document.querySelectorAll('.choice').forEach(c => c.classList.add('disabled'));
    setTimeout(() => { qIndex++; if (qIndex >= questions.length) finJeu(); else afficherQuestion(); }, 1200);
  } else {
    el.classList.add('wrong');
    feedback.textContent = '✗ Essaie encore !';
    feedback.className = 'feedback mal';
    setTimeout(() => { el.classList.remove('wrong'); feedback.textContent = ''; feedback.className = 'feedback'; }, 800);
  }
};

function finJeu() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.getElementById('jeu').style.display = 'none';
  const sf = document.getElementById('score-final');
  sf.style.display = 'block';
  const total = questions.length;
  document.getElementById('score-num').textContent = `${score} / ${total}`;
  const pct = score / total;
  document.getElementById('score-msg').textContent = pct === 1 ? 'Parfait ! 🎉' : pct >= 0.8 ? 'Excellent ! 👏' : pct >= 0.6 ? 'Bien ! Continue à pratiquer.' : 'Continue, tu vas y arriver !';
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

loadCartes();
</script>
</body>
</html>
