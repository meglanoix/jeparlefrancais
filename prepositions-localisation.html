<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Les prépositions de localisation | JeParle Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root { --bleu: #1a3a5c; --rouge: #c0392b; --creme: #f9f5ef; --texte: #2c2c2c; --gris: #6b6b6b; --blanc: #ffffff; --vert: #1a7a4a; --ombre: 0 2px 24px rgba(26,58,92,0.10); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; color: var(--texte); background: var(--creme); min-height: 100vh; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; height: 64px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(26,58,92,0.08); box-shadow: var(--ombre); }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--bleu); text-decoration: none; }
.nav-logo span { color: var(--rouge); }
.nav-back { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--gris); font-size: 0.9rem; }
.nav-back:hover { color: var(--bleu); }
.nav-back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.page-header { background: var(--bleu); padding: 100px 5vw 50px; position: relative; overflow: hidden; }
.page-header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 80% 50%, rgba(42,82,152,0.5) 0%, transparent 70%); }
.page-header-inner { position: relative; z-index: 1; }
.page-eyebrow { font-size: 0.75rem; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 0.75rem; }
.page-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.8rem); color: var(--blanc); line-height: 1.1; margin-bottom: 0.5rem; }
.page-header p { font-size: 0.95rem; color: rgba(255,255,255,0.6); font-weight: 300; }
.tabs { display: flex; gap: 8px; padding: 1.5rem 5vw 0; flex-wrap: wrap; max-width: 1100px; margin: 0 auto; }
.tab { padding: 9px 22px; border-radius: 25px; border: 1.5px solid rgba(26,58,92,0.15); background: var(--blanc); color: var(--gris); font-size: 0.88rem; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
.tab:hover { border-color: var(--bleu); color: var(--bleu); }
.tab.active { background: var(--bleu); color: var(--blanc); border-color: var(--bleu); font-weight: 500; }
.jeu-btns { display: flex; gap: 8px; padding: 1rem 5vw 0; max-width: 1100px; margin: 0 auto; flex-wrap: wrap; }
.main { max-width: 1100px; margin: 0 auto; padding: 2rem 5vw 5rem; }
.panel { display: none; }
.panel.active { display: block; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.25rem; }
.card { background: var(--blanc); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(26,58,92,0.07); cursor: pointer; transition: all 0.2s; border: 1px solid rgba(26,58,92,0.06); }
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(26,58,92,0.13); }
.card.playing { border-color: var(--rouge); box-shadow: 0 0 0 3px rgba(192,57,43,0.15); }
.card-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: var(--creme); }
.card-img-placeholder { width: 100%; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; font-size: 3rem; background: var(--creme); }
.card-body { padding: 1rem; }
.card-mot { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--bleu); line-height: 1.3; }
.empty-grid { text-align: center; padding: 3rem; color: var(--gris); grid-column: 1/-1; }
.loading-msg { text-align: center; padding: 3rem; color: var(--gris); }
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">JeParle<span>Français</span>.ca</a>
  <a class="nav-back" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Accueil
  </a>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <p class="page-eyebrow">Les directions dans le bâtiment et la ville</p>
    <h1>Les prépositions de localisation</h1>
    <p>Cliquez sur une image pour entendre la prononciation</p>
  </div>
</div>

<div class="tabs">
  <button class="tab active" id="tab-debutant" onclick="afficherSection('debutant')">🟢 Débutant</button>
  <button class="tab" id="tab-avance" onclick="afficherSection('avance')">🔵 Avancé</button>
</div>

<div class="jeu-btns">
  <a id="jeu-btn-debutant" href="jeu-prepositions-debutant.html" style="display:inline-flex;align-items:center;gap:8px;background:var(--rouge);color:var(--blanc);text-decoration:none;padding:8px 20px;border-radius:25px;font-size:0.85rem;font-weight:500;transition:opacity 0.2s" onmouseover="this.style.opacity=0.85" onmouseout="this.style.opacity=1">🎯 Testez vos connaissances !</a>
  <a id="jeu-btn-avance" href="jeu-prepositions-avance.html" style="display:none;align-items:center;gap:8px;background:var(--rouge);color:var(--blanc);text-decoration:none;padding:8px 20px;border-radius:25px;font-size:0.85rem;font-weight:500;transition:opacity 0.2s" onmouseover="this.style.opacity=0.85" onmouseout="this.style.opacity=1">🎯 Testez vos connaissances !</a>
</div>

<div class="main">
  <div id="loading" class="loading-msg">Chargement...</div>
  <div class="panel active" id="panel-debutant">
    <div class="card-grid" id="grid-debutant"></div>
  </div>
  <div class="panel" id="panel-avance">
    <div class="card-grid" id="grid-avance"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = { apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o", authDomain: "audio-francisation.firebaseapp.com", projectId: "audio-francisation", storageBucket: "audio-francisation.firebasestorage.app", messagingSenderId: "840403407027", appId: "1:840403407027:web:46b370498fde6374aaa0c6" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let currentAudio = null;

window.afficherSection = function(section) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + section).classList.add('active');
  document.getElementById('tab-' + section).classList.add('active');
  document.getElementById('jeu-btn-debutant').style.display = section === 'debutant' ? 'inline-flex' : 'none';
  document.getElementById('jeu-btn-avance').style.display = section === 'avance' ? 'inline-flex' : 'none';
};

function renderCards(cartes, gridId) {
  const grid = document.getElementById(gridId);
  if (cartes.length === 0) { grid.innerHTML = '<div class="empty-grid">Aucune carte pour l\'instant.</div>'; return; }
  grid.innerHTML = cartes.map(c => `
    <div class="card" id="card-${c.id}" onclick="jouerAudio('${c.id}', '${(c.audio||'').replace(/'/g,"\\'")}')">
      ${c.image ? `<img class="card-img" src="${c.image}" alt="${c.mot || ''}"/>` : `<div class="card-img-placeholder">📍</div>`}
      <div class="card-body"><div class="card-mot">${(c.mot || '').split('/').map(s => s.trim()).join('<br/>')}</div></div>
    </div>`).join('');
}

window.jouerAudio = function(id, audioUrl) {
  if (!audioUrl) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
  const card = document.getElementById('card-' + id);
  if (card) card.classList.add('playing');
  const audio = new Audio(audioUrl);
  currentAudio = audio;
  audio.play();
  audio.onended = () => { if (card) card.classList.remove('playing'); currentAudio = null; };
};

async function load() {
  try {
    const [snapD, snapA] = await Promise.all([
      getDocs(collection(db, 'prepositions-debutant')),
      getDocs(collection(db, 'prepositions-avance'))
    ]);
    document.getElementById('loading').style.display = 'none';
    renderCards(snapD.docs.map(d => ({ id: d.id, ...d.data() })), 'grid-debutant');
    renderCards(snapA.docs.map(d => ({ id: d.id, ...d.data() })), 'grid-avance');
  } catch(e) {
    document.getElementById('loading').textContent = 'Erreur de connexion. Veuillez réessayer.';
  }
}
load();
</script>
</body>
</html>
