<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Les verbes du 1er groupe | JeParle Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root { --bleu: #1a3a5c; --bleu-clair: #2a5298; --rouge: #c0392b; --creme: #f9f5ef; --texte: #2c2c2c; --gris: #6b6b6b; --blanc: #ffffff; --vert: #1a7a4a; --ombre: 0 2px 24px rgba(26,58,92,0.10); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', sans-serif; color: var(--texte); background: var(--creme); }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; height: 64px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(26,58,92,0.08); box-shadow: var(--ombre); }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--bleu); text-decoration: none; }
.nav-logo span { color: var(--rouge); }
.nav-back { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--gris); font-size: 0.9rem; transition: color 0.2s; }
.nav-back:hover { color: var(--bleu); }
.nav-back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.page-header { background: var(--bleu); padding: 100px 5vw 46px; position: relative; overflow: hidden; }
.page-header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 80% 50%, rgba(42,82,152,0.5) 0%, transparent 70%); }
.page-header-inner { position: relative; z-index: 1; }
.page-eyebrow { font-size: 0.75rem; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 0.75rem; }
.page-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3.2rem); color: var(--blanc); line-height: 1.1; margin-bottom: 0.6rem; }
.page-header p { font-size: 1rem; color: rgba(255,255,255,0.65); font-weight: 300; max-width: 500px; }
.jeu-lien { display:inline-flex; align-items:center; gap:8px; background:var(--rouge); color:var(--blanc); text-decoration:none; padding:10px 22px; border-radius:25px; font-size:0.88rem; font-weight:500; margin-top:1.25rem; transition:opacity 0.2s; }
.jeu-lien:hover { opacity:0.85; }
.tabs-wrap { background: var(--blanc); border-bottom: 1px solid rgba(26,58,92,0.08); position: sticky; top: 64px; z-index: 50; }
.tab-row { display: flex; align-items: center; gap: 8px; padding: 10px 5vw; max-width: 1100px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
.tab-row::-webkit-scrollbar { display: none; }
.tab { padding: 8px 18px; border-radius: 22px; border: 1.5px solid rgba(26,58,92,0.12); background: transparent; color: var(--gris); font-size: 0.9rem; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; white-space: nowrap; flex-shrink: 0; }
.tab:hover { border-color: var(--bleu); color: var(--bleu); }
.tab.active { background: var(--bleu); color: var(--blanc); border-color: var(--bleu); font-weight: 500; }
.main { max-width: 1100px; margin: 0 auto; padding: 2.5rem 5vw 5rem; }
.panel { display: none; }
.panel.active { display: block; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.25rem; }
.card { background: var(--blanc); border-radius: 16px; border: 1px solid rgba(26,58,92,0.08); overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
.card:hover { transform: translateY(-4px); box-shadow: var(--ombre); }
.card.playing { border: 2px solid var(--vert); }
.card-img { width: 100%; aspect-ratio: 4/3; background: var(--creme); position: relative; }
.card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-img .emoji-placeholder { font-size: 5rem; width: 100%; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; background: var(--creme); }
.play-overlay { position: absolute; inset: 0; background: rgba(26,58,92,0.35); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
.card:hover .play-overlay { opacity: 1; }
.card.playing .play-overlay { opacity: 1; background: rgba(26,122,74,0.35); }
.play-btn { width: 52px; height: 52px; border-radius: 50%; background: var(--blanc); display: flex; align-items: center; justify-content: center; }
.play-btn svg { width: 22px; height: 22px; fill: var(--bleu); margin-left: 3px; }
.card.playing .play-btn svg { fill: var(--vert); }
.card-body { padding: 1rem; }
.card-word { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--bleu); margin-bottom: 2px; }
.card-audio-wave { display: none; align-items: center; gap: 3px; margin-top: 6px; height: 16px; }
.card.playing .card-audio-wave { display: flex; }
.wave-bar { width: 3px; border-radius: 2px; background: var(--vert); animation: wave 0.8s ease-in-out infinite; }
.wave-bar:nth-child(1){ height: 6px; animation-delay: 0s; }
.wave-bar:nth-child(2){ height: 12px; animation-delay: 0.1s; }
.wave-bar:nth-child(3){ height: 8px; animation-delay: 0.2s; }
.wave-bar:nth-child(4){ height: 14px; animation-delay: 0.15s; }
.wave-bar:nth-child(5){ height: 6px; animation-delay: 0.05s; }
@keyframes wave { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.8)} }
.empty-grid { text-align: center; padding: 3rem 2rem; color: var(--gris); grid-column: 1/-1; }
@media (max-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">JeParle<span>Français</span>.ca</a>
  <a class="nav-back" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Accueil
  </a>
</nav>
<div class="page-header">
  <div class="page-header-inner">
    <p class="page-eyebrow">Vocabulaire · Les verbes</p>
    <h1>Les verbes du 1er groupe</h1>
    <p>Cliquez sur une image pour entendre la prononciation</p>
      <a class="jeu-lien" href="jeu-verbes-er.html">🎯 Testez vos connaissances !</a>
  </div>
</div>
<div class="tabs-wrap">
  <div class="tab-row">
    <button class="tab active" id="tab-debutant" onclick="montrer('debutant')">⭐ Débutant</button>
    <button class="tab" id="tab-intermediaire" onclick="montrer('intermediaire')">⭐⭐ Intermédiaire</button>
    <button class="tab" id="tab-avance" onclick="montrer('avance')">⭐⭐⭐ Avancé</button>
    <button class="tab" id="tab-pronominaux" onclick="montrer('pronominaux')">🔄 Pronominaux</button>
  </div>
</div>
<div class="main">
  <div class="panel active" id="panel-debutant">
    <div class="grid" id="grid-debutant"><div class="empty-grid">Chargement…</div></div>
  </div>
  <div class="panel" id="panel-intermediaire">
    <div class="grid" id="grid-intermediaire"><div class="empty-grid">Chargement…</div></div>
  </div>
  <div class="panel" id="panel-avance">
    <div class="grid" id="grid-avance"><div class="empty-grid">Chargement…</div></div>
  </div>
  <div class="panel" id="panel-pronominaux">
    <div class="grid" id="grid-pronominaux"><div class="empty-grid">Chargement…</div></div>
  </div>
</div>
<script type="module">
function parOrdre(a, b) { const oa = typeof a.ordre==='number'?a.ordre:9999; const ob = typeof b.ordre==='number'?b.ordre:9999; return oa-ob; }
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = { apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o", authDomain: "audio-francisation.firebaseapp.com", projectId: "audio-francisation", storageBucket: "audio-francisation.firebasestorage.app", messagingSenderId: "840403407027", appId: "1:840403407027:web:46b370498fde6374aaa0c6" };
const db = getFirestore(initializeApp(firebaseConfig));
const EMOJI = '📝';
const TABS = [
  { id:'debutant', col:'verbes-er-debutant' },
  { id:'intermediaire', col:'verbes-er-intermediaire' },
  { id:'avance', col:'verbes-er-avance' },
  { id:'pronominaux', col:'verbes-pronominaux' }
];
const parTab = {};
let currentAudio = null;

window.montrer = function(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
};

function render(id, cartes) {
  const grid = document.getElementById('grid-' + id);
  if (!cartes.length) { grid.innerHTML = '<div class="empty-grid">Aucune carte pour l\'instant.</div>'; return; }
  grid.innerHTML = cartes.map((c, i) => `
    <div class="card" id="card-${id}-${i}" onclick="playCard('${id}', ${i})">
      <div class="card-img">
        ${c.image ? `<img src="${c.image}" alt="${c.mot || ''}"/>` : `<div class="emoji-placeholder">${EMOJI}</div>`}
        <div class="play-overlay"><div class="play-btn"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div></div>
      </div>
      <div class="card-body">
        <div class="card-word">${(c.mot || '').split('/').map(s=>s.trim()).join('<br/>')}</div>
        <div class="card-audio-wave"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div>
      </div>
    </div>`).join('');
}

window.playCard = function(id, i) {
  const carte = parTab[id][i];
  if (!carte || !carte.audio) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.querySelectorAll('.card').forEach(c => c.classList.remove('playing'));
  const el = document.getElementById('card-' + id + '-' + i);
  el.classList.add('playing');
  const audio = new Audio(carte.audio);
  currentAudio = audio;
  audio.play();
  audio.onended = () => { el.classList.remove('playing'); currentAudio = null; };
};

(async function load() {
  for (const t of TABS) {
    try {
      const snap = await getDocs(collection(db, t.col));
      parTab[t.id] = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(parOrdre);
      render(t.id, parTab[t.id]);
    } catch(e) {
      parTab[t.id] = [];
      document.getElementById('grid-' + t.id).innerHTML = '<div class="empty-grid">Erreur de connexion.</div>';
    }
  }
})();
</script>
</body>
</html>
