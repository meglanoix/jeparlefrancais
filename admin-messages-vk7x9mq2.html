<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin – Messages reçus | JeParle Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
:root { --bleu: #1a3a5c; --bleu-clair: #2a5298; --rouge: #c0392b; --creme: #f9f5ef; --texte: #2c2c2c; --gris: #6b6b6b; --blanc: #ffffff; --vert: #1a7a4a; --ombre: 0 2px 24px rgba(26,58,92,0.10); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; color: var(--texte); background: var(--creme); min-height: 100vh; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; height: 64px; background: rgba(255,255,255,0.97); border-bottom: 1px solid rgba(26,58,92,0.08); box-shadow: var(--ombre); }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--bleu); text-decoration: none; }
.nav-back { text-decoration: none; color: var(--gris); font-size: 0.9rem; }
.nav-back:hover { color: var(--bleu); }
.wrap { max-width: 760px; margin: 0 auto; padding: 90px 5vw 4rem; }
h1 { font-family: 'Playfair Display', serif; color: var(--bleu); font-size: 1.8rem; margin-bottom: 0.3rem; }
.sous { color: var(--gris); margin-bottom: 2rem; }
.msg { background: var(--blanc); border-radius: 14px; box-shadow: var(--ombre); padding: 1.3rem 1.5rem; margin-bottom: 1.1rem; border-left: 4px solid var(--rouge); }
.msg.lu { border-left-color: rgba(26,58,92,0.15); opacity: 0.85; }
.msg-haut { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.6rem; }
.msg-nom { font-weight: 700; color: var(--bleu); font-size: 1.05rem; }
.msg-date { font-size: 0.82rem; color: var(--gris); }
.msg-courriel { font-size: 0.9rem; margin-bottom: 0.7rem; }
.msg-courriel a { color: var(--bleu-clair); }
.msg-texte { white-space: pre-wrap; line-height: 1.5; color: var(--texte); }
.msg-actions { display: flex; gap: 0.6rem; margin-top: 1rem; }
.act { font-size: 0.85rem; padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(26,58,92,0.15); background: var(--creme); color: var(--bleu); cursor: pointer; font-family: inherit; text-decoration: none; }
.act:hover { background: rgba(26,58,92,0.08); }
.act.suppr { color: var(--rouge); border-color: rgba(192,57,43,0.25); }
.act.suppr:hover { background: rgba(192,57,43,0.08); }
.vide, .charge { text-align: center; color: var(--gris); padding: 3rem; }
.pastille { display: inline-block; background: var(--rouge); color: #fff; border-radius: 20px; font-size: 0.8rem; font-weight: 700; padding: 1px 10px; margin-left: 8px; vertical-align: middle; }
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="admin-vk7x9mq2-accueil.html">Admin · JeParle Français</a>
  <a class="nav-back" href="admin-vk7x9mq2-accueil.html">← Accueil admin</a>
</nav>
<div class="wrap">
  <h1>Messages reçus <span class="pastille" id="compte" style="display:none">0</span></h1>
  <p class="sous">Les messages envoyés depuis la page de contact.</p>
  <div id="liste"><div class="charge">Chargement…</div></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, deleteDoc, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = { apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o", authDomain: "audio-francisation.firebaseapp.com", projectId: "audio-francisation", storageBucket: "audio-francisation.firebasestorage.app", messagingSenderId: "840403407027", appId: "1:840403407027:web:46b370498fde6374aaa0c6" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COL = 'messages-contact';

function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function charger() {
  try {
    const snap = await getDocs(collection(db, COL));
    let msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    msgs.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const liste = document.getElementById('liste');
    const nonLus = msgs.filter(m => !m.lu).length;
    const c = document.getElementById('compte');
    if (nonLus > 0) { c.textContent = nonLus + ' non lu' + (nonLus > 1 ? 's' : ''); c.style.display = 'inline-block'; }
    if (msgs.length === 0) { liste.innerHTML = '<div class="vide">Aucun message pour l\'instant.</div>'; return; }
    liste.innerHTML = msgs.map(m => `
      <div class="msg ${m.lu ? 'lu' : ''}" id="m-${m.id}">
        <div class="msg-haut">
          <span class="msg-nom">${esc(m.nom) || '(sans nom)'}</span>
          <span class="msg-date">${esc(m.dateFr) || ''}</span>
        </div>
        ${m.courriel ? `<div class="msg-courriel">✉️ <a href="mailto:${esc(m.courriel)}">${esc(m.courriel)}</a></div>` : ''}
        <div class="msg-texte">${esc(m.message)}</div>
        <div class="msg-actions">
          ${m.courriel ? `<a class="act" href="mailto:${esc(m.courriel)}?subject=Re%3A%20votre%20message">Répondre</a>` : ''}
          <button class="act" onclick="marquer('${m.id}', ${m.lu ? 'false' : 'true'})">${m.lu ? 'Marquer non lu' : 'Marquer lu'}</button>
          <button class="act suppr" onclick="supprimer('${m.id}')">Supprimer</button>
        </div>
      </div>`).join('');
  } catch (e) {
    document.getElementById('liste').innerHTML = '<div class="vide">Erreur de connexion : ' + esc(e.message) + '</div>';
  }
}

window.marquer = async function(id, lu) {
  try { await updateDoc(doc(db, COL, id), { lu: lu }); charger(); } catch (e) { alert('Erreur : ' + e.message); }
};
window.supprimer = async function(id) {
  if (!confirm('Supprimer ce message ? Cette action est définitive.')) return;
  try { await deleteDoc(doc(db, COL, id)); document.getElementById('m-' + id)?.remove(); charger(); } catch (e) { alert('Erreur : ' + e.message); }
};

charger();
</script>
</body>
</html>
