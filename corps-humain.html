<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Les parties du corps | JeParle Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root { --bleu: #1a3a5c; --rouge: #c0392b; --creme: #f9f5ef; --texte: #2c2c2c; --gris: #6b6b6b; --blanc: #ffffff; --vert: #1a7a4a; --ombre: 0 2px 24px rgba(26,58,92,0.10); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; color: var(--texte); background: var(--creme); min-height: 100vh; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; height: 64px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(26,58,92,0.08); box-shadow: var(--ombre); }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--bleu); text-decoration: none; }
.nav-logo span { color: var(--rouge); }
.nav-back { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--gris); font-size: 0.9rem; transition: color 0.2s; }
.nav-back:hover { color: var(--bleu); }
.nav-back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.page-header { background: var(--bleu); padding: 100px 5vw 50px; position: relative; overflow: hidden; }
.page-header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 80% 50%, rgba(42,82,152,0.5) 0%, transparent 70%); }
.page-header-inner { position: relative; z-index: 1; }
.page-eyebrow { font-size: 0.75rem; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 0.75rem; }
.page-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.8rem); color: var(--blanc); line-height: 1.1; margin-bottom: 0.5rem; }
.page-header p { font-size: 0.95rem; color: rgba(255,255,255,0.6); font-weight: 300; }

.main { max-width: 900px; margin: 0 auto; padding: 2.5rem 5vw 5rem; }

/* Conteneur image + points */
.body-map-wrap { position: relative; display: inline-block; width: 100%; max-width: 500px; margin: 0 auto; display: flex; justify-content: center; }
.body-map-container { position: relative; display: inline-block; }
.body-img { max-width: 100%; max-height: 70vh; display: block; border-radius: 16px; }
.body-img-placeholder { width: 320px; height: 500px; background: rgba(26,58,92,0.08); border-radius: 16px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; color: var(--gris); font-size: 0.9rem; border: 2px dashed rgba(26,58,92,0.2); }

/* Points cliquables */
.body-point { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--rouge); border: 3px solid var(--blanc); cursor: pointer; transform: translate(-50%, -50%); transition: all 0.2s; box-shadow: 0 2px 8px rgba(192,57,43,0.4); z-index: 10; }
.body-point:hover, .body-point.active { background: var(--bleu); transform: translate(-50%, -50%) scale(1.3); box-shadow: 0 4px 16px rgba(26,58,92,0.4); }
.body-point::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid currentColor; opacity: 0; animation: ping 1.5s ease-out infinite; }
.body-point:hover::after { opacity: 0.3; color: var(--bleu); }
@keyframes ping { 0%{transform:scale(1);opacity:0.4} 100%{transform:scale(1.8);opacity:0} }

/* Bulle info */
.body-tooltip { position: absolute; background: var(--blanc); border-radius: 10px; padding: 0.6rem 1rem; box-shadow: 0 4px 20px rgba(26,58,92,0.2); z-index: 20; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.2s; border: 1px solid rgba(26,58,92,0.08); }
.body-tooltip.visible { opacity: 1; pointer-events: auto; }
.body-tooltip .tooltip-mot { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--bleu); font-weight: 700; }
.body-tooltip .tooltip-audio { display: flex; align-items: center; gap: 6px; margin-top: 4px; background: none; border: none; cursor: pointer; color: var(--gris); font-size: 0.8rem; font-family: 'DM Sans', sans-serif; padding: 0; }
.body-tooltip .tooltip-audio:hover { color: var(--bleu); }
.body-tooltip .tooltip-audio svg { width: 14px; height: 14px; fill: currentColor; }

/* Message vide */
.empty-msg { text-align: center; padding: 3rem; color: var(--gris); }
.empty-msg p { margin-bottom: 0.5rem; }

/* Layout */
.body-layout { display: grid; grid-template-columns: 1fr 280px; gap: 2rem; align-items: start; }
@media (max-width: 700px) { .body-layout { grid-template-columns: 1fr; } }

/* Liste des parties */
.parts-list { background: var(--blanc); border-radius: 14px; border: 1px solid rgba(26,58,92,0.08); padding: 1.25rem; }
.parts-list h3 { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--bleu); margin-bottom: 1rem; }
.part-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: background 0.15s; font-size: 0.88rem; }
.part-item:hover { background: var(--creme); }
.part-item.active { background: rgba(26,58,92,0.08); font-weight: 500; color: var(--bleu); }
.part-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rouge); flex-shrink: 0; }
.part-audio-btn { margin-left: auto; background: none; border: none; cursor: pointer; color: var(--gris); padding: 2px; }
.part-audio-btn:hover { color: var(--bleu); }
.part-audio-btn svg { width: 14px; height: 14px; fill: currentColor; }
.parts-empty { font-size: 0.85rem; color: var(--gris); text-align: center; padding: 1rem 0; }
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">JeParle<span>Français</span>.ca</a>
  <a class="nav-back" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Accueil
  </a>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <p class="page-eyebrow">Vocabulaire · Le corps humain</p>
    <h1>Les parties du corps</h1>
    <p>Cliquez sur les points pour découvrir chaque partie du corps</p>
  </div>
</div>

<div class="main">
  <div id="loading" style="text-align:center;padding:3rem;color:var(--gris)">Chargement...</div>

  <div id="content" style="display:none">
    <div class="body-layout">
      <!-- Image + points -->
      <div class="body-map-wrap">
        <div class="body-map-container" id="body-map-container">
          <!-- Image chargée dynamiquement -->
        </div>
      </div>

      <!-- Liste des parties -->
      <div class="parts-list">
        <h3>Les parties du corps</h3>
        <div id="parts-list-content"><div class="parts-empty">Aucune partie enregistrée.</div></div>
      </div>
    </div>
  </div>
</div>

<!-- Tooltip -->
<div class="body-tooltip" id="body-tooltip">
  <div class="tooltip-mot" id="tooltip-mot"></div>
  <button class="tooltip-audio" id="tooltip-audio" onclick="jouerAudioTooltip()">
    <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    Écouter
  </button>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o",
  authDomain: "audio-francisation.firebaseapp.com",
  projectId: "audio-francisation",
  storageBucket: "audio-francisation.firebasestorage.app",
  messagingSenderId: "840403407027",
  appId: "1:840403407027:web:46b370498fde6374aaa0c6"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let parties = [], currentAudio = null, activePoint = null;

async function load() {
  try {
    const snap = await getDocs(collection(db, 'corps-humain'));
    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    
    // Séparer l'image du corps et les parties
    const imgDoc = data.find(d => d.type === 'image-corps');
    parties = data.filter(d => d.type !== 'image-corps' && d.mot && d.x !== undefined && d.y !== undefined);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    const container = document.getElementById('body-map-container');

    if (imgDoc && imgDoc.image) {
      container.innerHTML = `<img class="body-img" id="body-img" src="${imgDoc.image}" alt="Corps humain"/>`;
    } else {
      container.innerHTML = `<div class="body-img-placeholder"><span style="font-size:4rem">🧍</span><p>Image du corps à ajouter dans l'admin</p></div>`;
    }

    renderPoints();
    renderList();
  } catch(e) {
    document.getElementById('loading').textContent = 'Erreur de connexion. Veuillez réessayer.';
  }
}

function renderPoints() {
  const container = document.getElementById('body-map-container');
  // Retirer les anciens points
  container.querySelectorAll('.body-point').forEach(p => p.remove());
  container.querySelectorAll('.body-tooltip-inline').forEach(p => p.remove());

  parties.forEach(p => {
    const pt = document.createElement('div');
    pt.className = 'body-point';
    pt.style.left = p.x + '%';
    pt.style.top = p.y + '%';
    pt.dataset.id = p.id;
    pt.onclick = (e) => { e.stopPropagation(); showTooltip(p, pt); };
    container.appendChild(pt);
  });
}

function renderList() {
  const list = document.getElementById('parts-list-content');
  if (parties.length === 0) {
    list.innerHTML = '<div class="parts-empty">Aucune partie enregistrée.</div>';
    return;
  }
  list.innerHTML = parties.map(p => `
    <div class="part-item" id="list-${p.id}" onclick="highlightPoint('${p.id}')">
      <div class="part-dot"></div>
      <span>${p.mot}</span>
      ${p.audio ? `<button class="part-audio-btn" onclick="event.stopPropagation();jouerAudio('${p.audio}')">
        <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>` : ''}
    </div>
  `).join('');
}

window.highlightPoint = function(id) {
  document.querySelectorAll('.body-point').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.part-item').forEach(p => p.classList.remove('active'));
  const pt = document.querySelector(`.body-point[data-id="${id}"]`);
  const li = document.getElementById('list-' + id);
  if (pt) { pt.classList.add('active'); showTooltip(parties.find(p => p.id === id), pt); }
  if (li) li.classList.add('active');
};

let tooltipAudioUrl = null;

function showTooltip(partie, pointEl) {
  if (activePoint) activePoint.classList.remove('active');
  activePoint = pointEl;
  pointEl.classList.add('active');

  // Mettre à jour la liste
  document.querySelectorAll('.part-item').forEach(p => p.classList.remove('active'));
  const li = document.getElementById('list-' + partie.id);
  if (li) li.classList.add('active');

  const tooltip = document.getElementById('body-tooltip');
  document.getElementById('tooltip-mot').textContent = partie.mot;
  tooltipAudioUrl = partie.audio || null;
  document.getElementById('tooltip-audio').style.display = partie.audio ? 'flex' : 'none';

  // Positionner le tooltip
  const rect = pointEl.getBoundingClientRect();
  tooltip.classList.add('visible');
  const ttW = 160, ttH = 70;
  let left = rect.left + window.scrollX + 16;
  let top = rect.top + window.scrollY - ttH - 8;
  if (left + ttW > window.innerWidth - 16) left = rect.left + window.scrollX - ttW - 8;
  if (top < 70) top = rect.bottom + window.scrollY + 8;
  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';

  // Jouer l'audio automatiquement
  if (partie.audio) jouerAudio(partie.audio);
}

window.jouerAudioTooltip = function() {
  if (tooltipAudioUrl) jouerAudio(tooltipAudioUrl);
};

window.jouerAudio = function(url) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const audio = new Audio(url);
  currentAudio = audio;
  audio.play();
  audio.onended = () => { currentAudio = null; };
};

// Fermer tooltip au clic ailleurs
document.addEventListener('click', (e) => {
  if (!e.target.closest('.body-point') && !e.target.closest('#body-tooltip')) {
    document.getElementById('body-tooltip').classList.remove('visible');
    if (activePoint) { activePoint.classList.remove('active'); activePoint = null; }
    document.querySelectorAll('.part-item').forEach(p => p.classList.remove('active'));
  }
});

load();
</script>
</body>
</html>
