<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Les parties du corps | JeParle Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root { --bleu: #1a3a5c; --rouge: #c0392b; --creme: #f9f5ef; --texte: #2c2c2c; --gris: #6b6b6b; --blanc: #ffffff; --vert: #1a7a4a; --ombre: 0 2px 24px rgba(26,58,92,0.10); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; color: var(--texte); background: var(--creme); min-height: 100vh; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; height: 64px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(26,58,92,0.08); box-shadow: var(--ombre); }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--bleu); text-decoration: none; }
.nav-logo span { color: var(--rouge); }
.nav-back { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--gris); font-size: 0.9rem; }
.nav-back:hover { color: var(--bleu); }
.nav-back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.page-header { background: var(--bleu); padding: 100px 5vw 50px; position: relative; overflow: hidden; }
.page-header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 80% 50%, rgba(42,82,152,0.5) 0%, transparent 70%); }
.page-header-inner { position: relative; z-index: 1; }
.page-eyebrow { font-size: 0.75rem; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 0.75rem; }
.page-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.8rem); color: var(--blanc); line-height: 1.1; margin-bottom: 0.5rem; }
.page-header p { font-size: 0.95rem; color: rgba(255,255,255,0.6); font-weight: 300; }
.main { max-width: 960px; margin: 0 auto; padding: 2rem 5vw 5rem; }
.tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
.tab { padding: 8px 20px; border-radius: 25px; border: 1.5px solid rgba(26,58,92,0.15); background: var(--blanc); color: var(--gris); font-size: 0.88rem; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
.tab:hover { border-color: var(--bleu); color: var(--bleu); }
.tab.active { background: var(--bleu); color: var(--blanc); border-color: var(--bleu); font-weight: 500; }
.body-layout { display: grid; grid-template-columns: 1fr 260px; gap: 2rem; align-items: start; }
@media(max-width:700px) { .body-layout { grid-template-columns: 1fr; } }
.body-map-container { position: relative; display: inline-block; width: 100%; }
.body-img { width: 100%; max-height: 65vh; object-fit: contain; display: block; border-radius: 14px; }
.body-placeholder { width: 100%; height: 400px; background: rgba(26,58,92,0.05); border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; color: var(--gris); border: 2px dashed rgba(26,58,92,0.15); }
.body-point { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: var(--rouge); border: 3px solid var(--blanc); cursor: pointer; transform: translate(-50%, -50%); transition: all 0.2s; box-shadow: 0 2px 8px rgba(192,57,43,0.35); z-index: 10; }
.body-point:hover, .body-point.active { background: var(--bleu); transform: translate(-50%, -50%) scale(1.3); }
.body-tooltip { position: fixed; background: var(--blanc); border-radius: 10px; padding: 0.6rem 1rem; box-shadow: 0 4px 20px rgba(26,58,92,0.2); z-index: 999; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.15s; border: 1px solid rgba(26,58,92,0.08); }
.body-tooltip.visible { opacity: 1; pointer-events: auto; }
.tooltip-mot { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--bleu); font-weight: 700; }
.tooltip-audio { display: flex; align-items: center; gap: 6px; margin-top: 4px; background: none; border: none; cursor: pointer; color: var(--gris); font-size: 0.8rem; font-family: 'DM Sans', sans-serif; padding: 0; }
.tooltip-audio:hover { color: var(--bleu); }
.tooltip-audio svg { width: 14px; height: 14px; fill: currentColor; }
.parts-list { background: var(--blanc); border-radius: 14px; border: 1px solid rgba(26,58,92,0.08); padding: 1.25rem; }
.parts-list h3 { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--bleu); margin-bottom: 1rem; }
.parts-scroll { max-height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.part-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; cursor: pointer; transition: background 0.15s; font-size: 0.85rem; }
.part-item:hover { background: var(--creme); }
.part-item.active { background: rgba(26,58,92,0.08); font-weight: 500; color: var(--bleu); }
.part-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rouge); flex-shrink: 0; }
.part-item.active .part-dot { background: var(--bleu); }
.part-audio { margin-left: auto; background: none; border: none; cursor: pointer; color: var(--gris); padding: 2px; }
.part-audio:hover { color: var(--bleu); }
.part-audio svg { width: 13px; height: 13px; fill: currentColor; display: block; }
.parts-empty { font-size: 0.85rem; color: var(--gris); text-align: center; padding: 1.5rem 0; }
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">JeParle<span>Français</span>.ca</a>
  <a class="nav-back" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Accueil
  </a>
</nav>
<div class="page-header">
  <div class="page-header-inner">
    <p class="page-eyebrow">Vocabulaire · Le corps humain</p>
    <h1>Les parties du corps</h1>
    <p>Choisissez une vue et cliquez sur les points pour découvrir chaque partie</p>
  </div>
</div>
<div class="main">
  <div id="loading" style="text-align:center;padding:3rem;color:var(--gris)">Chargement...</div>
  <div id="content" style="display:none">
    <div class="tabs" id="tabs"></div>
    <div class="body-layout">
      <div class="body-map-container" id="body-map-container"></div>
      <div class="parts-list">
        <h3 id="list-title">Les parties</h3>
        <div class="parts-scroll" id="parts-list-content"></div>
      </div>
    </div>
  </div>
</div>
<div class="body-tooltip" id="body-tooltip">
  <div class="tooltip-mot" id="tooltip-mot"></div>
  <button class="tooltip-audio" id="tooltip-audio-btn" onclick="jouerAudioTooltip()">
    <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    Écouter
  </button>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = { apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o", authDomain: "audio-francisation.firebaseapp.com", projectId: "audio-francisation", storageBucket: "audio-francisation.firebasestorage.app", messagingSenderId: "840403407027", appId: "1:840403407027:web:46b370498fde6374aaa0c6" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const VUES = [
  { id: 'face',    label: '🧍 Vue de face',  col: 'corps-face' },
  { id: 'dos',     label: '🚶 Vue de dos',   col: 'corps-dos' },
  { id: 'visage',  label: '😊 Le visage',    col: 'corps-visage' },
  { id: 'organes', label: '🫀 Les organes',  col: 'corps-organes' },
];

let cache = {}, vueActive = VUES[0], currentAudio = null, activePoint = null, tooltipAudioUrl = null;

async function loadVue(vue) {
  if (!cache[vue.id]) {
    const snap = await getDocs(collection(db, vue.col));
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    cache[vue.id] = { img: docs.find(d => d.type === 'image-corps') || null, parties: docs.filter(d => d.type !== 'image-corps' && d.mot && d.x !== undefined) };
  }
  return cache[vue.id];
}

async function afficherVue(vue) {
  vueActive = vue;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === vue.id));
  const vd = await loadVue(vue);
  const container = document.getElementById('body-map-container');
  container.innerHTML = '';
  if (vd.img && vd.img.image) {
    const img = document.createElement('img');
    img.className = 'body-img'; img.id = 'body-img'; img.src = vd.img.image;
    container.appendChild(img);
  } else {
    container.innerHTML = '<div class="body-placeholder"><span style="font-size:4rem">🧍</span><p style="font-size:0.9rem">Image à ajouter dans l\'admin</p></div>';
  }
  vd.parties.forEach(p => {
    const pt = document.createElement('div');
    pt.className = 'body-point'; pt.dataset.id = p.id;
    pt.style.left = p.x + '%'; pt.style.top = p.y + '%';
    pt.onclick = (e) => { e.stopPropagation(); showTooltip(p, pt); };
    container.appendChild(pt);
  });
  const list = document.getElementById('parts-list-content');
  list.innerHTML = vd.parties.length === 0
    ? '<div class="parts-empty">Aucune partie enregistrée.</div>'
    : vd.parties.map(p => `<div class="part-item" id="item-${p.id}" onclick="highlightPoint('${p.id}')"><div class="part-dot"></div><span>${p.mot}</span>${p.audio ? `<button class="part-audio" onclick="event.stopPropagation();jouerAudio('${p.audio}')"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>` : ''}</div>`).join('');
  closeTooltip();
}

window.highlightPoint = function(id) {
  const p = cache[vueActive.id].parties.find(p => p.id === id);
  const pt = document.querySelector(`.body-point[data-id="${id}"]`);
  if (p && pt) showTooltip(p, pt);
};

function showTooltip(partie, pointEl) {
  if (activePoint) activePoint.classList.remove('active');
  activePoint = pointEl; pointEl.classList.add('active');
  document.querySelectorAll('.part-item').forEach(i => i.classList.remove('active'));
  const item = document.getElementById('item-' + partie.id);
  if (item) { item.classList.add('active'); item.scrollIntoView({ block: 'nearest' }); }
  tooltipAudioUrl = partie.audio || null;
  document.getElementById('tooltip-mot').textContent = partie.mot;
  document.getElementById('tooltip-audio-btn').style.display = partie.audio ? 'flex' : 'none';
  const tooltip = document.getElementById('body-tooltip');
  tooltip.classList.add('visible');
  const rect = pointEl.getBoundingClientRect();
  let left = rect.right + 10, top = rect.top - 10;
  if (left + 180 > window.innerWidth - 16) left = rect.left - 190;
  if (top < 70) top = rect.bottom + 8;
  tooltip.style.left = left + 'px'; tooltip.style.top = top + 'px';
  if (partie.audio) jouerAudio(partie.audio);
}

function closeTooltip() {
  document.getElementById('body-tooltip').classList.remove('visible');
  if (activePoint) { activePoint.classList.remove('active'); activePoint = null; }
  document.querySelectorAll('.part-item').forEach(i => i.classList.remove('active'));
}

window.jouerAudioTooltip = function() { if (tooltipAudioUrl) jouerAudio(tooltipAudioUrl); };
window.jouerAudio = function(url) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const a = new Audio(url); currentAudio = a; a.play();
  a.onended = () => { currentAudio = null; };
};
document.addEventListener('click', e => { if (!e.target.closest('.body-point') && !e.target.closest('#body-tooltip')) closeTooltip(); });

const tabsEl = document.getElementById('tabs');
VUES.forEach(vue => {
  const btn = document.createElement('button');
  btn.className = 'tab'; btn.dataset.id = vue.id; btn.textContent = vue.label;
  btn.onclick = () => afficherVue(vue);
  tabsEl.appendChild(btn);
});
document.getElementById('loading').style.display = 'none';
document.getElementById('content').style.display = 'block';
afficherVue(VUES[0]);
</script>
</body>
</html>
