<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jeu – Faire connaissance | JeParle Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root { --bleu: #1a3a5c; --rouge: #c0392b; --creme: #f9f5ef; --texte: #2c2c2c; --gris: #6b6b6b; --blanc: #ffffff; --vert: #1a7a4a; --ombre: 0 2px 24px rgba(26,58,92,0.10); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; color: var(--texte); background: var(--creme); min-height: 100vh; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; height: 64px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(26,58,92,0.08); box-shadow: var(--ombre); }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--bleu); text-decoration: none; }
.nav-logo span { color: var(--rouge); }
.nav-back { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--gris); font-size: 0.9rem; }
.nav-back:hover { color: var(--bleu); }
.nav-back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.page-header { background: var(--bleu); padding: 95px 5vw 40px; position: relative; overflow: hidden; }
.page-header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 80% 50%, rgba(42,82,152,0.5) 0%, transparent 70%); }
.page-header-inner { position: relative; z-index: 1; }
.page-eyebrow { font-size: 0.75rem; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 0.6rem; }
.page-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.6rem, 4vw, 2.4rem); color: var(--blanc); line-height: 1.1; }
.main { max-width: 760px; margin: 0 auto; padding: 2.5rem 5vw 5rem; text-align: center; }
.barre { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; color: var(--gris); font-size: 0.95rem; }
.barre b { color: var(--bleu); }
.ecouter { display: inline-flex; align-items: center; gap: 10px; background: var(--bleu); color: var(--blanc); border: none; border-radius: 50px; padding: 16px 32px; font-size: 1.15rem; font-weight: 500; cursor: pointer; font-family: inherit; margin-bottom: 1.75rem; transition: opacity 0.2s; }
.ecouter:hover { opacity: 0.9; }
.ecouter.playing { background: var(--vert); }
.ecouter svg { width: 20px; height: 20px; fill: currentColor; }
.consigne { color: var(--gris); font-size: 0.95rem; margin-bottom: 1rem; }
.choix-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; max-width: 560px; margin: 0 auto; }
.choix { border: 3px solid transparent; border-radius: 14px; overflow: hidden; cursor: pointer; background: var(--blanc); box-shadow: var(--ombre); transition: transform 0.15s; padding: 0; }
.choix:hover { transform: translateY(-3px); }
.choix img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
.choix.bon { border-color: var(--vert); box-shadow: 0 8px 28px rgba(26,122,74,0.3); }
.choix.mauvais { border-color: var(--rouge); opacity: 0.6; }
.suivant { display: none; margin: 1.5rem auto 0; background: var(--rouge); color: #fff; border: none; border-radius: 12px; padding: 13px 40px; font-size: 1.05rem; font-weight: 600; cursor: pointer; font-family: inherit; }
.suivant:hover { opacity: 0.9; }
.resultat { background: var(--blanc); border-radius: 18px; box-shadow: var(--ombre); padding: 2.5rem; }
.resultat .big { font-size: 3rem; font-weight: 700; color: var(--bleu); margin: 0.5rem 0; }
.resultat h2 { font-family: 'Playfair Display', serif; color: var(--bleu); margin-bottom: 0.5rem; }
.btn2 { display: inline-block; margin-top: 1.5rem; background: var(--bleu); color: #fff; text-decoration: none; border: none; border-radius: 12px; padding: 13px 32px; font-size: 1rem; font-weight: 500; cursor: pointer; font-family: inherit; }
.msg { padding: 3rem; color: var(--gris); }
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">JeParle<span>Français</span>.ca</a>
  <a class="nav-back" href="faire-connaissance.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Retour
  </a>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <p class="page-eyebrow">En classe · Faire connaissance · Jeu</p>
    <h1 id="titre">Jeu</h1>
  </div>
</div>

<div class="main" id="main">
  <div class="msg" id="msg">Chargement…</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = { apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o", authDomain: "audio-francisation.firebaseapp.com", projectId: "audio-francisation", storageBucket: "audio-francisation.firebasestorage.app", messagingSenderId: "840403407027", appId: "1:840403407027:web:46b370498fde6374aaa0c6" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const COL = params.get('col') || 'fc-presenter';
const TITRE = params.get('t') || 'Faire connaissance';
document.getElementById('titre').textContent = TITRE;
document.title = 'Jeu – ' + TITRE + ' | JeParle Français';

const MAX_TOURS = 10;
let cartes = [];          // cartes avec image
let items = [];           // {audio, image, cardId}
let tour = 0, score = 0, ordre = [], repondu = false, audioObj = null;

function melange(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

async function charger() {
  try {
    const snap = await getDocs(collection(db, COL));
    const docs = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(d => d.image);
    cartes = docs;
    items = [];
    docs.forEach(c => {
      let audios = [];
      for (let i = 1; i <= 5; i++) if (c['audio' + i] && c['audio' + i].length > 10) audios.push(c['audio' + i]);
      if (c.audio && !audios.length) audios.push(c.audio);
      audios.forEach(url => items.push({ audio: url, image: c.image, cardId: c.id }));
    });
    if (cartes.length < 2 || items.length === 0) {
      document.getElementById('msg').textContent = 'Il faut au moins 2 images avec audio pour jouer. Ajoute des cartes dans l’admin.';
      return;
    }
    ordre = melange(items.slice()).slice(0, MAX_TOURS);
    tour = 0; score = 0;
    rendreTour();
  } catch (e) {
    document.getElementById('msg').textContent = 'Erreur de connexion. Réessaie.';
  }
}

function rendreTour() {
  repondu = false;
  const it = ordre[tour];
  // choix : la bonne image + des distracteurs (autres cartes)
  const autres = melange(cartes.filter(c => c.id !== it.cardId)).slice(0, 3);
  const choix = melange([{ image: it.image, bon: true }].concat(autres.map(c => ({ image: c.image, bon: false }))));
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="barre"><span>Question <b>${tour + 1}</b> / ${ordre.length}</span><span>Score : <b>${score}</b></span></div>
    <button class="ecouter" id="ecouter"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg> Écouter</button>
    <div class="consigne">Écoute, puis touche la bonne image.</div>
    <div class="choix-grid" id="choix">
      ${choix.map((c, i) => `<button class="choix" id="choix-${i}" data-bon="${c.bon ? 1 : 0}" onclick="repondre(${i})"><img src="${c.image}" alt=""/></button>`).join('')}
    </div>
    <button class="suivant" id="suivant" onclick="suivant()">Question suivante →</button>`;
  document.getElementById('ecouter').onclick = jouer;
  jouer();
}

function jouer() {
  const btn = document.getElementById('ecouter');
  if (audioObj) { audioObj.pause(); audioObj = null; }
  if (btn) btn.classList.add('playing');
  audioObj = new Audio(ordre[tour].audio);
  audioObj.play().catch(()=>{});
  audioObj.onended = () => { if (btn) btn.classList.remove('playing'); };
}

window.repondre = function(i) {
  if (repondu) return;
  repondu = true;
  const btns = document.querySelectorAll('#choix .choix');
  const choisi = btns[i];
  const bon = choisi.dataset.bon === '1';
  if (bon) { choisi.classList.add('bon'); score++; }
  else {
    choisi.classList.add('mauvais');
    btns.forEach(b => { if (b.dataset.bon === '1') b.classList.add('bon'); });
  }
  document.getElementById('suivant').style.display = 'block';
};

window.suivant = function() {
  tour++;
  if (tour >= ordre.length) { fin(); return; }
  rendreTour();
};

function fin() {
  if (audioObj) { audioObj.pause(); audioObj = null; }
  document.getElementById('main').innerHTML = `
    <div class="resultat">
      <h2>Bravo !</h2>
      <div class="big">${score} / ${ordre.length}</div>
      <p style="color:var(--gris)">Tu as trouvé ${score} bonne${score > 1 ? 's' : ''} réponse${score > 1 ? 's' : ''} sur ${ordre.length}.</p>
      <button class="btn2" onclick="location.reload()">Rejouer</button>
    </div>`;
}

charger();
</script>
</body>
</html>
