<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin – Jeu en direct | JeParle Français</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root { --bleu: #1a3a5c; --bleu-clair: #2a5298; --rouge: #c0392b; --creme: #f9f5ef; --texte: #2c2c2c; --gris: #6b6b6b; --blanc: #ffffff; --vert: #1a7a4a; --orange: #e67e22; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; color: var(--texte); background: var(--creme); }
.top { background: var(--bleu); color: #fff; padding: 1.5rem 5vw; }
.top .eyebrow { font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.65; }
.top h1 { font-family: 'Playfair Display', serif; font-size: 1.7rem; margin-top: 0.2rem; }
.top a.view { color: rgba(255,255,255,0.7); font-size: 0.85rem; text-decoration: none; }
.wrap { max-width: 900px; margin: 0 auto; padding: 1.5rem 5vw 5rem; }
.card { background: var(--blanc); border-radius: 14px; padding: 1.5rem; box-shadow: 0 2px 16px rgba(26,58,92,0.08); margin-bottom: 1.5rem; }
.card h2 { font-size: 1.1rem; color: var(--bleu); margin-bottom: 1rem; }
label { display: block; font-size: 0.85rem; color: var(--gris); margin: 0.75rem 0 4px; }
input[type=text] { width: 100%; padding: 10px 12px; border: 1.5px solid rgba(26,58,92,0.15); border-radius: 8px; font-family: inherit; font-size: 0.95rem; }
select { width: 100%; padding: 10px 12px; border: 1.5px solid rgba(26,58,92,0.15); border-radius: 8px; font-family: inherit; font-size: 0.95rem; background: var(--blanc); }
.upload-zone { border: 2px dashed rgba(26,58,92,0.2); border-radius: 10px; padding: 1.25rem; text-align: center; color: var(--gris); cursor: pointer; font-size: 0.9rem; }
.upload-zone.has-file { border-color: var(--vert); color: var(--vert); }
.btn { padding: 9px 20px; border-radius: 8px; border: 1.5px solid rgba(26,58,92,0.18); background: var(--blanc); font-family: inherit; font-size: 0.9rem; font-weight: 500; cursor: pointer; color: var(--bleu); }
.btn:hover { border-color: var(--bleu); }
.btn-primary { background: var(--bleu); color: #fff; border-color: var(--bleu); }
.btn-primary:hover { background: var(--bleu-clair); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 0.5rem; }
.msg { font-size: 0.85rem; margin-left: 6px; }
.msg.ok { color: var(--vert); }
.msg.err { color: var(--rouge); }
.rep-choix { display: flex; gap: 10px; margin-top: 6px; }
.rep-btn { flex: 1; padding: 0.9rem 0.5rem; border-radius: 10px; border: 2px solid rgba(26,58,92,0.15); background: var(--blanc); cursor: pointer; font-family: inherit; font-size: 0.9rem; font-weight: 500; color: var(--gris); text-align: center; }
.rep-btn .ico { font-size: 1.5rem; display: block; margin-bottom: 4px; }
.rep-btn[data-v="interdit"].sel, .rep-btn[data-v="faux"].sel { border-color: var(--rouge); background: #fdeeec; color: var(--rouge); }
.rep-btn[data-v="permis"].sel, .rep-btn[data-v="vrai"].sel { border-color: var(--vert); background: #eef7f1; color: var(--vert); }
.rep-btn[data-v="obligatoire"].sel { border-color: var(--orange); background: #fdf2e6; color: var(--orange); }
.liste-item { display: flex; align-items: center; gap: 12px; padding: 10px; border: 1px solid rgba(26,58,92,0.1); border-radius: 10px; margin-bottom: 8px; background: var(--blanc); }
.liste-item img { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; background: var(--creme); }
.liste-item .txt { flex: 1; }
.liste-item .txt .q { font-weight: 500; color: var(--bleu); }
.liste-item .txt .r { font-size: 0.8rem; margin-top: 2px; }
.liste-item .pos { font-size: 0.8rem; color: var(--gris); min-width: 24px; text-align: center; }
.mini { padding: 5px 10px; font-size: 0.8rem; border-radius: 7px; border: 1.5px solid rgba(26,58,92,0.15); background: var(--blanc); cursor: pointer; color: var(--bleu); }
.mini:hover { border-color: var(--bleu); }
.mini.del:hover { border-color: var(--rouge); color: var(--rouge); }
.count { font-size: 0.82rem; color: var(--gris); margin-bottom: 0.75rem; }
.pill { display:inline-block; padding:2px 8px; border-radius:20px; font-size:0.72rem; font-weight:600; }
.pill.interdit, .pill.faux { background:#fdeeec; color:var(--rouge); }
.pill.permis, .pill.vrai { background:#eef7f1; color:var(--vert); }
.pill.obligatoire { background:#fdf2e6; color:var(--orange); }
.quiz-item { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid rgba(26,58,92,0.1); border-radius: 12px; margin-bottom: 10px; background: var(--blanc); cursor: pointer; transition: border-color 0.15s; }
.quiz-item:hover { border-color: var(--bleu-clair); }
.quiz-item .qi-nom { flex: 1; font-weight: 500; color: var(--bleu); font-size: 1.02rem; }
.quiz-item .qi-type { font-size: 0.75rem; color: var(--gris); background: var(--creme); padding: 3px 10px; border-radius: 20px; }
.type-badge { font-size: 0.8rem; color: var(--gris); }
.back-link { color: var(--gris); font-size: 0.9rem; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 1rem; }
.back-link:hover { color: var(--bleu); }
.hidden { display: none !important; }
</style>
</head>
<body>
<script type="module" src="admin-auth.js"></script>
<div class="top">
  <p class="eyebrow">Panneau d'administration</p>
  <h1>Jeu en direct</h1>
  <a class="view" href="jeu-direct-animateur-vk7x9mq2.html" target="_blank">Ouvrir la page animateur ↗</a>
</div>

<div class="wrap">
  <!-- ÉCRAN 1 : LISTE DES QUIZ -->
  <div id="ecran-quiz">
    <div class="card">
      <h2>Créer un quiz</h2>
      <label>Nom du quiz (ex. : Règles de la classe)</label>
      <input type="text" id="quiz-nom" placeholder="Règles de la classe"/>
      <label>Type de réponses</label>
      <select id="quiz-type">
        <option value="ipo">❌ Interdit / ✅ Permis / ❗ Obligatoire</option>
        <option value="vf">✅ Vrai / ❌ Faux</option>
      </select>
      <div class="row" style="margin-top:1.25rem">
        <button class="btn btn-primary" onclick="creerQuiz()">Créer le quiz</button>
        <span class="msg" id="quiz-msg"></span>
      </div>
    </div>
    <div class="card">
      <h2>Mes quiz</h2>
      <div class="count" id="quiz-count"></div>
      <div id="quiz-liste"></div>
    </div>
  </div>

  <!-- ÉCRAN 2 : QUESTIONS D'UN QUIZ -->
  <div id="ecran-questions" class="hidden">
    <a class="back-link" onclick="retourQuiz()">← Retour aux quiz</a>
    <div class="card">
      <h2 id="q-titre">Questions</h2>
      <span class="type-badge" id="q-typebadge"></span>
      <label style="margin-top:1rem">Texte de la question (ex. : Stationner ici)</label>
      <input type="text" id="texte" placeholder="Stationner ici"/>
      <label>Image</label>
      <div class="upload-zone" id="img-zone" onclick="document.getElementById('img-input').click()">
        Cliquer pour choisir une image
        <input type="file" id="img-input" accept="image/*" style="display:none" onchange="handleImage(event)"/>
      </div>
      <label>Audio (optionnel)</label>
      <div class="row">
        <button class="btn" id="rec-btn" onclick="toggleRecord()">▶ Enregistrer</button>
        <span class="msg" id="audio-status"></span>
        <span class="msg" id="rec-timer" style="display:none;color:var(--rouge)">0:00</span>
        <button class="btn" id="audio-clear" onclick="effacerAudio()" style="display:none">Retirer l'audio</button>
      </div>
      <label>Bonne réponse</label>
      <div class="rep-choix" id="rep-choix"></div>
      <div class="row" style="margin-top:1.25rem">
        <button class="btn btn-primary" onclick="saveq()">Ajouter la question</button>
        <span class="msg" id="save-msg"></span>
      </div>
    </div>
    <div class="card">
      <h2>Questions existantes</h2>
      <div class="count" id="count"></div>
      <div id="liste"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, where } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o",
  authDomain: "audio-francisation.firebaseapp.com",
  projectId: "audio-francisation",
  storageBucket: "audio-francisation.firebasestorage.app",
  messagingSenderId: "840403407027",
  appId: "1:840403407027:web:46b370498fde6374aaa0c6"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COL_QUIZ = 'jeu-direct-quiz';
const COL_Q = 'jeu-direct-questions';

const TYPES = {
  ipo: { nom: 'Interdit / Permis / Obligatoire', reps: [
    { v: 'interdit', ico: '❌', lib: 'Interdit' },
    { v: 'permis', ico: '✅', lib: 'Permis' },
    { v: 'obligatoire', ico: '❗', lib: 'Obligatoire' }
  ]},
  vf: { nom: 'Vrai / Faux', reps: [
    { v: 'vrai', ico: '✅', lib: 'Vrai' },
    { v: 'faux', ico: '❌', lib: 'Faux' }
  ]}
};
function libRep(type, v) {
  const t = TYPES[type]; if (!t) return v;
  const r = t.reps.find(x => x.v === v); return r ? (r.ico + ' ' + r.lib) : v;
}

let quizzes = [], quizCourant = null, items = [], pendingImage = null, repChoisie = null;
let pendingAudio = null;
let mediaRecorder = null, chunks = [], recording = false, seconds = 0, timerInterval = null;

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}
window.toggleRecord = function() { recording ? stopRecord() : startRecord(); };
function startRecord() {
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    mediaRecorder = new MediaRecorder(stream);
    chunks = [];
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      pendingAudio = new Blob(chunks, { type: 'audio/webm' });
      document.getElementById('audio-status').textContent = '✓ Audio enregistré';
      document.getElementById('audio-status').className = 'msg ok';
      document.getElementById('audio-clear').style.display = 'inline-block';
    };
    mediaRecorder.start();
    recording = true; seconds = 0;
    const b = document.getElementById('rec-btn');
    b.textContent = '■ Arrêter'; b.style.borderColor = 'var(--rouge)'; b.style.color = 'var(--rouge)';
    const t = document.getElementById('rec-timer'); t.style.display = 'inline';
    timerInterval = setInterval(() => { seconds++; t.textContent = Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0'); }, 1000);
  }).catch(() => alert('Accès au microphone refusé.'));
}
function stopRecord() {
  if (mediaRecorder) { mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t => t.stop()); }
  recording = false; clearInterval(timerInterval);
  const b = document.getElementById('rec-btn');
  b.textContent = '▶ Enregistrer'; b.style.borderColor = ''; b.style.color = '';
  document.getElementById('rec-timer').style.display = 'none';
}
window.effacerAudio = function() {
  pendingAudio = null;
  document.getElementById('audio-status').textContent = '';
  document.getElementById('audio-clear').style.display = 'none';
};

window.creerQuiz = async function() {
  const nom = document.getElementById('quiz-nom').value.trim();
  const type = document.getElementById('quiz-type').value;
  const msg = document.getElementById('quiz-msg');
  if (!nom) { msg.textContent = 'Entrez un nom.'; msg.className = 'msg err'; return; }
  msg.textContent = 'Création...'; msg.className = 'msg';
  try {
    await addDoc(collection(db, COL_QUIZ), { nom, type, ordre: quizzes.length, date: new Date().toLocaleDateString('fr-CA') });
    document.getElementById('quiz-nom').value = '';
    await loadQuiz();
    msg.textContent = '✓ Quiz créé !'; msg.className = 'msg ok';
    setTimeout(() => msg.textContent = '', 2500);
  } catch(e) { msg.textContent = 'Erreur : ' + e.message; msg.className = 'msg err'; }
};

async function loadQuiz() {
  const snap = await getDocs(collection(db, COL_QUIZ));
  quizzes = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>(a.ordre??99)-(b.ordre??99));
  renderQuiz();
}

function renderQuiz() {
  const l = document.getElementById('quiz-liste');
  document.getElementById('quiz-count').textContent = quizzes.length + ' quiz';
  if (!quizzes.length) { l.innerHTML = '<div style="color:var(--gris);font-size:0.9rem">Aucun quiz pour le moment.</div>'; return; }
  l.innerHTML = '';
  quizzes.forEach(q => {
    const div = document.createElement('div');
    div.className = 'quiz-item';
    const typeNom = (TYPES[q.type] || {}).nom || q.type;
    div.innerHTML = `<span class="qi-nom">${q.nom}</span><span class="qi-type">${typeNom}</span>
      <button class="mini" onclick="event.stopPropagation();renommerQuiz('${q.id}')">✎</button>
      <button class="mini del" onclick="event.stopPropagation();supprimerQuiz('${q.id}')">🗑</button>`;
    div.onclick = () => ouvrirQuiz(q.id);
    l.appendChild(div);
  });
}

window.renommerQuiz = async function(id) {
  const q = quizzes.find(x => x.id === id); if (!q) return;
  const nouveau = prompt('Nouveau nom du quiz :', q.nom);
  if (nouveau && nouveau.trim()) { await updateDoc(doc(db, COL_QUIZ, id), { nom: nouveau.trim() }); await loadQuiz(); }
};
window.supprimerQuiz = async function(id) {
  const q = quizzes.find(x => x.id === id); if (!q) return;
  if (!confirm('Supprimer le quiz « ' + q.nom + ' » et toutes ses questions ?')) return;
  const snap = await getDocs(query(collection(db, COL_Q), where('quizId', '==', id)));
  await Promise.all(snap.docs.map(d => deleteDoc(doc(db, COL_Q, d.id))));
  await deleteDoc(doc(db, COL_QUIZ, id));
  await loadQuiz();
};

function ouvrirQuiz(id) {
  quizCourant = quizzes.find(x => x.id === id);
  if (!quizCourant) return;
  document.getElementById('ecran-quiz').classList.add('hidden');
  document.getElementById('ecran-questions').classList.remove('hidden');
  document.getElementById('q-titre').textContent = 'Questions – ' + quizCourant.nom;
  document.getElementById('q-typebadge').textContent = 'Type : ' + ((TYPES[quizCourant.type]||{}).nom || quizCourant.type);
  renderRepChoix();
  loadCards();
}
window.retourQuiz = function() {
  quizCourant = null;
  document.getElementById('ecran-questions').classList.add('hidden');
  document.getElementById('ecran-quiz').classList.remove('hidden');
  loadQuiz();
};

function renderRepChoix() {
  const box = document.getElementById('rep-choix');
  box.innerHTML = ''; repChoisie = null;
  (TYPES[quizCourant.type] || TYPES.ipo).reps.forEach(r => {
    const d = document.createElement('div');
    d.className = 'rep-btn'; d.dataset.v = r.v;
    d.innerHTML = `<span class="ico">${r.ico}</span>${r.lib}`;
    d.onclick = () => choisirRep(r.v);
    box.appendChild(d);
  });
}
function choisirRep(v) {
  repChoisie = v;
  document.querySelectorAll('#rep-choix .rep-btn').forEach(b => b.classList.toggle('sel', b.dataset.v === v));
}

window.handleImage = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const zone = document.getElementById('img-zone');
  zone.textContent = 'Compression en cours...';
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 700;
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = h * MAX / w; w = MAX; } }
      else { if (h > MAX) { w = w * MAX / h; h = MAX; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      pendingImage = canvas.toDataURL('image/jpeg', 0.78);
      zone.textContent = '✓ ' + file.name;
      zone.classList.add('has-file');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

window.saveq = async function() {
  const texte = document.getElementById('texte').value.trim();
  const msg = document.getElementById('save-msg');
  if (!texte && !pendingImage && !pendingAudio) { msg.textContent = 'Ajoutez au moins un texte, une image ou un audio.'; msg.className = 'msg err'; return; }
  if (!repChoisie) { msg.textContent = 'Choisissez la bonne réponse.'; msg.className = 'msg err'; return; }
  msg.textContent = 'Sauvegarde...'; msg.className = 'msg';
  try {
    const donnees = {
      quizId: quizCourant.id, texte, image: pendingImage || null, reponse: repChoisie,
      ordre: items.length, date: new Date().toLocaleDateString('fr-CA')
    };
    if (pendingAudio) donnees.audio = await blobToDataUrl(pendingAudio);
    await addDoc(collection(db, COL_Q), donnees);
    await loadCards();
    msg.textContent = '✓ Question ajoutée !'; msg.className = 'msg ok';
    document.getElementById('texte').value = '';
    const z = document.getElementById('img-zone');
    z.innerHTML = 'Cliquer pour choisir une image<input type="file" id="img-input" accept="image/*" style="display:none" onchange="handleImage(event)"/>';
    z.classList.remove('has-file');
    document.querySelectorAll('#rep-choix .rep-btn').forEach(b => b.classList.remove('sel'));
    effacerAudio();
    pendingImage = null; repChoisie = null;
    setTimeout(() => msg.textContent = '', 2500);
  } catch(e) { msg.textContent = 'Erreur : ' + e.message; msg.className = 'msg err'; }
};

async function loadCards() {
  const liste = document.getElementById('liste');
  liste.innerHTML = 'Chargement...';
  const snap = await getDocs(query(collection(db, COL_Q), where('quizId', '==', quizCourant.id)));
  items = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>(a.ordre??99)-(b.ordre??99));
  render();
}

function render() {
  const liste = document.getElementById('liste');
  document.getElementById('count').textContent = items.length + ' question' + (items.length > 1 ? 's' : '');
  if (!items.length) { liste.innerHTML = '<div style="color:var(--gris);font-size:0.9rem">Aucune question pour le moment.</div>'; return; }
  liste.innerHTML = '';
  items.forEach((it, i) => {
    const div = document.createElement('div');
    div.className = 'liste-item';
    div.innerHTML = `
      <span class="pos">${i + 1}</span>
      ${it.image ? `<img src="${it.image}"/>` : '<div style="width:54px;height:54px"></div>'}
      <div class="txt"><div class="q">${it.texte || ''} ${it.audio ? '🔊' : ''}</div><div class="r"><span class="pill ${it.reponse}">${libRep(quizCourant.type, it.reponse)}</span></div></div>
      <button class="mini" ${i === 0 ? 'disabled' : ''} onclick="monter('${it.id}')">↑</button>
      <button class="mini" ${i === items.length - 1 ? 'disabled' : ''} onclick="descendre('${it.id}')">↓</button>
      <button class="mini" onclick="modifierQ('${it.id}')">✎</button>
      <button class="mini del" onclick="supprimer('${it.id}')">🗑</button>`;
    liste.appendChild(div);
  });
}

async function ecrireOrdre() {
  const jobs = [];
  items.forEach((it, i) => { if (it.ordre !== i) { it.ordre = i; jobs.push(updateDoc(doc(db, COL_Q, it.id), { ordre: i })); } });
  await Promise.all(jobs);
}
window.monter = async function(id) {
  const i = items.findIndex(x => x.id === id); if (i <= 0) return;
  [items[i-1], items[i]] = [items[i], items[i-1]]; render(); await ecrireOrdre();
};
window.descendre = async function(id) {
  const i = items.findIndex(x => x.id === id); if (i < 0 || i >= items.length - 1) return;
  [items[i+1], items[i]] = [items[i], items[i+1]]; render(); await ecrireOrdre();
};
window.supprimer = async function(id) {
  if (!confirm('Supprimer cette question ?')) return;
  await deleteDoc(doc(db, COL_Q, id)); await loadCards(); await ecrireOrdre();
};

// --- Modification d'une question ---
let editId = null, editImage = null, editAudio = null, editRep = null, editAudioSupprime = false;
let editRecorder = null, editChunks = [], editRecording = false, editSeconds = 0, editTimer = null;

window.modifierQ = function(id) {
  const it = items.find(x => x.id === id);
  if (!it) return;
  editId = id; editImage = null; editAudio = null; editAudioSupprime = false;
  editRep = it.reponse;
  document.getElementById('edit-texte').value = it.texte || '';
  const z = document.getElementById('edit-img-zone');
  z.innerHTML = 'Cliquer pour remplacer l\'image<input type="file" id="edit-img-input" accept="image/*" style="display:none" onchange="handleEditImage(event)"/>';
  z.classList.remove('has-file');
  const st = document.getElementById('edit-audio-status');
  st.textContent = it.audio ? '🔊 Audio actuel' : ''; st.className = 'msg';
  document.getElementById('edit-audio-clear').style.display = it.audio ? 'inline-block' : 'none';
  document.getElementById('edit-msg').textContent = '';
  const box = document.getElementById('edit-rep-choix');
  box.innerHTML = '';
  (TYPES[quizCourant.type] || TYPES.ipo).reps.forEach(r => {
    const d = document.createElement('div');
    d.className = 'rep-btn' + (r.v === editRep ? ' sel' : ''); d.dataset.v = r.v;
    d.innerHTML = `<span class="ico">${r.ico}</span>${r.lib}`;
    d.onclick = () => { editRep = r.v; document.querySelectorAll('#edit-rep-choix .rep-btn').forEach(b => b.classList.toggle('sel', b.dataset.v === r.v)); };
    box.appendChild(d);
  });
  document.getElementById('modalq').style.display = 'flex';
};
window.fermerModalQ = function() {
  if (editRecording) stopEditRecord();
  document.getElementById('modalq').style.display = 'none';
  editId = null; editImage = null; editAudio = null;
};

window.handleEditImage = function(e) {
  const file = e.target.files[0]; if (!file) return;
  const zone = document.getElementById('edit-img-zone');
  zone.textContent = 'Compression...';
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 700;
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = h * MAX / w; w = MAX; } }
      else { if (h > MAX) { w = w * MAX / h; h = MAX; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      editImage = canvas.toDataURL('image/jpeg', 0.78);
      zone.textContent = '✓ Nouvelle image'; zone.classList.add('has-file');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

window.toggleEditRecord = function() { editRecording ? stopEditRecord() : startEditRecord(); };
function startEditRecord() {
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    editRecorder = new MediaRecorder(stream); editChunks = [];
    editRecorder.ondataavailable = e => editChunks.push(e.data);
    editRecorder.onstop = () => {
      editAudio = new Blob(editChunks, { type: 'audio/webm' });
      editAudioSupprime = false;
      const s = document.getElementById('edit-audio-status');
      s.textContent = '✓ Nouvel audio'; s.className = 'msg ok';
      document.getElementById('edit-audio-clear').style.display = 'inline-block';
    };
    editRecorder.start();
    editRecording = true; editSeconds = 0;
    const b = document.getElementById('edit-rec-btn');
    b.textContent = '■ Arrêter'; b.style.borderColor = 'var(--rouge)'; b.style.color = 'var(--rouge)';
    const t = document.getElementById('edit-rec-timer'); t.style.display = 'inline';
    editTimer = setInterval(() => { editSeconds++; t.textContent = Math.floor(editSeconds/60)+':'+String(editSeconds%60).padStart(2,'0'); }, 1000);
  }).catch(() => alert('Accès au microphone refusé.'));
}
function stopEditRecord() {
  if (editRecorder) { editRecorder.stop(); editRecorder.stream.getTracks().forEach(t => t.stop()); }
  editRecording = false; clearInterval(editTimer);
  const b = document.getElementById('edit-rec-btn');
  b.textContent = '▶ Enregistrer'; b.style.borderColor = ''; b.style.color = '';
  document.getElementById('edit-rec-timer').style.display = 'none';
}
window.effacerEditAudio = function() {
  editAudio = null; editAudioSupprime = true;
  document.getElementById('edit-audio-status').textContent = '(audio retiré)';
  document.getElementById('edit-audio-status').className = 'msg';
  document.getElementById('edit-audio-clear').style.display = 'none';
};

window.enregistrerModifQ = async function() {
  if (!editId) return;
  const texte = document.getElementById('edit-texte').value.trim();
  const msg = document.getElementById('edit-msg');
  if (!texte) { msg.textContent = 'Entrez un texte.'; msg.className = 'msg err'; return; }
  if (!editRep) { msg.textContent = 'Choisissez la bonne réponse.'; msg.className = 'msg err'; return; }
  msg.textContent = 'Sauvegarde...'; msg.className = 'msg';
  try {
    const maj = { texte, reponse: editRep };
    if (editImage) maj.image = editImage;
    if (editAudio) maj.audio = await blobToDataUrl(editAudio);
    else if (editAudioSupprime) maj.audio = null;
    await updateDoc(doc(db, COL_Q, editId), maj);
    await loadCards();
    fermerModalQ();
  } catch(e) { msg.textContent = 'Erreur : ' + e.message; msg.className = 'msg err'; }
};

loadQuiz();
</script>
<!-- Fenêtre de modification d'une question -->
<div id="modalq" style="display:none;position:fixed;inset:0;background:rgba(26,58,92,0.45);z-index:1000;align-items:center;justify-content:center;padding:1rem">
  <div style="background:var(--blanc);border-radius:16px;padding:1.75rem;width:min(94vw,460px);max-height:92vh;overflow:auto">
    <h2 style="font-size:1.15rem;color:var(--bleu);margin-bottom:1rem">Modifier la question</h2>
    <label style="display:block;font-size:0.85rem;color:var(--gris);margin-bottom:4px">Texte</label>
    <input type="text" id="edit-texte" style="width:100%;padding:10px 12px;border:1.5px solid rgba(26,58,92,0.15);border-radius:8px;font-family:inherit;font-size:0.95rem"/>
    <label style="display:block;font-size:0.85rem;color:var(--gris);margin:0.75rem 0 4px">Image (laisser vide pour garder l'actuelle)</label>
    <div class="upload-zone" id="edit-img-zone" onclick="document.getElementById('edit-img-input').click()">
      Cliquer pour remplacer l'image
      <input type="file" id="edit-img-input" accept="image/*" style="display:none" onchange="handleEditImage(event)"/>
    </div>
    <label style="display:block;font-size:0.85rem;color:var(--gris);margin:0.75rem 0 4px">Audio</label>
    <div class="row">
      <button class="btn" id="edit-rec-btn" onclick="toggleEditRecord()">▶ Enregistrer</button>
      <span class="msg" id="edit-audio-status"></span>
      <span class="msg" id="edit-rec-timer" style="display:none;color:var(--rouge)">0:00</span>
      <button class="btn" id="edit-audio-clear" onclick="effacerEditAudio()" style="display:none">Retirer l'audio</button>
    </div>
    <label style="display:block;font-size:0.85rem;color:var(--gris);margin:0.75rem 0 4px">Bonne réponse</label>
    <div class="rep-choix" id="edit-rep-choix"></div>
    <div class="row" style="margin-top:1.5rem;justify-content:flex-end">
      <button class="btn" onclick="fermerModalQ()">Annuler</button>
      <button class="btn btn-primary" onclick="enregistrerModifQ()">Enregistrer</button>
      <span class="msg" id="edit-msg"></span>
    </div>
  </div>
</div>

</body>
</html>
