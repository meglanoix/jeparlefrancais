<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>La météo et les prévisions | JeParle Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
:root { --bleu:#1a3a5c; --bleu-clair:#2a5298; --rouge:#c0392b; --creme:#f9f5ef; --texte:#2c2c2c; --gris:#6b6b6b; --blanc:#fff; --vert:#1a7a4a; --ombre:0 2px 24px rgba(26,58,92,0.10); }
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'DM Sans',sans-serif; color:var(--texte); background:var(--creme); min-height:100vh; }
nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 5vw; height:64px; background:rgba(255,255,255,0.95); backdrop-filter:blur(8px); border-bottom:1px solid rgba(26,58,92,0.08); box-shadow:var(--ombre); }
.nav-logo { font-family:'Playfair Display',serif; font-size:1.25rem; color:var(--bleu); text-decoration:none; }
.nav-logo span { color:var(--rouge); }
.nav-back { display:flex; align-items:center; gap:6px; text-decoration:none; color:var(--gris); font-size:0.9rem; }
.nav-back:hover { color:var(--bleu); }
.nav-back svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.page-header { background:var(--bleu); padding:100px 5vw 46px; position:relative; overflow:hidden; }
.page-header::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 80% 50%, rgba(42,82,152,0.5) 0%, transparent 70%); }
.page-header-inner { position:relative; z-index:1; }
.page-eyebrow { font-size:0.75rem; font-weight:500; letter-spacing:2.5px; text-transform:uppercase; color:rgba(255,255,255,0.5); margin-bottom:0.75rem; }
.page-header h1 { font-family:'Playfair Display',serif; font-size:clamp(1.8rem,4vw,2.8rem); color:var(--blanc); line-height:1.1; margin-bottom:0.5rem; }
.page-header p { font-size:0.95rem; color:rgba(255,255,255,0.6); font-weight:300; }
.main { max-width:900px; margin:0 auto; padding:2rem 5vw 5rem; }
/* onglets */
.onglets { display:flex; gap:8px; justify-content:center; margin-bottom:1.5rem; }
.onglet { padding:0.6rem 1.4rem; border-radius:24px; border:1.5px solid rgba(26,58,92,0.15); background:var(--blanc); color:var(--gris); font-family:inherit; font-size:0.95rem; font-weight:500; cursor:pointer; }
.onglet.actif { background:var(--bleu); color:#fff; border-color:var(--bleu); }
/* recherche + autocomplétion */
.recherche-wrap { position:relative; max-width:520px; margin:0 auto 1rem; }
.recherche { display:flex; gap:10px; }
.recherche input { flex:1; padding:0.9rem 1.1rem; border:1.5px solid rgba(26,58,92,0.18); border-radius:14px; font-family:inherit; font-size:1.05rem; background:var(--blanc); }
.recherche input:focus { outline:none; border-color:var(--bleu); }
.recherche button { padding:0.9rem 1.4rem; border:none; border-radius:14px; background:var(--bleu); color:#fff; font-family:inherit; font-size:1rem; font-weight:700; cursor:pointer; }
.recherche button:hover { background:var(--bleu-clair); }
.auto-liste { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--blanc); border:1px solid rgba(26,58,92,0.12); border-radius:12px; box-shadow:var(--ombre); z-index:20; overflow:hidden; display:none; }
.auto-liste.on { display:block; }
.auto-item { display:block; width:100%; text-align:left; padding:0.7rem 0.95rem; border:none; background:none; font-family:inherit; font-size:1rem; color:var(--texte); cursor:pointer; }
.auto-item:hover, .auto-item.surligne { background:var(--creme); color:var(--bleu); }
.auto-item .region { color:var(--gris); font-size:0.85rem; }
.villes-rapides { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:1.75rem; }
.ville-pill { padding:7px 15px; border-radius:20px; border:1.5px solid rgba(26,58,92,0.15); background:var(--blanc); color:var(--bleu); font-size:0.9rem; cursor:pointer; font-family:inherit; font-weight:500; }
.ville-pill:hover { border-color:var(--bleu); background:var(--bleu); color:#fff; }
.etat { text-align:center; color:var(--gris); padding:1.5rem; font-size:1.02rem; }
.etat.err { color:var(--rouge); }
/* Météo actuelle */
.actuelle { background:var(--bleu); color:#fff; border-radius:22px; padding:1.9rem 1.5rem; text-align:center; margin-bottom:1.75rem; box-shadow:var(--ombre); }
.actuelle .lieu { font-size:1.1rem; opacity:0.85; margin-bottom:0.3rem; }
.actuelle .lieu .pays { opacity:0.65; font-size:0.85rem; }
.actuelle .emoji { font-size:5.5rem; line-height:1; margin:0.3rem 0; }
.actuelle .mot { font-family:'Playfair Display',serif; font-size:2rem; text-transform:capitalize; }
.actuelle .temp-ligne { display:flex; align-items:baseline; justify-content:center; gap:12px; margin-top:0.4rem; }
.actuelle .temp { font-size:2.6rem; font-weight:700; }
.actuelle .ressenti-mini { font-size:1rem; opacity:0.75; }
.actuelle .détails { font-size:1rem; opacity:0.88; margin-top:0.5rem; }
.actuelle .vent { font-size:1.05rem; margin-top:0.5rem; background:rgba(255,255,255,0.15); display:inline-block; padding:4px 14px; border-radius:20px; }
.prevision-texte { background:var(--blanc); border:1px solid rgba(26,58,92,0.08); border-left:4px solid var(--bleu-clair); border-radius:14px; padding:1.1rem 1.25rem; margin-bottom:1.75rem; font-size:1.05rem; line-height:1.6; box-shadow:0 2px 12px rgba(26,58,92,0.06); }
.prevision-texte strong { color:var(--bleu); }
.titre-prev { font-family:'Playfair Display',serif; color:var(--bleu); font-size:1.25rem; margin:0 0 1rem 2px; }
.prev-grille { display:grid; grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:1rem; }
.jour { background:var(--blanc); border:1px solid rgba(26,58,92,0.08); border-radius:18px; padding:1.1rem 0.6rem; text-align:center; box-shadow:0 2px 12px rgba(26,58,92,0.06); }
.jour .nom-jour { font-weight:700; color:var(--bleu); font-size:0.95rem; text-transform:capitalize; }
.jour .date-jour { font-size:0.74rem; color:var(--gris); margin-bottom:0.4rem; }
.jour .emoji { font-size:2.7rem; line-height:1; margin:0.3rem 0; }
.jour .mot { font-size:0.95rem; color:var(--bleu); min-height:2.4em; display:flex; align-items:center; justify-content:center; text-transform:capitalize; }
.jour .temps { margin-top:0.4rem; font-size:1rem; }
.jour .tmax { color:var(--rouge); font-weight:700; }
.jour .tmin { color:var(--bleu-clair); }
.jour .pluie { margin-top:0.3rem; font-size:0.8rem; color:var(--bleu-clair); }
.jour .quantite { font-size:0.78rem; color:var(--gris); margin-top:2px; }
.jour .vent { font-size:0.78rem; color:var(--gris); margin-top:0.3rem; }
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">JeParle<span>Français</span>.ca</a>
  <a class="nav-back" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Accueil
  </a>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <p class="page-eyebrow">La météo et la circulation</p>
    <h1>La météo et les prévisions</h1>
    <p>Choisis une ville, puis l'affichage simple ou détaillé</p>
  </div>
</div>

<div class="main">
  <div class="onglets">
    <button class="onglet actif" id="ong-simple" onclick="changerMode('simple')">☀️ Simple</button>
    <button class="onglet" id="ong-detaille" onclick="changerMode('detaille')">📊 Détaillé</button>
  </div>

  <div class="recherche-wrap">
    <form class="recherche" onsubmit="validerRecherche(); return false;">
      <input type="text" id="ville" placeholder="Écris une ville… (ex. Montréal)" autocomplete="off"/>
      <button type="submit">Voir</button>
    </form>
    <div class="auto-liste" id="auto-liste"></div>
  </div>
  <div class="villes-rapides" id="villes-rapides"></div>

  <div id="etat" class="etat">Choisis une ville.</div>
  <div id="resultat"></div>
</div>

<script>
// Open-Meteo : gratuit, sans clé. Une seule page, deux affichages (Simple / Détaillé).
const VILLES_RAPIDES = ['Montréal','Québec','Longueuil','Laval','Gatineau','Sherbrooke','Trois-Rivières'];
const VENT_FORT = 30; // km/h
function motVent(v) { return v >= 50 ? 'Vents violents' : 'Vent fort'; }
// La nuit, un ciel clair n'est pas « ensoleillé »
function motSimpleActuel(code, isDay) {
  if (isDay === 0) {
    if (code === 0 || code === 1) return ['🌙','dégagé'];
    if (code === 2) return ['☁️','nuages'];
  }
  return motSimple(code);
}
function condDetailActuel(code, isDay) {
  if (isDay === 0) {
    if (code === 0) return ['🌙','Dégagé'];
    if (code === 1) return ['🌙','Généralement dégagé'];
    if (code === 2) return ['☁️','Partiellement nuageux'];
  }
  return condDetail(code);
}
let mode = 'simple';
let villeChoisie = null;   // résultat de géocodage sélectionné
let meteoData = null;      // données de prévision
let autoRes = [];          // résultats de l'autocomplétion
let autoIndex = -1;        // item surligné au clavier

const JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

// --- vocabulaire SIMPLE (juste le mot) ---
function motSimple(code) {
  const m = {
    0:['☀️','soleil'],1:['☀️','soleil'],2:['🌤️','soleil et nuages'],3:['☁️','nuages'],
    45:['🌫️','brouillard'],48:['🌫️','brouillard'],
    51:['🌧️','pluie'],53:['🌧️','pluie'],55:['🌧️','pluie'],
    56:['🧊','verglas'],57:['🧊','verglas'],
    61:['🌧️','pluie'],63:['🌧️','pluie'],65:['🌧️','pluie'],
    66:['🧊','verglas'],67:['🧊','verglas'],
    71:['🌨️','neige'],73:['🌨️','neige'],77:['🌨️','neige'],75:['❄️','tempête de neige'],
    80:['🌦️','averses'],81:['🌦️','averses'],82:['🌦️','averses'],
    85:['🌨️','neige'],86:['❄️','tempête de neige'],
    95:['⛈️','orage'],96:['🧊','grêle'],99:['🧊','grêle']
  };
  return m[code] || ['🌡️','—'];
}
// --- vocabulaire DÉTAILLÉ (adjectifs) ---
function condDetail(code) {
  const m = {
    0:['☀️','Ensoleillé'],1:['🌤️','Généralement ensoleillé'],2:['⛅','Alternance de soleil et de nuages'],3:['☁️','Nuageux'],
    45:['🌫️','Brouillard'],48:['🌫️','Brouillard givrant'],
    51:['🌦️','Bruine'],53:['🌦️','Bruine'],55:['🌦️','Bruine'],
    56:['🌧️','Bruine verglaçante'],57:['🌧️','Bruine verglaçante'],
    61:['🌦️','Pluie intermittente'],63:['🌧️','Pluie'],65:['🌧️','Pluie forte'],
    66:['🌧️','Pluie verglaçante'],67:['🌧️','Pluie verglaçante'],
    71:['🌨️','Faible neige'],73:['🌨️','Neige'],75:['❄️','Neige abondante'],77:['🌨️','Neige fine'],
    80:['🌦️','Averses dispersées'],81:['🌧️','Averses'],82:['⛈️','Averses fortes'],
    85:['🌨️','Averses de neige'],86:['❄️','Averses de neige'],
    95:['⛈️','Orages'],96:['⛈️','Orages avec grêle'],99:['⛈️','Orages avec grêle']
  };
  return m[code] || ['🌡️','—'];
}
// Type de précipitation d'après le code météo : 'neige', 'pluie' ou null (aucune)
function typePrecip(code) {
  if ([71,73,75,77,85,86].indexOf(code) >= 0) return 'neige';
  if ([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].indexOf(code) >= 0) return 'pluie';
  return null;
}
function motPrecip(code) { const t = typePrecip(code); return t === 'neige' ? 'Neige' : (t === 'pluie' ? 'Pluie' : 'Précipitation'); }
function quantitePrecip(d, i) {
  const parts = [];
  const neige = (d.snowfall_sum && d.snowfall_sum[i] != null) ? d.snowfall_sum[i] : 0;
  let pluie = (d.rain_sum && d.rain_sum[i] != null) ? d.rain_sum[i] : 0;
  if (!pluie && d.precipitation_sum && d.precipitation_sum[i] != null && !neige) pluie = d.precipitation_sum[i];
  if (neige > 0) parts.push('❄️ ' + (Math.round(neige*10)/10) + ' cm');
  if (pluie > 0) parts.push('🌧️ ' + (Math.round(pluie*10)/10) + ' mm');
  return parts;
}

function majEtat(txt, err) {
  const el = document.getElementById('etat');
  el.textContent = txt; el.className = 'etat' + (err ? ' err' : '');
  el.style.display = txt ? 'block' : 'none';
}

// Priorité : Canada d'abord, puis Québec
function scoreLieu(v) { return (v.country_code === 'CA' ? 2 : 0) + (/qu[ée]bec/i.test(v.admin1 || '') ? 1 : 0); }
// « St- » / « Ste- » / « St. » -> « Saint- » / « Sainte- » (plus fiable pour les villes du Québec)
function normaliserVille(q) {
  return q
    .replace(/\bste[\.\-\s]+/gi, 'Sainte-')
    .replace(/\bst[\.\-\s]+/gi, 'Saint-');
}
async function geocoder(nom, nb) {
  nom = normaliserVille(nom);
  const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(nom) + '&count=' + (nb||10) + '&language=fr&format=json').then(x => x.json());
  const res = (r.results || []).slice();
  res.sort((a, b) => scoreLieu(b) - scoreLieu(a)); // tri stable : Québec/Canada en premier
  return res;
}

// ---------- autocomplétion (empêche les fautes) ----------
const input = document.getElementById('ville');
let autoTimer = null;
input.addEventListener('input', () => {
  clearTimeout(autoTimer);
  const q = input.value.trim();
  if (q.length < 2) { fermerAuto(); return; }
  autoTimer = setTimeout(async () => {
    try { autoRes = (await geocoder(q, 8)).slice(0, 6); autoIndex = -1; afficherAuto(); }
    catch (e) { fermerAuto(); }
  }, 250);
});
input.addEventListener('keydown', (e) => {
  const box = document.getElementById('auto-liste');
  if (!box.classList.contains('on')) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); autoIndex = Math.min(autoIndex + 1, autoRes.length - 1); surligner(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); autoIndex = Math.max(autoIndex - 1, 0); surligner(); }
  else if (e.key === 'Enter' && autoIndex >= 0) { e.preventDefault(); choisirLieu(autoIndex); }
  else if (e.key === 'Escape') { fermerAuto(); }
});
document.addEventListener('click', (e) => { if (!e.target.closest('.recherche-wrap')) fermerAuto(); });

function afficherAuto() {
  const box = document.getElementById('auto-liste');
  if (!autoRes.length) { fermerAuto(); return; }
  box.innerHTML = autoRes.map((v, i) =>
    `<button type="button" class="auto-item" onclick="choisirLieu(${i})">${v.name}<span class="region"> — ${[v.admin1, v.country].filter(Boolean).join(', ')}</span></button>`
  ).join('');
  box.classList.add('on');
}
function surligner() {
  const items = document.querySelectorAll('#auto-liste .auto-item');
  items.forEach((it, i) => it.classList.toggle('surligne', i === autoIndex));
}
function fermerAuto() { const box = document.getElementById('auto-liste'); box.classList.remove('on'); box.innerHTML = ''; }

window.choisirLieu = function(i) {
  const v = autoRes[i]; if (!v) return;
  input.value = v.name;
  fermerAuto();
  chargerMeteo(v);
};

// bouton « Voir » ou touche Entrée : on prend la 1re proposition (Québec/Canada d'abord)
window.validerRecherche = async function() {
  const nom = input.value.trim();
  if (!nom) { majEtat('Écris le nom d\'une ville.', true); return; }
  fermerAuto();
  majEtat('Recherche…', false);
  try {
    const res = await geocoder(nom, 10);
    if (!res.length) { majEtat('Ville introuvable. Essaie une autre orthographe.', true); return; }
    chargerMeteo(res[0]);
  } catch (e) { majEtat('Erreur de connexion. Réessaie.', true); }
};

window.chercherVille = async function(nom) {
  input.value = nom; fermerAuto(); majEtat('Chargement…', false);
  try { const res = await geocoder(nom, 10); if (res.length) chargerMeteo(res[0]); }
  catch (e) { majEtat('Erreur de connexion. Réessaie.', true); }
};

async function chargerMeteo(v) {
  villeChoisie = v;
  majEtat('Chargement…', false);
  try {
    const url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + v.latitude + '&longitude=' + v.longitude
      + '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day'
      + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,rain_sum,snowfall_sum,precipitation_sum,wind_speed_10m_max'
      + '&timezone=auto&forecast_days=4';
    meteoData = await fetch(url).then(r => r.json());
    majEtat('', false);
    rendre();
  } catch (e) { majEtat('Erreur de connexion. Réessaie.', true); }
}

window.changerMode = function(m) {
  mode = m;
  document.getElementById('ong-simple').classList.toggle('actif', m === 'simple');
  document.getElementById('ong-detaille').classList.toggle('actif', m === 'detaille');
  if (meteoData) rendre();
};

function rendre() {
  if (!villeChoisie || !meteoData) return;
  (mode === 'simple') ? rendreSimple() : rendreDetaille();
}

// ---------- affichage SIMPLE ----------
function rendreSimple() {
  const v = villeChoisie, cur = meteoData.current, d = meteoData.daily;
  const [emoji, mot] = motSimpleActuel(cur.weather_code, cur.is_day);
  const ventAuj = cur.wind_speed_10m >= VENT_FORT;
  let html = `
    <div class="actuelle">
      <div class="lieu">${v.name}${v.admin1 ? ', ' + v.admin1 : ''}</div>
      <div class="emoji">${emoji}</div>
      <div class="mot">${mot}</div>
      <div class="temp-ligne"><span class="temp">${Math.round(cur.temperature_2m)}°C</span><span class="ressenti-mini">ressenti ${Math.round(cur.apparent_temperature)}°</span></div>
      ${ventAuj ? '<div class="vent">💨 du vent</div>' : ''}
    </div>
    <div class="titre-prev">Les prévisions pour aujourd'hui et les prochains jours</div>
    <div class="prev-grille">`;
  for (let i = 0; i < d.time.length; i++) {
    const dt = new Date(d.time[i] + 'T12:00');
    const [em, mo] = motSimple(d.weather_code[i]);
    const nom = (i === 0) ? "Aujourd'hui" : JOURS[dt.getDay()];
    const vent = d.wind_speed_10m_max && d.wind_speed_10m_max[i] >= VENT_FORT;
    html += `
      <div class="jour">
        <div class="nom-jour">${nom}</div>
        <div class="date-jour">${dt.getDate()} ${MOIS[dt.getMonth()]}</div>
        <div class="emoji">${em}</div>
        <div class="mot">${mo}</div>
        <div class="temps"><span class="tmax">${Math.round(d.temperature_2m_max[i])}°</span> / <span class="tmin">${Math.round(d.temperature_2m_min[i])}°</span></div>
        ${vent ? '<div class="vent">💨 du vent</div>' : ''}
      </div>`;
  }
  html += '</div>';
  document.getElementById('resultat').innerHTML = html;
}

// ---------- affichage DÉTAILLÉ ----------
function rendreDetaille() {
  const v = villeChoisie, cur = meteoData.current, d = meteoData.daily;
  const [emoji, cond] = condDetailActuel(cur.weather_code, cur.is_day);
  const maxAuj = Math.round(d.temperature_2m_max[0]);
  const minAuj = Math.round(d.temperature_2m_min[0]);
  const ressenti = Math.round(cur.apparent_temperature);
  const pluieAuj = (d.precipitation_probability_max && d.precipitation_probability_max[0] != null) ? d.precipitation_probability_max[0] : null;
  let html = `
    <div class="actuelle">
      <div class="lieu">${v.name}${v.admin1 ? ', ' + v.admin1 : ''} <span class="pays">${v.country || ''}</span></div>
      <div class="emoji">${emoji}</div>
      <div class="mot" style="font-size:1.6rem">${cond}</div>
      <div class="temp-ligne"><span class="temp">${Math.round(cur.temperature_2m)}°C</span><span class="ressenti-mini">ressenti ${ressenti}°</span></div>
      ${cur.wind_speed_10m >= VENT_FORT ? `<div class="vent">💨 ${motVent(cur.wind_speed_10m)} (${Math.round(cur.wind_speed_10m)} km/h)</div>` : ''}
    </div>`;
  html += `<div class="titre-prev">Les prévisions pour aujourd'hui et les prochains jours</div><div class="prev-grille">`;
  for (let i = 0; i < d.time.length; i++) {
    const dt = new Date(d.time[i] + 'T12:00');
    const [em, co] = condDetail(d.weather_code[i]);
    const nom = (i === 0) ? "Aujourd'hui" : JOURS[dt.getDay()];
    html += `
      <div class="jour">
        <div class="nom-jour">${nom}</div>
        <div class="date-jour">${dt.getDate()} ${MOIS[dt.getMonth()]}</div>
        <div class="emoji">${em}</div>
        <div class="mot">${co}</div>
        <div class="temps"><span class="tmax">${Math.round(d.temperature_2m_max[i])}°</span> / <span class="tmin">${Math.round(d.temperature_2m_min[i])}°</span></div>
        ${(d.precipitation_probability_max && d.precipitation_probability_max[i] != null) ? `<div class="pluie">💧 ${motPrecip(d.weather_code[i])} ${d.precipitation_probability_max[i]} %</div>` : ''}
        ${quantitePrecip(d, i).map(q => `<div class="quantite">${q}</div>`).join('')}
        ${(d.wind_speed_10m_max && d.wind_speed_10m_max[i] >= VENT_FORT) ? `<div class="vent">💨 ${motVent(d.wind_speed_10m_max[i])} (${Math.round(d.wind_speed_10m_max[i])} km/h)</div>` : ''}
      </div>`;
  }
  html += '</div>';
  document.getElementById('resultat').innerHTML = html;
}

// init
document.getElementById('villes-rapides').innerHTML = VILLES_RAPIDES
  .map(nom => `<button class="ville-pill" onclick="chercherVille('${nom}')">${nom}</button>`).join('');
chercherVille('Montréal');
</script>
