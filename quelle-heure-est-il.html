<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quelle heure est-il ? | JeParle Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: classroom wall clock, calm and very legible, read from the back of the room */
:root{color-scheme:light dark;
--bg:light-dark(#eef1f8,#121a33);--ink:light-dark(#1e2761,#eef1fb);--soft:light-dark(#5a6070,#aab2cc);
--face:light-dark(#ffffff,#f7f8fc);--faceInk:#1e2761;--coral:#e8505b;--teal:#028090;--card:light-dark(#ffffff,#1c2547);
--line:light-dark(#d7dceb,#2d3760);--chip:light-dark(#eef2fb,#26305a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip;padding-top:64px}
.site-nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;height:64px;background:light-dark(rgba(255,255,255,0.95),rgba(18,26,51,0.95));backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.site-nav .logo{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--ink);text-decoration:none}
.site-nav .logo span{color:var(--coral)}
.site-nav a.back{display:flex;align-items:center;gap:6px;color:var(--soft);text-decoration:none;font-family:'DM Sans',sans-serif;font-size:0.9rem}
.site-nav a.back:hover{color:var(--ink)}
.site-nav a.back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{max-width:1240px;margin:0 auto;padding:clamp(16px,3vw,36px) max(4vw,16px);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(20px,3vw,44px);align-items:center;min-height:calc(100vh - 64px)}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
h1{margin:0;font-size:clamp(30px,4vw,46px);line-height:1.05;text-wrap:balance;align-self:flex-start}
.clockbox{width:min(100%,72vh,620px);aspect-ratio:1;position:relative}
.clockbox svg{width:100%;height:100%;display:block}
.digital{font-weight:700;font-size:clamp(84px,14vw,170px);line-height:1;letter-spacing:.01em;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.digital.small{font-size:clamp(44px,6vw,72px)}
.panel{display:flex;flex-direction:column;gap:16px}
.btn{font:inherit;font-weight:700;font-size:22px;border:0;border-radius:14px;min-height:64px;padding:12px 22px;cursor:pointer;color:#fff;background:var(--coral);box-shadow:0 4px 0 #b8343e}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b8343e}
.btn.sec{background:var(--teal);box-shadow:0 4px 0 #015b66}
.btn.sec:active{box-shadow:0 2px 0 #015b66}
.btn:focus-visible,.chips button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.group{background:var(--card);border-radius:16px;padding:14px 16px}
.group h2{margin:0 0 8px;font-size:15px;font-weight:700;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-size:16px;min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.answer{background:var(--card);border-radius:16px;padding:18px 20px;min-height:170px}
.answer .w{font-size:clamp(34px,4vw,48px);font-weight:700;line-height:1.1;white-space:nowrap}
.answer ul{margin:10px 0 0;padding:0;list-style:none}
.answer li{font-size:clamp(19px,1.8vw,23px);padding:6px 0;border-top:1px solid var(--line)}
.answer li:first-child{border-top:0}
.answer .tag{font-size:14px;color:var(--soft);margin-left:6px}
.hidden{color:var(--soft);font-size:18px}
.foot{font-size:14px;color:var(--soft)}
kbd{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:0 6px}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr);min-height:0}.clockbox{width:min(100%,520px)}}
@media(prefers-reduced-motion:no-preference){#hHand,#mHand{transition:transform .6s cubic-bezier(.3,1.4,.5,1)}}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="logo" href="index.html">JeParle<span>Français</span>.ca</a>
  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Accueil
  </a>
</nav>
<main>
  <section class="stage">
    <h1>Quelle heure est-il ?</h1>
    <div class="clockbox" id="clockbox">
      <svg viewBox="-110 -110 220 220" aria-label="Horloge" role="img">
        <circle r="104" fill="var(--face)" stroke="#1e2761" stroke-width="6"/>
        <g id="ticks"></g><g id="nums"></g>
        <g id="hHand"><line x1="0" y1="10" x2="0" y2="-50" stroke="#e8505b" stroke-width="8" stroke-linecap="round"/></g>
        <g id="mHand"><line x1="0" y1="14" x2="0" y2="-80" stroke="#028090" stroke-width="5" stroke-linecap="round"/></g>
        <circle r="6" fill="#1e2761"/>
      </svg>
    </div>
    <div class="digital" id="digital" hidden></div>
  </section>

  <section class="panel">
    <div class="row">
      <button class="btn" id="next">Nouvelle heure</button>
      <button class="btn sec" id="reveal">Réponse</button>
    </div>

    <div class="answer" id="answer" aria-live="polite"><p class="hidden">Les élèves disent l'heure à voix haute. Puis cliquez sur « Réponse ».</p></div>

    <div class="group">
      <h2>On montre</h2>
      <div class="chips" data-k="show">
        <button data-v="clock" aria-pressed="true">l'horloge</button>
        <button data-v="digits" aria-pressed="false">les chiffres</button>
        <button data-v="both" aria-pressed="false">les deux</button>
      </div>
    </div>
    <div class="group">
      <h2>Les minutes</h2>
      <div class="chips" data-k="step">
        <button data-v="60" aria-pressed="false">heures justes</button>
        <button data-v="15" aria-pressed="false">quarts d'heure</button>
        <button data-v="5" aria-pressed="true">5 minutes</button>
        <button data-v="1" aria-pressed="false">toutes</button>
      </div>
    </div>
    <div class="group">
      <h2>Les chiffres</h2>
      <div class="chips" data-k="sys">
        <button data-v="12" aria-pressed="true">1h à 12h</button>
        <button data-v="24" aria-pressed="false">0h à 23h</button>
      </div>
    </div>
    <p class="foot">Clavier : <kbd>Espace</kbd> nouvelle heure · <kbd>R</kbd> réponse</p>
  </section>
</main>

<script>
{
const $ = id => document.getElementById(id);
const S = { show: 'clock', step: 5, sys: 12, h: 6, m: 5, shown: false };
try { Object.assign(S, JSON.parse(localStorage.getItem('heure-hasard') || '{}'), { shown: false }); } catch (e) {}

// cadran
let ticks = '', nums = '';
for (let i = 0; i < 60; i++) {
  const big = i % 5 === 0, a = i * 6 * Math.PI / 180, r1 = big ? 86 : 92, r2 = 98;
  ticks += `<line x1="${(r1*Math.sin(a)).toFixed(2)}" y1="${(-r1*Math.cos(a)).toFixed(2)}" x2="${(r2*Math.sin(a)).toFixed(2)}" y2="${(-r2*Math.cos(a)).toFixed(2)}" stroke="${big ? '#1e2761' : '#9aa0b0'}" stroke-width="${big ? 3 : 1.2}" stroke-linecap="round"/>`;
}
for (let k = 1; k <= 12; k++) {
  const a = k * 30 * Math.PI / 180, r = 70;
  nums += `<text x="${(r*Math.sin(a)).toFixed(2)}" y="${(-r*Math.cos(a)).toFixed(2)}" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="700" fill="#1e2761" font-family="Atkinson Hyperlegible, sans-serif">${k}</text>`;
}
$('ticks').innerHTML = ticks; $('nums').innerHTML = nums;

// nombres en lettres (orthographe rectifiée : traits d'union partout)
const U = ['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
const T = {20:'vingt',30:'trente',40:'quarante',50:'cinquante'};
function nb(n, fem) {
  let s;
  if (n < 20) s = U[n];
  else { const d = Math.floor(n / 10) * 10, u = n % 10; s = u === 0 ? T[d] : u === 1 ? T[d] + '-et-un' : T[d] + '-' + U[u]; }
  if (fem && s.endsWith('un')) s += 'e';
  return s;
}
function heure(h) { // h de 0 à 23 (oral)
  if (h === 0) return 'minuit';
  if (h === 12) return 'midi';
  return h === 1 ? 'une heure' : nb(h, true) + ' heures';
}
function plus(hs, txt) { return hs + ' ' + txt; }

function forms(h24, m) {
  const out = [];
  const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
  const hs = S.sys === 24 ? heure(h24 % 12 === 0 ? h24 : h24 % 12) : (h12 === 12 ? 'midi' : heure(h12));
  const nextH = S.sys === 24 ? (h24 + 1) % 24 : (h12 % 12) + 1;
  const ns = S.sys === 24 ? heure(nextH % 12 === 0 ? nextH : nextH % 12) : (nextH === 12 ? 'midi' : heure(nextH));
  const mf = nb(m, true);
  if (S.sys === 24 && h24 > 12) {
    const h24s = h24 === 1 ? 'une heure' : nb(h24, true) + ' heures';
    out.push([m === 0 ? h24s : h24s + ' ' + mf, 'sur 24 heures']);
  }
  if (m === 0) { out.push([hs, '']); out.push([hs + ' pile', 'exactement']); }
  else if (m === 15) { out.push([plus(hs, 'quinze'), '']); out.push([plus(hs, 'et quart'), '']); }
  else if (m === 30) { out.push([plus(hs, 'trente'), '']); out.push([plus(hs, /midi|minuit/.test(hs) ? 'et demi' : 'et demie'), '']); }
  else if (m < 30) { out.push([plus(hs, mf), '']); if (m % 5 === 0) out.push([plus(hs, 'et ' + mf), 'on entend aussi']); }
  else if (m === 45) { out.push([plus(hs, 'quarante-cinq'), '']); out.push([plus(ns, 'moins quart'), '']); }
  else { out.push([plus(hs, mf), '']); out.push([plus(ns, 'moins ' + nb(60 - m, true)), '']); }
  if (S.sys === 12 && h12 === 12) out.push(['(ou minuit, la nuit)', '']);
  if (S.sys === 24) {
    const mom = h24 === 0 || h24 === 12 ? '' : h24 < 5 ? ' de la nuit' : h24 < 12 ? ' du matin' : h24 < 18 ? " de l'après-midi" : ' du soir';
    if (mom) out.push([out[h24 > 12 ? 1 : 0][0] + mom, 'pour préciser']);
  }
  return out;
}
function written(h, m) { return (S.sys === 24 ? h : (h % 12 === 0 ? 12 : h % 12)) + 'h' + String(m).padStart(2, '0'); }

function pick() {
  let h, m, tries = 0;
  do {
    h = Math.floor(Math.random() * (S.sys === 24 ? 24 : 12)) + (S.sys === 24 ? 0 : 1);
    m = S.step === 60 ? 0 : Math.floor(Math.random() * (60 / S.step)) * S.step;
    tries++;
  } while (h === S.h && m === S.m && tries < 20);
  S.h = h; S.m = m; S.shown = false; render();
}
function render() {
  const showClock = S.show !== 'digits', showDig = S.show !== 'clock';
  $('clockbox').hidden = !showClock;
  $('digital').hidden = !showDig;
  $('digital').classList.toggle('small', showClock && showDig);
  $('digital').textContent = written(S.h, S.m);
  $('hHand').setAttribute('transform', `rotate(${((S.h % 12) + S.m / 60) * 30})`);
  $('mHand').setAttribute('transform', `rotate(${S.m * 6})`);
  const ans = $('answer');
  if (!S.shown) { ans.innerHTML = '<p class="hidden">Les élèves disent l\'heure à voix haute. Puis cliquez sur « Réponse ».</p>'; }
  else {
    const esc = t => t.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    ans.innerHTML = `<div class="w">${esc(written(S.h, S.m))}</div><ul>${forms(S.h, S.m).map(([t, g]) => `<li>${esc(t)}${g ? `<span class="tag">${esc(g)}</span>` : ''}</li>`).join('')}</ul>`;
  }
  document.querySelectorAll('.chips').forEach(c => c.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(String(S[c.dataset.k]) === b.dataset.v))));
  try { localStorage.setItem('heure-hasard', JSON.stringify({ show: S.show, step: S.step, sys: S.sys })); } catch (e) {}
}
document.querySelectorAll('.chips').forEach(c => c.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const k = c.dataset.k; S[k] = k === 'show' ? b.dataset.v : Number(b.dataset.v);
  pick();
}));
$('next').addEventListener('click', pick);
$('reveal').addEventListener('click', () => { S.shown = !S.shown; render(); });
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); pick(); }
  if (e.key === 'r' || e.key === 'R') { S.shown = !S.shown; render(); }
});
pick();
}
</script>
</body>
</html>
