<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jeu – L'entretien des vêtements | JeParle Français</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root { --bleu:#1a3a5c; --bleu-clair:#2a5298; --rouge:#c0392b; --creme:#f9f5ef; --texte:#2c2c2c; --gris:#6b6b6b; --blanc:#fff; --vert:#1a7a4a; --orange:#e67e22; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body { font-family:'DM Sans',sans-serif; color:var(--texte); background:var(--creme); display:flex; flex-direction:column; }
.bar { background:var(--bleu); color:#fff; padding:0.9rem 1.25rem; display:flex; align-items:center; justify-content:space-between; }
.bar .logo { font-family:'Playfair Display',serif; font-size:1.05rem; }
.bar .logo span { color:#ff9d8a; }
.bar a.retour { color:rgba(255,255,255,0.85); text-decoration:none; font-size:0.9rem; }
.score { font-size:0.9rem; color:rgba(255,255,255,0.85); }
.zone { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1.5rem; text-align:center; }
h2 { font-family:'Playfair Display',serif; color:var(--bleu); font-size:1.6rem; margin-bottom:0.5rem; }
.sous { color:var(--gris); font-size:1rem; margin-bottom:1.5rem; }
.btn { padding:1.1rem 2.6rem; border-radius:14px; border:none; font-family:inherit; font-size:1.3rem; font-weight:700; cursor:pointer; background:var(--bleu); color:#fff; }
.btn:hover { background:var(--bleu-clair); }
.btn:active { transform:scale(0.98); }
.btn-son { display:inline-flex; align-items:center; gap:10px; padding:1rem 2rem; border-radius:50px; background:var(--vert); color:#fff; border:none; font-family:inherit; font-size:1.2rem; font-weight:700; cursor:pointer; margin-bottom:1.75rem; }
.btn-son:active { transform:scale(0.97); }
.choix { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; width:100%; max-width:760px; }
.choix .im { background:var(--blanc); border:3px solid rgba(26,58,92,0.12); border-radius:18px; overflow:hidden; cursor:pointer; transition:transform 0.12s, border-color 0.2s; }
.choix .im:hover { transform:translateY(-4px); }
.choix .im img { width:100%; aspect-ratio:4/3; object-fit:contain; background:var(--creme); display:block; }
.choix .im.bon { border-color:var(--vert); box-shadow:0 6px 24px rgba(26,122,74,0.25); }
.choix .im.mauvais { border-color:var(--rouge); opacity:0.55; }
.feedback { min-height:1.6em; margin-top:1.25rem; font-size:1.15rem; font-weight:700; }
.feedback.ok { color:var(--vert); }
.feedback.non { color:var(--rouge); }
.chargement { color:var(--gris); }
@media (max-width:560px) { .choix { gap:0.6rem; } h2 { font-size:1.3rem; } }
</style>
</head>
<body>
<div class="bar">
  <div class="logo">JeParle<span>Français</span></div>
  <div class="score" id="score"></div>
  <a class="retour" href="entretien-vetements.html">Retour ›</a>
</div>
<div class="zone" id="zone"><div class="chargement">Chargement…</div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o",
  authDomain: "audio-francisation.firebaseapp.com",
  projectId: "audio-francisation",
  storageBucket: "audio-francisation.firebasestorage.app",
  messagingSenderId: "840403407027",
  appId: "1:840403407027:web:46b370498fde6374aaa0c6"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COL = 'entretien-vetements';

const zone = document.getElementById('zone');
const scoreEl = document.getElementById('score');
let cartes = [], cible = null, bonnes = 0, total = 0, verrou = false;

let player = null;
function debloquerAudio() {
  if (!player) { player = new Audio(); player.setAttribute('playsinline',''); }
  try { player.play().then(()=>player.pause()).catch(()=>{}); } catch(e) {}
}
function jouerSon() {
  if (!cible || !cible.audio) return;
  if (!player) { player = new Audio(); player.setAttribute('playsinline',''); }
  player.src = cible.audio;
  player.play().catch(()=>{});
}
window.jouerSon = jouerSon;

function melanger(arr) {
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function majScore() { scoreEl.textContent = total ? `✅ ${bonnes} / ${total}` : ''; }

function ecranDepart() {
  zone.innerHTML = `
    <h2>🎧 Écoute et trouve la bonne image</h2>
    <div class="sous">Tu entends un mot, clique sur l'image qui correspond.</div>
    <button class="btn" onclick="commencer()">Commencer ▶</button>`;
}
window.ecranDepart = ecranDepart;

window.commencer = function() {
  debloquerAudio();     // débloque le son pendant le tap (tablette)
  bonnes = 0; total = 0; majScore();
  tour();
};

function tour() {
  verrou = false;
  const jouables = cartes.filter(c => c.image && c.audio);
  if (jouables.length < 3) {
    zone.innerHTML = `<h2>Oups</h2><div class="sous">Il faut au moins 3 cartes avec image + audio pour jouer.</div>`;
    return;
  }
  const trois = melanger(jouables).slice(0, 3);
  cible = trois[Math.floor(Math.random() * 3)];
  const imgs = melanger(trois);
  zone.innerHTML = `
    <button class="btn-son" onclick="jouerSon()">🔊 Réécouter</button>
    <div class="choix">
      ${imgs.map((c,i) => `<div class="im" id="im-${i}" data-bon="${c.id === cible.id}" onclick="choisir(${i})"><img src="${c.image}" alt=""/></div>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>`;
  jouerSon();
}

window.choisir = function(i) {
  if (verrou) return;
  const el = document.getElementById('im-' + i);
  const bon = el.getAttribute('data-bon') === 'true';
  const fb = document.getElementById('feedback');
  if (bon) {
    verrou = true;
    el.classList.add('bon');
    bonnes++; total++; majScore();
    fb.className = 'feedback ok'; fb.textContent = '✅ Bravo !';
    setTimeout(tour, 1100);
  } else {
    el.classList.add('mauvais');
    total++; majScore();
    fb.className = 'feedback non'; fb.textContent = '❌ Essaie encore — réécoute le son.';
    jouerSon();
  }
};

async function charger() {
  const snap = await getDocs(collection(db, COL));
  cartes = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  ecranDepart();
}
charger();
</script>
</body>
</html>
