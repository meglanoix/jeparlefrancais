<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Exprimer ses goûts | JeParle Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root { --bleu: #1a3a5c; --rouge: #c0392b; --creme: #f9f5ef; --texte: #2c2c2c; --gris: #6b6b6b; --blanc: #ffffff; --vert: #1a7a4a; --ombre: 0 2px 24px rgba(26,58,92,0.10); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; color: var(--texte); background: var(--creme); min-height: 100vh; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; height: 64px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(26,58,92,0.08); box-shadow: var(--ombre); }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--bleu); text-decoration: none; }
.nav-logo span { color: var(--rouge); }
.nav-back { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--gris); font-size: 0.9rem; }
.nav-back:hover { color: var(--bleu); }
.nav-back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.page-header { background: var(--bleu); padding: 100px 5vw 50px; position: relative; overflow: hidden; }
.page-header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 80% 50%, rgba(42,82,152,0.5) 0%, transparent 70%); }
.page-header-inner { position: relative; z-index: 1; }
.page-eyebrow { font-size: 0.75rem; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 0.75rem; }
.page-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.8rem); color: var(--blanc); line-height: 1.1; margin-bottom: 0.5rem; }
.page-header p { font-size: 0.95rem; color: rgba(255,255,255,0.6); font-weight: 300; }
.main { max-width: 1100px; margin: 0 auto; padding: 2.5rem 5vw 5rem; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
.card { background: var(--blanc); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(26,58,92,0.07); border: 1px solid rgba(26,58,92,0.06); transition: all 0.2s; }
.card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(26,58,92,0.13); }
.card-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: var(--creme); }
.card-img-placeholder { width: 100%; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; font-size: 3rem; background: var(--creme); }
.card-body { padding: 0.9rem; }
.card-mot { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--bleu); margin-bottom: 0.75rem; line-height: 1.3; }
/* Boutons audio multiples */
.audio-list { display: flex; flex-direction: column; gap: 6px; }
.audio-btn { display: flex; align-items: center; gap: 8px; background: var(--creme); border: 1px solid rgba(26,58,92,0.1); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; color: var(--texte); transition: all 0.15s; text-align: left; width: 100%; }
.audio-btn:hover { background: rgba(26,58,92,0.08); border-color: var(--bleu); color: var(--bleu); }
.audio-btn.playing { background: var(--bleu); color: var(--blanc); border-color: var(--bleu); }
.audio-btn svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }
.empty-grid { text-align: center; padding: 3rem; color: var(--gris); grid-column: 1/-1; }
.loading-msg { text-align: center; padding: 3rem; color: var(--gris); }
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">JeParle<span>Français</span>.ca</a>
  <a class="nav-back" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Accueil
  </a>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <p class="page-eyebrow">La description physique et les vêtements · Exprimer ses goûts</p>
    <h1>Exprimer ses goûts</h1>
    <p>Cliquez sur les boutons pour entendre les différentes façons d'exprimer chaque situation</p>
    <div style="margin-top:1.25rem">
      <a href="jeu-exprimer-gouts.html" style="display:inline-flex;align-items:center;gap:8px;background:var(--rouge);color:var(--blanc);text-decoration:none;padding:10px 22px;border-radius:25px;font-size:0.88rem;font-weight:500;transition:opacity 0.2s" onmouseover="this.style.opacity=0.85" onmouseout="this.style.opacity=1">
        👍👎 Jeu : Aime ou n'aime pas ?
      </a>
    </div>
  </div>
</div>

<div class="main">
  <div id="loading" class="loading-msg">Chargement...</div>
  <div class="card-grid" id="card-grid"></div>
</div>

<script type="module">
function parOrdreCartes(a, b) {
  const oa = typeof a.ordre === 'number' ? a.ordre : 9999;
  const ob = typeof b.ordre === 'number' ? b.ordre : 9999;
  return oa - ob;
}
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const firebaseConfig = { apiKey: "AIzaSyCdBoJMNk7brcdc8lGktN0AFbVJ1Dj_r8o", authDomain: "audio-francisation.firebaseapp.com", projectId: "audio-francisation", storageBucket: "audio-francisation.firebasestorage.app", messagingSenderId: "840403407027", appId: "1:840403407027:web:46b370498fde6374aaa0c6" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let currentAudio = null, currentBtn = null;

async function load() {
  try {
    const snap = await getDocs(collection(db, 'exprimer-gouts'));
    const cartes = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(parOrdreCartes);
    document.getElementById('loading').style.display = 'none';
    const grid = document.getElementById('card-grid');
    if (cartes.length === 0) {
      grid.innerHTML = '<div class="empty-grid">Aucune carte pour l\'instant.</div>';
      return;
    }
    grid.innerHTML = cartes.map(c => {
      // Collecter tous les audios : audio1, audio2, audio3, audio4, audio5
      const audios = [];
      for (let i = 1; i <= 5; i++) {
        const a = c[`audio${i}`], l = c[`label${i}`];
        if (a && a.length > 10) audios.push({ url: a, label: l || `Expression ${i}` });
      }
      // Rétrocompat : si audio (sans numéro) existe
      if (c.audio && audios.length === 0) audios.push({ url: c.audio, label: c.mot || 'Écouter' });

      return `
        <div class="card">
          ${c.image ? `<img class="card-img" src="${c.image}" alt="${c.mot || ''}"/>` : `<div class="card-img-placeholder">💬</div>`}
          <div class="card-body">
            <div class="card-mot">${(c.mot || '').split('/').map(s => s.trim()).join('<br/>')}</div>
            <div class="audio-list">
              ${audios.map((a, i) => `
                <button class="audio-btn" id="abtn-${c.id}-${i}" onclick="jouerAudio('${a.url}', '${c.id}-${i}')">
                  <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                  ${a.label}
                </button>
              `).join('')}
            </div>
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('loading').textContent = 'Erreur de connexion. Veuillez réessayer.';
  }
}

window.jouerAudio = function(url, btnId) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (currentBtn) { currentBtn.classList.remove('playing'); currentBtn = null; }
  const btn = document.getElementById('abtn-' + btnId);
  if (btn) { btn.classList.add('playing'); currentBtn = btn; }
  const audio = new Audio(url);
  currentAudio = audio;
  audio.play();
  audio.onended = () => { if (btn) btn.classList.remove('playing'); currentAudio = null; currentBtn = null; };
};

load();
</script>
</body>
</html>
