<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Image au hasard | JeParle Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root { --bleu: #1a3a5c; --bleu-clair: #2a5298; --rouge: #c0392b; --creme: #f9f5ef; --texte: #2c2c2c; --gris: #6b6b6b; --blanc: #ffffff; --vert: #1a7a4a; --ombre: 0 2px 24px rgba(26,58,92,0.10); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; color: var(--texte); background: var(--creme); min-height: 100vh; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 5vw; height: 64px; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(26,58,92,0.08); box-shadow: var(--ombre); }
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--bleu); text-decoration: none; }
.nav-logo span { color: var(--rouge); }
.nav-back { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--gris); font-size: 0.9rem; }
.nav-back:hover { color: var(--bleu); }
.nav-back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.page-header { background: var(--bleu); padding: 100px 5vw 50px; position: relative; overflow: hidden; }
.page-header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 80% 50%, rgba(42,82,152,0.5) 0%, transparent 70%); }
.page-header-inner { position: relative; z-index: 1; }
.page-eyebrow { font-size: 0.75rem; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 0.75rem; }
.page-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3rem); color: var(--blanc); line-height: 1.1; margin-bottom: 0.5rem; }
.page-header p { font-size: 0.95rem; color: rgba(255,255,255,0.6); font-weight: 300; }
.main { max-width: 820px; margin: 0 auto; padding: 2.5rem 5vw 5rem; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.25rem; }
.cat-card { display: flex; align-items: center; gap: 1rem; background: var(--blanc); border-radius: 16px; padding: 1.4rem 1.5rem; text-decoration: none; color: var(--texte); box-shadow: 0 2px 12px rgba(26,58,92,0.07); border: 1px solid rgba(26,58,92,0.06); transition: transform 0.2s, box-shadow 0.2s; }
.cat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 26px rgba(26,58,92,0.15); }
.cat-emoji { font-size: 2.4rem; flex-shrink: 0; }
.cat-body { flex: 1; }
.cat-title { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--bleu); margin-bottom: 2px; }
.cat-sub { font-size: 0.82rem; color: var(--gris); }
.cat-arrow { font-size: 1.1rem; color: var(--rouge); flex-shrink: 0; }
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">JeParle<span>Français</span>.ca</a>
  <a class="nav-back" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Accueil
  </a>
</nav>

<div class="page-header">
  <div class="page-header-inner">
    <p class="page-eyebrow">FIA 330-1 · Groupe 270719</p>
    <h1>🎲 Image au hasard</h1>
    <p>Choisis une catégorie pour voir des images au hasard</p>
  </div>
</div>

<div class="main">
  <div class="cat-grid" id="cat-grid"></div>
</div>

<script>
// Pour ajouter une catégorie plus tard : ajoute une ligne ici { col, titre, emoji, sous }
const CATEGORIES = [
  { col: 'fc-informel', titre: 'Les questions pour faire connaissance', emoji: '💬', sous: 'Poser des questions (informel)' },
  { col: 'demander-infos-personnelles', titre: 'Demander les infos personnelles', emoji: '🗣️', sous: 'Les questions à poser' },
  { href: 'quelle-heure-est-il.html', titre: "L'heure", emoji: '🕐', sous: 'Quelle heure est-il ?' }
];
const grid = document.getElementById('cat-grid');
grid.innerHTML = CATEGORIES.map(c =>
  `<a class="cat-card" href="${c.href ? c.href : 'image-hasard.html?col=' + encodeURIComponent(c.col) + '&t=' + encodeURIComponent(c.titre)}">
    <div class="cat-emoji">${c.emoji}</div>
    <div class="cat-body"><div class="cat-title">${c.titre}</div><div class="cat-sub">${c.sous}</div></div>
    <div class="cat-arrow">→</div>
  </a>`).join('');
</script>
</body>
</html>
